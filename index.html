                >
                  🟣 Custom
                </button>
                <button
                  onClick={() => setTariffFilter('LOW_STOCK')}
                  className={`px-2 py-1 rounded-lg font-semibold transition ${
                    tariffFilter === 'LOW_STOCK' ? 'bg-amber-950 text-amber-300 border border-amber-700' : 'text-slate-400 hover:text-amber-300'
                  }`}
                >
                  ⚠️ Low Stock
                </button>
              </div>
            </div>

            {/* Table */}
            <div className="flex-1 overflow-y-auto">
              <table className="w-full text-left text-xs border-collapse">
                <thead className="bg-slate-950 text-slate-400 sticky top-0 border-b border-slate-800">
                  <tr>
                    <th className="p-2.5">Product & Barcode</th>
                    <th className="p-2.5 text-right">Selling Price (₱ SRP)</th>
                    <th className="p-2.5 text-right hidden sm:table-cell">Cost & Margin</th>
                    <th className="p-2.5 text-center">Tariff / BIR Tax</th>
                    <th className="p-2.5 text-right">Stock</th>
                    <th className="p-2.5 text-center">Action</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800/80">
                  {filtered.map(p => {
                    const isEditing = editingId === p.id;
                    const isLow = p.stock <= 10;
                    const margin = p.price > 0 && p.cost ? (((p.price - p.cost) / p.price) * 100).toFixed(0) : null;
                    const isExempt = p.isVatExempt || p.tariffCategory === 'EXEMPT';
                    const isCustom = p.tariffCategory === 'CUSTOM';

                    return (
                      <tr key={p.id} className="hover:bg-slate-850/50">
                        {/* Product Name & Barcode */}
                        <td className="p-2.5 font-medium text-slate-200">
                          <div className="flex items-center">
                            <span className="mr-1.5 text-base">{p.image}</span>
                            <div>
                              <div className="font-semibold text-xs line-clamp-1">{p.name}</div>
                              <div className="text-[10px] text-slate-400 font-mono">
                                {p.barcode} {p.plu ? `• PLU: ${p.plu}` : ''}
                              </div>
                            </div>
                          </div>
                        </td>

                        {/* Selling Price (₱ SRP) */}
                        <td className="p-2.5 text-right font-mono">
                          {isEditing ? (
                            <div className="flex items-center justify-end gap-1">
                              <span className="text-emerald-400 font-bold">₱</span>
                              <input
                                type="number"
                                step="0.25"
                                value={editPrice}
                                onChange={(e) => setEditPrice(e.target.value)}
                                className="w-20 bg-slate-950 border border-emerald-500 rounded px-1.5 py-0.5 text-right text-xs text-emerald-400 font-mono font-bold"
                              />
                            </div>
                          ) : (
                            <button
                              onClick={() => startEdit(p)}
                              className="font-bold text-emerald-400 hover:underline"
                              title="Click to edit selling price"
                            >
                              {formatPHP(p.price)}
                              <span className="text-[9px] text-slate-500 font-normal ml-0.5">/{p.unit}</span>
                            </button>
                          )}
                        </td>

                        {/* Cost & Margin */}
                        <td className="p-2.5 text-right font-mono text-[11px] hidden sm:table-cell">
                          {isEditing ? (
                            <div className="flex items-center justify-end gap-1">
                              <span className="text-slate-400">₱</span>
                              <input
                                type="number"
                                step="0.25"
                                value={editCost}
                                onChange={(e) => setEditCost(e.target.value)}
                                className="w-18 bg-slate-950 border border-slate-700 rounded px-1.5 py-0.5 text-right text-xs text-slate-200 font-mono"
                              />
                            </div>
                          ) : (
                            <div>
                              <span className="text-slate-400">{formatPHP(p.cost || 0)}</span>
                              {margin !== null && (
                                <span className={`text-[10px] ml-1 font-semibold ${parseInt(margin) > 15 ? 'text-emerald-400' : 'text-amber-400'}`}>
                                  ({margin}%)
                                </span>
                              )}
                            </div>
                          )}
                        </td>

                        {/* Tariff / BIR Tax Classification */}
                        <td className="p-2.5 text-center">
                          {isEditing ? (
                            <select
                              value={editTariffCategory}
                              onChange={(e) => setEditTariffCategory(e.target.value)}
                              className="bg-slate-950 border border-slate-700 rounded px-1.5 py-0.5 text-[10px] font-mono text-slate-200 focus:outline-none"
                            >
                              <option value="VATABLE">🟢 VATable ({defaultVat}%)</option>
                              <option value="EXEMPT">🟡 VAT-Exempt (0%)</option>
                              <option value="ZERO_RATED">🔵 Zero-Rated (0%)</option>
                              <option value="CUSTOM">🟣 Custom Tariff %</option>
                            </select>
                          ) : (
                            <button
                              onClick={() => toggleTariff(p)}
                              className="text-[10px] px-2 py-0.5 rounded-full font-mono font-bold transition hover:scale-105"
                              title="Click to toggle between VATable and VAT-Exempt"
                            >
                              {isCustom ? (
                                <span className="bg-purple-950 text-purple-300 border border-purple-800/60 px-1.5 py-0.5 rounded-full">
                                  T ({p.tariffRate || defaultVat}%)
                                </span>
                              ) : isExempt ? (
                                <span className="bg-teal-950 text-teal-300 border border-teal-800/60 px-1.5 py-0.5 rounded-full">
                                  Exempt (0%)
                                </span>
                              ) : (
                                <span className="bg-slate-800 text-slate-300 border border-slate-700 px-1.5 py-0.5 rounded-full">
                                  {defaultVat}% VAT
                                </span>
                              )}
                            </button>
                          )}
                        </td>

                        {/* Stock */}
                        <td className="p-2.5 text-right font-mono">
                          {isEditing ? (
                            <input
                              type="number"
                              value={editStock}
                              onChange={(e) => setEditStock(e.target.value)}
                              className="w-16 bg-slate-950 border border-emerald-500 rounded px-1.5 py-0.5 text-right text-xs text-slate-200 font-mono"
                            />
                          ) : (
                            <span className={isLow ? 'text-amber-400 font-bold' : 'text-slate-300'}>
                              {p.stock} <span className="text-[9px] text-slate-500">{p.unit}</span>
                            </span>
                          )}
                        </td>

                        {/* Actions */}
                        <td className="p-2.5 text-center space-x-1 whitespace-nowrap">
                          {isEditing ? (
                            <div className="flex items-center justify-center gap-1">
                              <button
                                onClick={() => saveEdit(p.id)}
                                className="px-2.5 py-1 bg-emerald-600 hover:bg-emerald-500 rounded text-[11px] font-bold text-white shadow"
                              >
                                Save
                              </button>
                              <button
                                onClick={() => setEditingId(null)}
                                className="px-2 py-1 bg-slate-800 hover:bg-slate-700 rounded text-[11px] text-slate-400"
                              >
                                Cancel
                              </button>
                            </div>
                          ) : (
                            <>
                              <button
                                onClick={() => startEdit(p)}
                                className="px-2 py-0.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-[11px] font-medium"
                              >
                                ✎ Edit
                              </button>
                              <button
                                onClick={() => restockItem(p.id, p.isWeighed ? 20 : 50)}
                                className="px-2 py-0.5 bg-slate-800 hover:bg-slate-700 text-emerald-400 rounded text-[11px] font-medium"
                                title="Add +20/50 stock"
                              >
                                +Stock
                              </button>
                            </>
                          )}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>

            {/* Footer */}
            <div className="p-2.5 bg-slate-850 border-t border-slate-800 flex items-center justify-between shrink-0">
              <span className="text-[11px] text-slate-400">
                Click any price or tariff tag to edit instantly.
              </span>
              <button
                onClick={onClose}
                className="px-4 py-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs font-semibold text-slate-200"
              >
                Close
              </button>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================
    // 📊 SHIFT SALES & BIR Z-REPORT MODAL
    // =========================================================
    function ShiftReportModal({ sales, cashierName, storeInfo, onClose }) {
      const shiftSummary = useMemo(() => {
        let totalRevenue = 0;
        let totalCash = 0;
        let totalGCash = 0;
        let totalMaya = 0;
        let totalCard = 0;
        let totalVat = 0;
        let totalVatExempt = 0;
        let totalDiscounts = 0;

        sales.forEach(sale => {
          totalRevenue += sale.totals.totalDue;
          totalVat += sale.totals.vatAmount;
          totalVatExempt += sale.totals.vatExemptGross;
          totalDiscounts += sale.totals.scDiscount;

          if (sale.payment.method === 'CASH') totalCash += sale.totals.totalDue;
          else if (sale.payment.method === 'GCASH') totalGCash += sale.totals.totalDue;
          else if (sale.payment.method === 'MAYA') totalMaya += sale.totals.totalDue;
          else if (sale.payment.method === 'CARD') totalCard += sale.totals.totalDue;
        });

        return {
          totalOrders: sales.length,
          totalRevenue,
          totalCash,
          totalGCash,
          totalMaya,
          totalCard,
          totalVat,
          totalVatExempt,
          totalDiscounts,
          avgTicket: sales.length ? (totalRevenue / sales.length) : 0
        };
      }, [sales]);

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-2.5 md:p-4">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-2xl w-full overflow-hidden shadow-2xl flex flex-col max-h-[92dvh]">
            
            <div className="p-3.5 md:p-4 bg-slate-850 border-b border-slate-800 flex items-center justify-between shrink-0">
              <div className="flex items-center space-x-2">
                <span className="text-xl">📊</span>
                <div>
                  <h3 className="font-bold text-xs md:text-sm text-slate-100">Shift Sales & Z-Report</h3>
                  <p className="text-[10px] md:text-xs text-slate-400">Cashier: {cashierName} • {new Date().toLocaleDateString('en-PH')}</p>
                </div>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-white text-lg">✕</button>
            </div>

            <div className="p-3 md:p-5 overflow-y-auto space-y-3 md:space-y-4">
              <div className="grid grid-cols-3 gap-2">
                <div className="p-2.5 md:p-3 bg-slate-950 border border-slate-800 rounded-xl">
                  <span className="text-[10px] text-slate-400">Gross Sales:</span>
                  <div className="text-base md:text-xl font-bold font-mono text-emerald-400 mt-0.5">
                    {formatPHP(shiftSummary.totalRevenue)}
                  </div>
                </div>
                <div className="p-2.5 md:p-3 bg-slate-950 border border-slate-800 rounded-xl">
                  <span className="text-[10px] text-slate-400">Orders:</span>
                  <div className="text-base md:text-xl font-bold font-mono text-slate-100 mt-0.5">
                    {shiftSummary.totalOrders}
                  </div>
                </div>
                <div className="p-2.5 md:p-3 bg-slate-950 border border-slate-800 rounded-xl">
                  <span className="text-[10px] text-slate-400">Avg Ticket:</span>
                  <div className="text-base md:text-xl font-bold font-mono text-slate-100 mt-0.5">
                    {formatPHP(shiftSummary.avgTicket)}
                  </div>
                </div>
              </div>

              <div className="p-2.5 md:p-3 bg-slate-950 border border-slate-800 rounded-xl space-y-1.5">
                <h4 className="font-bold text-[11px] text-slate-300 uppercase tracking-wider">
                  Payment Collections:
                </h4>
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-1.5 text-xs">
                  <div className="p-2 bg-slate-900 rounded-lg border border-slate-800">
                    <span className="text-slate-400 text-[10px] block">💵 Cash:</span>
                    <span className="font-bold font-mono text-emerald-400">{formatPHP(shiftSummary.totalCash)}</span>
                  </div>
                  <div className="p-2 bg-slate-900 rounded-lg border border-slate-800">
                    <span className="text-slate-400 text-[10px] block">📱 GCash:</span>
                    <span className="font-bold font-mono text-blue-400">{formatPHP(shiftSummary.totalGCash)}</span>
                  </div>
                  <div className="p-2 bg-slate-900 rounded-lg border border-slate-800">
                    <span className="text-slate-400 text-[10px] block">🟣 Maya:</span>
                    <span className="font-bold font-mono text-emerald-400">{formatPHP(shiftSummary.totalMaya)}</span>
                  </div>
                  <div className="p-2 bg-slate-900 rounded-lg border border-slate-800">
                    <span className="text-slate-400 text-[10px] block">💳 Card:</span>
                    <span className="font-bold font-mono text-purple-400">{formatPHP(shiftSummary.totalCard)}</span>
                  </div>
                </div>
              </div>

              <div className="p-2.5 md:p-3 bg-slate-950 border border-slate-800 rounded-xl space-y-1 text-[11px]">
                <h4 className="font-bold text-[10px] text-slate-300 uppercase tracking-wider mb-1">
                  BIR Official Sales Analysis:
                </h4>
                <div className="flex justify-between text-slate-400">
                  <span>12% VAT Collected:</span>
                  <span className="font-mono text-slate-200">{formatPHP(shiftSummary.totalVat)}</span>
                </div>
                <div className="flex justify-between text-slate-400">
                  <span>VAT-Exempt Fresh Produce:</span>
                  <span className="font-mono text-slate-200">{formatPHP(shiftSummary.totalVatExempt)}</span>
                </div>
                <div className="flex justify-between text-slate-400">
                  <span>Senior Citizen / PWD 5% Discounts:</span>
                  <span className="font-mono text-amber-400">-{formatPHP(shiftSummary.totalDiscounts)}</span>
                </div>
              </div>
            </div>

            <div className="p-3 bg-slate-850 border-t border-slate-800 flex justify-end shrink-0">
              <button
                onClick={onClose}
                className="px-4 py-1.5 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs font-semibold text-slate-200"
              >
                Close
              </button>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================
    // ⏸️ PARKED / HELD CARTS MODAL
    // =========================================================
    function ParkedOrdersModal({ orders, onRecall, onDelete, onClose }) {
      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-2.5 md:p-4">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full overflow-hidden shadow-2xl flex flex-col max-h-[88dvh]">
            
            <div className="p-3.5 md:p-4 bg-slate-850 border-b border-slate-800 flex items-center justify-between shrink-0">
              <div className="flex items-center space-x-2">
                <span className="text-xl">⏸️</span>
                <h3 className="font-bold text-xs md:text-sm text-slate-100">Held / Parked Orders</h3>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-white text-lg">✕</button>
            </div>

            <div className="p-3 md:p-4 flex-1 overflow-y-auto space-y-2.5">
              {orders.length === 0 ? (
                <div className="text-center py-10 text-slate-500">
                  <span className="text-3xl">🧺</span>
                  <p className="text-xs mt-1">No held orders currently parked.</p>
                </div>
              ) : (
                orders.map(order => {
                  const itemCount = order.cart.reduce((s, it) => s + (it.isWeighed ? 1 : it.qty), 0);
                  const orderTotal = order.cart.reduce((s, it) => s + it.total, 0);

                  return (
                    <div key={order.id} className="p-2.5 bg-slate-950 border border-slate-800 rounded-xl flex items-center justify-between">
                      <div>
                        <div className="flex items-center gap-2">
                          <span className="font-bold text-xs text-amber-300">{order.note}</span>
                          <span className="text-[9px] text-slate-500 font-mono">{order.timestamp}</span>
                        </div>
                        <p className="text-[11px] text-slate-400 mt-0.5">
                          {itemCount} items • <span className="font-mono text-emerald-400 font-bold">{formatPHP(orderTotal)}</span>
                        </p>
                      </div>

                      <div className="flex items-center space-x-1.5">
                        <button
                          onClick={() => onRecall(order)}
                          className="px-2.5 py-1 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-bold shadow"
                        >
                          Recall
                        </button>
                        <button
                          onClick={() => onDelete(order.id)}
                          className="text-slate-500 hover:text-red-400 text-sm p-1"
                          title="Remove"
                        >
                          ✕
                        </button>
                      </div>
                    </div>
                  );
                })
              )}
            </div>

            <div className="p-2.5 bg-slate-850 border-t border-slate-800 flex justify-end shrink-0">
              <button
                onClick={onClose}
                className="px-4 py-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs font-semibold text-slate-200"
              >
                Close
              </button>
            </div>
          </div>
        </div>
      );
    }

    // Render React Application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
