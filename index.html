    // PWA Install Prompt Listener
    window.deferredPWAInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.deferredPWAInstallPrompt = e;
      window.dispatchEvent(new Event('pwaPromptReady'));
    });

    // Service Worker Registration for Offline Capabilities
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then((reg) => {
          window.swRegistration = reg;
        }).catch((err) => console.log('SW registration skipped:', err));
      });
    }

    // High-Fidelity Audio & Haptic Feedback for Modern Barcode Scanners
    window.playScanBeep = function(isError = false) {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        if (ctx.state === 'suspended') ctx.resume();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (isError) {
          // Error Buzz: 280Hz -> 160Hz Sawtooth
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(280, ctx.currentTime);
          osc.frequency.setValueAtTime(160, ctx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.25, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.28);
          osc.start();
          osc.stop(ctx.currentTime + 0.28);
          if ('vibrate' in navigator) navigator.vibrate([120, 60, 120]);
        } else {
          // Authentic Zebra/Honeywell Retail Scanner Dual-Tone Chime (2100Hz -> 2600Hz)
          osc.type = 'sine';
          osc.frequency.setValueAtTime(2100, ctx.currentTime);
          osc.frequency.setValueAtTime(2600, ctx.currentTime + 0.04);
          gain.gain.setValueAtTime(0.22, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.095);
          osc.start();
          osc.stop(ctx.currentTime + 0.095);
          if ('vibrate' in navigator) navigator.vibrate(45);
        }
      } catch (e) {}
    };
  </script>

      return '₱' + num.toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    };

    // Helper: Generate Philippine EAN-13 Barcode
    const generatePhilippineEAN13 = () => {
      const prefix = '480';
      let randomDigits = '';
      for (let i = 0; i < 9; i++) {
        randomDigits += Math.floor(Math.random() * 10).toString();
      }
      const raw12 = prefix + randomDigits;
      let sum = 0;
      for (let i = 0; i < 12; i++) {
        const d = parseInt(raw12[i], 10);
        sum += (i % 2 === 0) ? d : d * 3;
      }
      const checkDigit = (10 - (sum % 10)) % 10;
      return raw12 + checkDigit.toString();
    };

      // Products & Inventory State (with Automatic Migration to Exact Authentic Product Photos)
      const [products, setProducts] = useState(() => {
        const saved = localStorage.getItem('cha_pos_products');
        const version = localStorage.getItem('cha_pos_products_version');
        if (!saved) {
          try { localStorage.setItem('cha_pos_products_version', 'v3-exact-market-photos'); } catch(e) {}
          return INITIAL_PRODUCTS;
        }

        try {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed)) {
            // Build fast lookup by product ID and barcode for real market photography
            const imageMap = {};
            INITIAL_PRODUCTS.forEach(p => {
              imageMap[p.id] = p.image;
              imageMap[p.barcode] = p.image;
            });

            let updatedCount = 0;
            const migrated = parsed.map(p => {
              const matchedImg = imageMap[p.id] || imageMap[p.barcode];
              if (matchedImg && (version !== 'v3-exact-market-photos' || p.image !== matchedImg)) {
                updatedCount++;
                return { ...p, image: matchedImg };
              }
              return p;
            });

            if (updatedCount > 0 || version !== 'v3-exact-market-photos') {
              localStorage.setItem('cha_pos_products', JSON.stringify(migrated));
              localStorage.setItem('cha_pos_products_version', 'v3-exact-market-photos');
            }
            return migrated;
          }
        } catch (e) {
          console.warn('Failed parsing saved products:', e);
        }
        return INITIAL_PRODUCTS;
      });

          } else if (e.key === 'F9') {
            e.preventDefault();
            setIsShiftModalOpen(true);
          } else if (e.key === 'F12' && cart.length > 0) {
            e.preventDefault();
            setIsCheckoutOpen(true);
          }
        };

        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [cart, isLocked, isCheckoutOpen, scaleModalItem, isInventoryOpen, isShiftModalOpen, isParkedModalOpen, isAddProductOpen, isCashierModalOpen, isMobileQROpen, isCameraScannerOpen, isPrinterListOpen, isMobileMoreOpen, isScannerHubOpen]);

      // Filtered Product Catalog
      const filteredProducts = useMemo(() => {
        return products.filter(p => {
          const matchCat = selectedCategory === 'ALL' || p.category === selectedCategory;
          const query = searchQuery.trim().toLowerCase();
          const matchSearch = !query ||
            p.name.toLowerCase().includes(query) ||
            p.barcode.includes(query) ||
            (p.plu && p.plu.includes(query)) ||
            p.category.toLowerCase().includes(query);
          return matchCat && matchSearch;
        });
      }, [products, selectedCategory, searchQuery]);

      // Add Product to Cart
      const handleProductClick = (product) => {
        if (product.stock <= 0) {
          alert(`Sorry, "${product.name}" is currently out of stock.`);
          return;
        }

        if (product.isWeighed) {
          setScaleModalItem(product);
          return;
        }

        setCart(prev => {
          const existing = prev.find(item => item.id === product.id);
          if (existing) {
            return prev.map(item =>
              item.id === product.id
                ? { ...item, qty: item.qty + 1, total: (item.qty + 1) * item.price }
                : item
            );
          }
          return [...prev, {
            ...product,
            qty: 1,
            total: product.price
          }];
        });
      };

      // Add Weighed Item from Scale Modal
      const handleAddWeighedItem = (product, weightInKg) => {
        if (weightInKg <= 0) return;
        setCart(prev => {
          const existingIndex = prev.findIndex(item => item.id === product.id && item.unit === 'kg');
          if (existingIndex >= 0) {
            const updated = [...prev];
            const newQty = Number((updated[existingIndex].qty + weightInKg).toFixed(3));
            updated[existingIndex] = {
              ...updated[existingIndex],
              qty: newQty,
              total: Number((newQty * product.price).toFixed(2))
            };
            return updated;
          }
          return [...prev, {
            ...product,
            qty: Number(weightInKg.toFixed(3)),
            total: Number((weightInKg * product.price).toFixed(2))
          }];
        });
        setScaleModalItem(null);
      };

      // Helper: Barcode Symbology Classifier
      const detectBarcodeSymbology = (code) => {
        if (!code) return 'Unknown';
        const s = String(code).trim();
        if (/^480\d{10}$/.test(s)) return 'EAN-13 (Philippine GS1 Standard 480)';
        if (/^(2[0-9]|02)\d{11}$/.test(s)) return 'EAN-13 (In-Store Weighed Retail Scale)';
        if (/^\d{13}$/.test(s)) return 'EAN-13 Standard';
        if (/^\d{12}$/.test(s)) return 'UPC-A Retail';
        if (/^\d{8}$/.test(s)) return 'EAN-8 Compact';
        if (/^\d{4,5}$/.test(s)) return 'PLU Code (Price Look-Up)';
        if (/^[A-Za-z0-9\-\.\ \$\/\+\%]{6,}$/.test(s)) return 'Code 128 / Code 39';
        if (/^https?:\/\/|[{"]/.test(s)) return '2D QR Code';
        return 'Standard 1D/2D Barcode';
      };

      // Centralized Modern Barcode Processor (Hardware Scanner, Camera, or Manual Search Wedge)
      const processScannedBarcode = (rawInput, source = 'HARDWARE', speedMs = null) => {
        if (!rawInput) return false;
        let barcode = String(rawInput).trim();
        if (!barcode) return false;

        // Strip standard AIM Symbology Identifiers (e.g. ]E0, ]C1, ]Q1, ]e0)
        if (/^\][a-zA-Z0-9]{2}/.test(barcode)) {
          barcode = barcode.substring(3);
        }
        // Strip non-printable / control characters
        barcode = barcode.replace(/^[\x00-\x1F]+|[\x00-\x1F]+$/g, '');
        if (!barcode) return false;

        const format = detectBarcodeSymbology(barcode);

        // 1. Exact Barcode Match
        let found = products.find(p => p.barcode === barcode);

        // 2. Exact PLU Match
        if (!found) {
          found = products.find(p => p.plu && p.plu === barcode);
        }

        // 3. Normalized EAN-13 / UPC-A Match (handle leading zero difference)
        if (!found) {
          if (barcode.length === 12) {
            found = products.find(p => p.barcode === '0' + barcode);
          } else if (barcode.length === 13 && barcode.startsWith('0')) {
            found = products.find(p => p.barcode === barcode.slice(1));
          }
        }

        // 4. GS1 / EAN-13 Weighed In-Store Barcode Parsing (Prefixes 20-29 or 02)
        // Format: 20 + 4-digit PLU + 5-digit Weight in grams + 1 Check digit (e.g. 20 1001 00520 4 = PLU 1001, 520g)
        let embeddedWeight = null;
        if (!found && scannerSettings.parseWeighedScale && barcode.length === 13 && /^(2[0-9]|02)/.test(barcode)) {
          const pluCandidate = barcode.slice(2, 6);
          const weightGrams = parseInt(barcode.slice(6, 11), 10);
          if (!isNaN(weightGrams) && weightGrams > 0) {
            const matchedWeighedProduct = products.find(p => p.plu === pluCandidate || (p.barcode && p.barcode.includes(pluCandidate)));
            if (matchedWeighedProduct) {
              found = matchedWeighedProduct;
              embeddedWeight = Number((weightGrams / 1000).toFixed(3));
            }
          }
        }

        // 5. If called from Search Bar and exactly 1 product matched query
        if (!found && source === 'SEARCH_BAR') {
          if (filteredProducts.length === 1) {
            found = filteredProducts[0];
          }
        }

        const scanLogEntry = {
          barcode,
          format,
          product: found || null,
          timestamp: new Date().toLocaleTimeString(),
          speedMs: speedMs || 0,
          source
        };
        setLastScannedBarcode(scanLogEntry);

        if (found) {
          if (found.stock <= 0) {
            if (scannerSettings.sound) window.playScanBeep(true);
            setScanToast({ message: `"${found.name}" is OUT OF STOCK!`, type: 'error', barcode });
            return true;
          }

          if (scannerSettings.sound) window.playScanBeep(false);

          if (embeddedWeight !== null) {
            handleAddWeighedItem(found, embeddedWeight);
            setScanToast({
              message: `⚖️ Weighed: ${found.name} (${embeddedWeight} kg) • ${formatPHP(found.price * embeddedWeight)}`,
              type: 'success',
              barcode
            });
          } else if (found.isWeighed) {
            setScaleModalItem(found);
            setScanToast({
              message: `⚖️ Scale Opened: ${found.name} • ${formatPHP(found.price)}/kg`,
              type: 'success',
              barcode
            });
          } else {
            handleProductClick(found);
            setScanToast({
              message: `⚡ Scanned: ${found.name} • ${formatPHP(found.price)} (+1)`,
              type: 'success',
              barcode
            });
          }
          return true;
        } else {
          // Barcode Not Found
          if (scannerSettings.sound) window.playScanBeep(true);
          setScanToast({
            message: `Barcode "${barcode}" not in catalog.`,
            type: 'error',
            barcode
          });

          setTimeout(() => {
            if (confirm(`Scanned Barcode: ${barcode} (${format})\n\nThis item is not registered in the store catalog yet.\nWould you like to add it as a new product now?`)) {
              setScannedBarcodeForNewProduct(barcode);
              setIsAddProductOpen(true);
            }
          }, 100);
          return false;
        }
      };

      // Camera Scan Handler (supports single or continuous rapid mode)
      const handleCameraScanSuccess = (scannedBarcode, isContinuous = false) => {
        const success = processScannedBarcode(scannedBarcode, 'CAMERA');
        if (success && !isContinuous) {
          setIsCameraScannerOpen(false);
        }
      };

      // Modern Barcode Scanner HID Keyboard Wedge Engine (Global High-Speed Buffer)
      useEffect(() => {
        let buffer = '';
        let lastKeyTime = 0;
        let scanStartTime = 0;
        let charCount = 0;

        const handleGlobalKeyDown = (e) => {
          if (isLocked) return;

          // Don't intercept function keys (F1-F12), ESC, or modifier keys (Ctrl, Alt, Meta)
          if (e.key.startsWith('F') && e.key.length > 1) return;
          if (e.ctrlKey || e.altKey || e.metaKey || e.key === 'Escape') return;

          const now = performance.now();
          const timeDiff = now - lastKeyTime;
          lastKeyTime = now;

          const activeEl = document.activeElement;
          const isInputFocused = activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA' || activeEl.tagName === 'SELECT');

          // Scanners typically terminate with 'Enter' or 'Tab'
          if (e.key === 'Enter' || e.key === 'Tab') {
            if (buffer.length >= (scannerSettings.minChars || 3)) {
              const totalDuration = now - scanStartTime;
              const avgCharSpeed = charCount > 0 ? totalDuration / charCount : 999;

              // If the average character interval was rapid (< scannerSettings.maxIntervalMs ms/char)
              // or user was not in any text input, it is definitively a barcode scanner!
              if (avgCharSpeed <= (scannerSettings.maxIntervalMs || 65) || !isInputFocused) {
                e.preventDefault();
                e.stopPropagation();

                const scannedCode = buffer;
                buffer = '';
                charCount = 0;

                // Clean accidental buffer characters from focused input
                if (isInputFocused && activeEl.value) {
                  if (activeEl.value.endsWith(scannedCode)) {
                    activeEl.value = activeEl.value.slice(0, -scannedCode.length);
                    activeEl.dispatchEvent(new Event('input', { bubbles: true }));
                  }
                }

                processScannedBarcode(scannedCode, 'HARDWARE_SCANNER', Math.round(totalDuration));
                return;
              }
            }
            buffer = '';
            charCount = 0;
            return;
          }

          // Single printable characters
          if (e.key.length === 1) {
            if (timeDiff > (scannerSettings.maxIntervalMs || 65)) {
              // Reset buffer
              buffer = e.key;
              scanStartTime = now;
              charCount = 1;
            } else {
              // Rapid succession - append
              buffer += e.key;
              charCount++;
            }
          }
        };

        window.addEventListener('keydown', handleGlobalKeyDown, true);
        return () => window.removeEventListener('keydown', handleGlobalKeyDown, true);
      }, [products, isLocked, scannerSettings, filteredProducts, cart]);

      // Update Cart Item Quantity
      const updateCartQty = (id, newQty) => {
        if (newQty <= 0) {
          removeFromCart(id);
          return;
        }
        setCart(prev => prev.map(item => {
          if (item.id === id) {
            const roundedQty = item.isWeighed ? Number(newQty.toFixed(3)) : Math.round(newQty);
            return {
              ...item,
              qty: roundedQty,
              total: Number((roundedQty * item.price).toFixed(2))
            };
          }
          return item;
        }));
      };

      const removeFromCart = (id) => {
        setCart(prev => prev.filter(item => item.id !== id));
      };

      const clearCart = () => {
        if (cart.length === 0) return;
        if (confirm('Are you sure you want to clear the current cart?')) {
          setCart([]);
          setCustomerType('REGULAR');
          setSeniorId('');
          setSeniorName('');
          setIncludeEcoBag(false);
        }
      };

      // 🏷️ Save Cart Item Price & Tariff Adjustments
      const handleSaveCartItemEdit = ({ itemId, newPrice, newQty, tariffCategory, tariffRate, updateCatalog }) => {
        setCart(prev => prev.map(item => {
          if (item.id === itemId) {
            const updatedPrice = parseFloat(newPrice) || item.price;
            const updatedQty = parseFloat(newQty) || item.qty;
            const isExempt = tariffCategory === 'EXEMPT';
            return {
              ...item,
              price: updatedPrice,
              qty: updatedQty,
              total: Number((updatedPrice * updatedQty).toFixed(2)),
              tariffCategory,
              tariffRate: tariffRate !== undefined ? parseFloat(tariffRate) : item.tariffRate,
              isVatExempt: isExempt
            };
          }
          return item;
        }));

        if (updateCatalog) {
          setProducts(prev => prev.map(p => {
            if (p.id === itemId) {
              const isExempt = tariffCategory === 'EXEMPT';
              return {
                ...p,
                price: parseFloat(newPrice) || p.price,
                tariffCategory,
                tariffRate: tariffRate !== undefined ? parseFloat(tariffRate) : p.tariffRate,
                isVatExempt: isExempt
              };
            }
            return p;
          }));
        }

        setEditingCartItem(null);
      };

      // Hold / Park Order
      const parkCurrentCart = () => {
        if (cart.length === 0) return;
        const customerNote = prompt('Enter Customer Name or Cart Label (e.g. Cart #3, Lady in Blue Jacket):', `Customer #${parkedOrders.length + 1}`);
        if (!customerNote) return;

        const newParked = {
          id: 'PARK-' + Date.now(),
          timestamp: new Date().toLocaleTimeString('en-PH'),
          note: customerNote,
          cart: [...cart],
          customerType,
          seniorId,
          seniorName,
          includeEcoBag
        };

        setParkedOrders(prev => [newParked, ...prev]);
        setCart([]);
        setCustomerType('REGULAR');
        setSeniorId('');
        setSeniorName('');
        setIncludeEcoBag(false);
      };

      // Recall Parked Order
      const recallParkedOrder = (parked) => {
        if (cart.length > 0) {
          if (!confirm('The current cart has items. Do you want to replace it with this held order? Click OK to proceed.')) {
            return;
          }
        }
        setCart(parked.cart);
        setCustomerType(parked.customerType);
        setSeniorId(parked.seniorId || '');
        setSeniorName(parked.seniorName || '');
        setIncludeEcoBag(parked.includeEcoBag || false);
        setParkedOrders(prev => prev.filter(p => p.id !== parked.id));
        setIsParkedModalOpen(false);
        setMobileTab('cart');
      };

      // BIR VAT & Philippine Tax / Tariff Calculations
      const totals = useMemo(() => {
        let grossSubtotal = 0;
        let vatExemptGross = 0;
        let vatableGross = 0;
        let customTariffGross = 0;
        let customTariffAmount = 0;

        const effectiveVatRate = (tariffSettings.vatRate !== undefined ? tariffSettings.vatRate : 12.0) / 100;
        const vatMultiplier = 1 + effectiveVatRate;

        cart.forEach(item => {
          grossSubtotal += item.total;
          const isExempt = item.isVatExempt || item.tariffCategory === 'EXEMPT' || item.tariffRate === 0;
          const isCustom = item.tariffCategory === 'CUSTOM';

          if (isExempt) {
            vatExemptGross += item.total;
          } else if (isCustom) {
            customTariffGross += item.total;
            const rate = ((item.tariffRate !== undefined ? item.tariffRate : tariffSettings.customTariffRate) || 0) / 100;
            const net = rate > 0 ? item.total / (1 + rate) : item.total;
            customTariffAmount += (item.total - net);
          } else {
            vatableGross += item.total;
          }
        });

        const vatableNet = effectiveVatRate > 0 ? Number((vatableGross / vatMultiplier).toFixed(2)) : vatableGross;
        const vatAmount = Number((vatableGross - vatableNet).toFixed(2));

        let scDiscount = 0;
        const scRate = (tariffSettings.scPwdDiscountRate !== undefined ? tariffSettings.scPwdDiscountRate : 5.0) / 100;
        if (customerType === 'SENIOR' || customerType === 'PWD') {
          scDiscount = Number((grossSubtotal * scRate).toFixed(2));
        }

        const bagFee = includeEcoBag ? (tariffSettings.ecoBagFee !== undefined ? tariffSettings.ecoBagFee : 2.00) : 0.00;
        const totalDue = Number((grossSubtotal - scDiscount + bagFee).toFixed(2));

        return {
          grossSubtotal,
          vatExemptGross,
          vatableGross,
          vatableNet,
          vatAmount,
          customTariffGross,
          customTariffAmount: Number(customTariffAmount.toFixed(2)),
          effectiveVatRate: tariffSettings.vatRate !== undefined ? tariffSettings.vatRate : 12.0,
          scDiscount,
          bagFee,
          totalDue
        };
      }, [cart, customerType, includeEcoBag, tariffSettings]);

      // Complete Checkout & Update Inventory
      const handleCompleteTransaction = (paymentData) => {
        const orderNumber = 'OR-' + Math.floor(100000 + Math.random() * 900000);
        const transactionRecord = {
          orderNumber,
          date: new Date().toLocaleDateString('en-PH'),
          time: new Date().toLocaleTimeString('en-PH'),
          cashier: currentCashier ? currentCashier.name : 'Cashier',
          cashierId: currentCashier ? currentCashier.id : 'CSH-001',
          customerType,
          seniorId,
          seniorName,
          items: [...cart],
          totals: { ...totals },
          payment: paymentData,
          storeInfo: { ...storeInfo }
        };

        // Deduct inventory stock
        setProducts(prev => prev.map(p => {
          const bought = cart.find(c => c.id === p.id);
          if (bought) {
            return {
              ...p,
              stock: Number(Math.max(0, p.stock - bought.qty).toFixed(3))
            };
          }
          return p;
        }));

        setCompletedSales(prev => [transactionRecord, ...prev]);
        setLastReceipt(transactionRecord);
        setIsCheckoutOpen(false);

        // Reset Cart
        setCart([]);
        setCustomerType('REGULAR');
        setSeniorId('');
        setSeniorName('');
        setIncludeEcoBag(false);

        // Auto print if enabled
        if (printerSettings.autoPrintOnCheckout) {
          setTimeout(() => {
            window.print();
          }, 400);
        }
      };

      const handleSaveProduct = (prodData) => {
        setProducts(prev => {
          const exists = prev.some(p => p.id === prodData.id);
          if (exists) {
            return prev.map(p => p.id === prodData.id ? prodData : p);
          } else {
            return [prodData, ...prev];
          }
        });

        // Sync with active cart if already added
        setCart(prev => prev.map(item => {
          if (item.id === prodData.id) {
            return {
              ...item,
              name: prodData.name,
              price: prodData.price,
              image: prodData.image,
              unit: prodData.unit,
              isVatExempt: prodData.isVatExempt,
              tariffCategory: prodData.tariffCategory,
              tariffRate: prodData.tariffRate
            };
          }
          return item;
        }));

        setIsAddProductOpen(false);
        setEditingProduct(null);
        setScannedBarcodeForNewProduct('');
      };

      const handleDeleteProduct = (productId) => {
        setProducts(prev => prev.filter(p => p.id !== productId));
        setCart(prev => prev.filter(item => item.id !== productId));
        setIsAddProductOpen(false);
        setEditingProduct(null);
      };

      const handleSaveNewProduct = handleSaveProduct;

      const handleLogout = () => {
        setIsLocked(true);
      };

      const handleLogin = (cashier) => {
        setCurrentCashier(cashier);
        setIsLocked(false);
      };

      const cartItemCount = cart.reduce((sum, item) => sum + (item.isWeighed ? 1 : item.qty), 0);

      const activePrinter = useMemo(() => {
        return printerSettings.savedPrinters.find(p => p.id === printerSettings.activePrinterId) || printerSettings.savedPrinters[0];
      }, [printerSettings]);

      return (
        <div className="flex flex-col h-[100dvh] w-screen max-w-full overflow-hidden bg-slate-950 text-slate-100 select-none">
          
          {/* Top POS Navigation Bar (Compact & Fitted for Mobile) */}
          <header className="h-13 md:h-14 border-b border-slate-800 bg-slate-900 px-2.5 md:px-4 flex items-center justify-between z-20 shrink-0">
            <div className="flex items-center space-x-2">
              <div className="w-8 h-8 md:w-9 md:h-9 rounded-xl overflow-hidden bg-slate-950 flex items-center justify-center shadow-lg shadow-emerald-950/40 border border-emerald-500/30 shrink-0 p-0.5">
                <img src="logo.svg" alt="CHAROT Convenience Store Logo" className="w-full h-full object-contain" />
              </div>
              <div className="truncate max-w-[140px] sm:max-w-xs md:max-w-md">
                <h1 className="font-bold text-xs md:text-sm tracking-wide text-emerald-400 flex items-center gap-1 truncate">
                  <span className="truncate">CHAROT STORE</span>
                  <span className="text-[9px] uppercase font-bold tracking-widest px-1 py-0.2 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 shrink-0">
                    ₱
                  </span>
                </h1>
                <p className="text-[9px] md:text-[11px] text-slate-400 font-mono truncate">
                  Bankers Subd. Antipolo
                </p>
              </div>
            </div>

            {/* Quick Action Navigation Buttons */}
            <div className="flex items-center space-x-1 sm:space-x-1.5 md:space-x-2">
              
              {/* ⚡ HARDWARE & CAMERA SCANNER HUB BUTTON */}
              <button
                onClick={() => setIsScannerHubOpen(true)}
                className="px-2 py-1.5 md:px-2.5 rounded-lg border border-cyan-600/70 bg-cyan-950/50 hover:bg-cyan-900/70 text-cyan-300 text-xs font-semibold flex items-center gap-1 transition shrink-0"
                title="Barcode Scanner Hub & Hardware Settings (F6)"
              >
                <span>⚡</span>
                <span className="hidden sm:inline">Scanner</span>
                <span className="w-2 h-2 rounded-full bg-cyan-400 animate-pulse ml-0.5" title="Hardware Scanner Ready"></span>
              </button>

              {/* 🖨️ AVAILABLE PRINTERS LIST BUTTON */}
              <button
                onClick={() => setIsPrinterListOpen(true)}
                className="px-2 py-1.5 md:px-2.5 rounded-lg border border-teal-600/70 bg-teal-950/50 hover:bg-teal-900/70 text-teal-300 text-xs font-semibold flex items-center gap-1 transition shrink-0"
                title="Available Printers List & Settings"
              >
                <span>🖨️</span>
                <span className="hidden sm:inline">Printers</span>
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse ml-0.5"></span>
              </button>

              {/* 📷 Camera Scanner Button */}
              <button
                onClick={() => setIsCameraScannerOpen(true)}
                className="px-2 py-1.5 md:px-2.5 rounded-lg border border-purple-600/70 bg-purple-950/50 hover:bg-purple-900/70 text-purple-300 text-xs font-semibold flex items-center gap-1 transition shrink-0"
                title="Camera Barcode Scanner"
              >
                <span>📷</span>
                <span className="hidden md:inline">Scan</span>
              </button>

              {/* Desktop / Tablet Buttons */}
              <button
                onClick={() => setIsAddProductOpen(true)}
                className="hidden md:flex px-2.5 py-1.5 rounded-lg border border-emerald-600/70 bg-emerald-950/50 hover:bg-emerald-900/70 text-emerald-300 text-xs font-semibold items-center gap-1.5 transition shrink-0"
                title="Add Auto-Barcode Item (F3)"
              >
                <span>➕</span>
                <span>Add Item</span>
              </button>

              <button
                onClick={() => setIsCashierModalOpen(true)}
                className="hidden md:flex px-2.5 py-1.5 rounded-lg border border-slate-700 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold items-center gap-1.5 transition shrink-0"
                title="Manage Cashier List"
              >
                <span>👥</span>
                <span>Cashiers</span>
              </button>

              {/* 🏛️ EDITABLE TARIFF & BIR TAX RATES */}
              <button
                onClick={() => setIsTariffModalOpen(true)}
                className="hidden sm:flex px-2 py-1.5 md:px-2.5 rounded-lg border border-amber-600/70 bg-amber-950/50 hover:bg-amber-900/70 text-amber-300 text-xs font-bold items-center gap-1.5 transition shrink-0 shadow-sm"
                title="Edit Store Tariff, VAT & Tax Rates"
              >
                <span className="text-sm">🏛️</span>
                <span className="hidden md:inline">Tariff & Tax</span>
                <span className="text-[10px] bg-amber-500/30 text-amber-200 px-1 py-0.2 rounded font-mono font-bold">
                  {tariffSettings.vatRate}%
                </span>
              </button>

              {/* 📱 CREATE / INSTALL MOBILE APP VIA QR CODE */}

    // =========================================================
    // 🖨️ PRINTER LIST & THERMAL HARDWARE SETTINGS MODAL
    // =========================================================
    function PrinterListModal({ config, setConfig, onClose }) {
      const [isScanningBt, setIsScanningBt] = useState(false);
      const [statusNotice, setStatusNotice] = useState('');

      // Scan for nearby Bluetooth ESC/POS Thermal Printers
      const handleScanBluetoothPrinters = async () => {
        if (!navigator.bluetooth) {
          alert('Web Bluetooth is supported on Google Chrome (Android & PC/Mac) and WebBLE browsers on iOS. Please ensure Bluetooth is enabled.');
          return;
        }

        setIsScanningBt(true);
        setStatusNotice('Scanning for Bluetooth ESC/POS printers...');
        try {
          const device = await navigator.bluetooth.requestDevice({
            acceptAllDevices: true,
            optionalServices: [
              '000018f0-0000-1000-8000-00805f9b34fb',
              'e7810a71-73ae-499d-8c15-faa9aef0c3f2',
              '49535343-fe7d-4ae5-8fa9-9fafd205e455'
            ]
          });

          if (device) {
            const newPrinter = {
              id: 'bt-' + Date.now(),
              name: device.name || 'Bluetooth Thermal POS',
              type: 'bluetooth',
              status: 'ready',
              paper: config.paperSize
            };

            setConfig(prev => ({
              ...prev,
              activePrinterId: newPrinter.id,
              savedPrinters: [newPrinter, ...prev.savedPrinters]
            }));

            setStatusNotice(`Successfully paired with: ${newPrinter.name}`);
          }
        } catch (err) {
          console.log('Bluetooth scan cancelled or error:', err);
          setStatusNotice('Bluetooth pairing cancelled or unavailable.');
        } finally {
          setIsScanningBt(false);
        }
      };

      // Detect USB Thermal POS Printer
      const handleDetectUSBPrinters = async () => {
        if (!navigator.usb) {
          alert('WebUSB is supported in Chromium-based browsers (Chrome, Edge). Plug your USB thermal printer and grant permission.');
          return;
        }

        try {
          const device = await navigator.usb.requestDevice({ filters: [] });
          if (device) {
            const newPrinter = {
              id: 'usb-' + Date.now(),
              name: device.productName || 'USB Thermal POS Printer',
              type: 'usb',
              status: 'ready',
              paper: config.paperSize
            };

            setConfig(prev => ({
              ...prev,
              activePrinterId: newPrinter.id,
              savedPrinters: [newPrinter, ...prev.savedPrinters]
            }));

            setStatusNotice(`Connected to USB Printer: ${newPrinter.name}`);
          }
        } catch (err) {
          console.log(err);
        }
      };

      // Test Print
      const handleTestPrint = () => {
        window.print();
      };

      const setPaper = (size) => {
        setConfig(prev => ({ ...prev, paperSize: size }));
      };

      const selectPrinter = (id) => {
        setConfig(prev => ({ ...prev, activePrinterId: id }));
      };

      const removePrinter = (id) => {
        if (id === 'system-default') return;
        setConfig(prev => ({
          ...prev,
          activePrinterId: prev.activePrinterId === id ? 'system-default' : prev.activePrinterId,
          savedPrinters: prev.savedPrinters.filter(p => p.id !== id)
        }));
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-3 md:p-4">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full max-h-[92dvh] overflow-hidden shadow-2xl flex flex-col">
            
            {/* Header */}
            <div className="p-4 bg-slate-850 border-b border-slate-800 flex items-center justify-between shrink-0">
              <div className="flex items-center space-x-2">
                <span className="text-xl">🖨️</span>
                <div>
                  <h3 className="font-bold text-sm text-slate-100">Available Printers & Setup</h3>
                  <p className="text-[11px] text-slate-400">Bluetooth, USB & System Receipt Printers</p>
                </div>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-white text-lg">✕</button>
            </div>

            <div className="p-4 md:p-5 flex-1 overflow-y-auto space-y-4">
              
              {/* Paper Roll Width Setting */}
              <div className="p-3 bg-slate-950 border border-slate-800 rounded-xl space-y-2">
                <div className="flex justify-between items-center">
                  <span className="text-xs font-semibold text-slate-300 uppercase tracking-wider">
                    Thermal Paper Roll Width:
                  </span>
                  <span className="text-xs font-mono font-bold text-emerald-400">
                    {config.paperSize}
                  </span>
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <button
                    onClick={() => setPaper('80mm')}
                    className={`py-2 px-3 rounded-lg border text-xs font-semibold flex items-center justify-center gap-1.5 transition ${
                      config.paperSize === '80mm'
                        ? 'bg-emerald-950/60 border-emerald-500 text-emerald-300 shadow'
                        : 'bg-slate-900 border-slate-800 text-slate-400 hover:text-slate-200'
                    }`}
                  >
                    <span>📜 80mm Standard Roll</span>
                  </button>
                  <button
                    onClick={() => setPaper('58mm')}
                    className={`py-2 px-3 rounded-lg border text-xs font-semibold flex items-center justify-center gap-1.5 transition ${
                      config.paperSize === '58mm'
                        ? 'bg-emerald-950/60 border-emerald-500 text-emerald-300 shadow'
                        : 'bg-slate-900 border-slate-800 text-slate-400 hover:text-slate-200'
                    }`}
                  >
                    <span>🧾 58mm Mini Mobile</span>
                  </button>
                </div>
              </div>

              {/* Discovery Action Buttons */}
              <div className="grid grid-cols-2 gap-2">
                <button
                  onClick={handleScanBluetoothPrinters}
                  disabled={isScanningBt}
                  className="py-2.5 px-3 bg-blue-950/60 hover:bg-blue-900/70 border border-blue-600/60 text-blue-300 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 transition active:scale-95"
                >
                  <span>📶</span>
                  <span>{isScanningBt ? 'Scanning...' : 'Pair Bluetooth Printer'}</span>
                </button>

                <button
                  onClick={handleDetectUSBPrinters}
                  className="py-2.5 px-3 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 transition active:scale-95"
                >
                  <span>🔌</span>
                  <span>Connect USB Printer</span>
                </button>
              </div>

              {statusNotice && (
                <div className="p-2.5 bg-emerald-950/40 border border-emerald-600/40 rounded-lg text-emerald-300 text-xs text-center font-mono">
                  {statusNotice}
                </div>
              )}

              {/* Available Printers List */}
              <div className="space-y-2">
                <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider block">
                  Available Printers List ({config.savedPrinters.length}):
                </span>

                <div className="space-y-2">
                  {config.savedPrinters.map(printer => {
                    const isActive = config.activePrinterId === printer.id;
                    return (
                      <div
                        key={printer.id}
                        onClick={() => selectPrinter(printer.id)}
                        className={`p-3 rounded-xl border flex items-center justify-between cursor-pointer transition ${
                          isActive
                            ? 'bg-emerald-950/40 border-emerald-500/70 shadow-md ring-1 ring-emerald-500/50'
                            : 'bg-slate-950 border-slate-800 hover:border-slate-700'
                        }`}
                      >
                        <div className="flex items-center space-x-3">
                          <div className={`w-9 h-9 rounded-xl flex items-center justify-center text-lg ${
                            isActive ? 'bg-emerald-600/30 text-emerald-400' : 'bg-slate-800 text-slate-400'
                          }`}>
                            {printer.type === 'bluetooth' ? '📶' : printer.type === 'usb' ? '🔌' : '🖨️'}
                          </div>
                          <div>
                            <div className="flex items-center gap-2">
                              <span className="font-bold text-xs text-slate-100">{printer.name}</span>
                              {isActive && (
                                <span className="text-[9px] px-1.5 py-0.2 rounded bg-emerald-500/20 text-emerald-300 font-bold border border-emerald-500/30">
                                  Default
                                </span>
                              )}
                            </div>
                            <p className="text-[10px] text-slate-400 font-mono">
                              Type: {printer.type.toUpperCase()} • Width: {config.paperSize} • Status: {printer.status}
                            </p>
                          </div>
                        </div>

                        <div className="flex items-center space-x-2">
                          <div className={`w-3 h-3 rounded-full border-2 ${
                            isActive ? 'bg-emerald-400 border-emerald-300' : 'bg-transparent border-slate-600'
                          }`} />
                          {printer.id !== 'system-default' && (
                            <button
                              onClick={(e) => { e.stopPropagation(); removePrinter(printer.id); }}
                              className="text-slate-500 hover:text-red-400 text-xs p-1"
                              title="Remove printer"
                            >
                              ✕
                            </button>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* Auto Print Toggle & Test Print */}
              <div className="p-3 bg-slate-950 border border-slate-800 rounded-xl space-y-3">
                <label className="flex items-center justify-between cursor-pointer">
                  <div>
                    <span className="text-xs font-semibold text-slate-200 block">Auto-Print on Checkout</span>
                    <span className="text-[10px] text-slate-400">Opens thermal print prompt immediately upon payment</span>
                  </div>
                  <input
                    type="checkbox"
                    checked={config.autoPrintOnCheckout}
                    onChange={(e) => setConfig(prev => ({ ...prev, autoPrintOnCheckout: e.target.checked }))}
                    className="w-4 h-4 rounded text-emerald-600 focus:ring-emerald-500 bg-slate-800 border-slate-700"
                  />
                </label>

                <div className="pt-2 border-t border-slate-800/80 flex items-center justify-between">
                  <span className="text-xs text-slate-400">Verify thermal alignment:</span>
                  <button
                    onClick={handleTestPrint}
                    className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-emerald-400 rounded-lg text-xs font-bold flex items-center gap-1 shadow"
                  >
                    <span>🖨️</span>
                    <span>Test Print Receipt</span>
                  </button>
                </div>
              </div>
            </div>

            {/* Footer */}
            <div className="p-3 bg-slate-850 border-t border-slate-800 flex justify-end shrink-0">
              <button
                onClick={onClose}
                className="px-5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold shadow"
              >
                Done
              </button>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================
    // 📷 MODERN HIGH-SPEED CAMERA BARCODE SCANNER
    // =========================================================
    function CameraScannerModal({ onClose, onScanSuccess }) {
      const [cameraError, setCameraError] = useState('');
      const [isContinuous, setIsContinuous] = useState(false);
      const [scannedItemsCount, setScannedItemsCount] = useState(0);
      const [lastScannedFeedback, setLastScannedFeedback] = useState('');
      const [torchOn, setTorchOn] = useState(false);
      const [hasTorch, setHasTorch] = useState(false);
      const scannerInstanceRef = useRef(null);
      const lastScannedTimeRef = useRef(0);
      const lastScannedCodeRef = useRef('');

      useEffect(() => {
        let html5QrCode = null;
        try {
          const formatsToSupport = [
            Html5QrcodeSupportedFormats.EAN_13,
            Html5QrcodeSupportedFormats.EAN_8,
            Html5QrcodeSupportedFormats.UPC_A,
            Html5QrcodeSupportedFormats.UPC_E,
            Html5QrcodeSupportedFormats.CODE_128,
            Html5QrcodeSupportedFormats.CODE_39,
            Html5QrcodeSupportedFormats.CODE_93,
            Html5QrcodeSupportedFormats.ITF,
            Html5QrcodeSupportedFormats.QR_CODE,
            Html5QrcodeSupportedFormats.DATA_MATRIX
          ];

          html5QrCode = new Html5Qrcode("reader", { formatsToSupport });
          scannerInstanceRef.current = html5QrCode;

          const config = {
            fps: 20,
            qrbox: (viewfinderWidth, viewfinderHeight) => {
              return {
                width: Math.floor(viewfinderWidth * 0.88),
                height: Math.floor(Math.min(viewfinderHeight * 0.55, 180))
              };
            },
            aspectRatio: 1.333,
            experimentalFeatures: {
              useBarCodeDetectorIfSupported: true
            }
          };

          html5QrCode.start(
            { facingMode: "environment" },
            config,
            (decodedText) => {
              if (!decodedText) return;

              const now = Date.now();
              if (decodedText === lastScannedCodeRef.current && (now - lastScannedTimeRef.current) < 1400) {
                return;
              }
              lastScannedCodeRef.current = decodedText;
              lastScannedTimeRef.current = now;

              setScannedItemsCount(prev => prev + 1);
              setLastScannedFeedback(decodedText);

              onScanSuccess(decodedText, isContinuous);
            },
            () => {}
          ).then(() => {
            try {
              const track = html5QrCode.getRunningTrackCameraCapabilities();
              if (track && track.torchFeature && track.torchFeature().isSupported()) {
                setHasTorch(true);
              }
            } catch (e) {}
          }).catch((err) => {
            console.error(err);
            setCameraError('Unable to access camera. Please allow camera permissions in your browser.');
          });
        } catch (e) {
          setCameraError('Camera scanner failed to initialize.');
        }

        return () => {
          if (html5QrCode && html5QrCode.isScanning) {
            html5QrCode.stop().catch(() => {});
          }
        };
      }, [isContinuous]);

      const toggleTorch = async () => {
        try {
          if (scannerInstanceRef.current && scannerInstanceRef.current.isScanning) {
            await scannerInstanceRef.current.applyVideoConstraints({
              advanced: [{ torch: !torchOn }]
            });
            setTorchOn(!torchOn);
          }
        } catch (e) {
          console.warn('Torch toggle failed', e);
        }
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex items-center justify-center p-3 select-none">
          <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-sm w-full overflow-hidden shadow-2xl flex flex-col">
            
            {/* Header */}
            <div className="p-3.5 bg-slate-850 border-b border-slate-800 flex items-center justify-between shrink-0">
              <div className="flex items-center space-x-2">
                <span className="text-xl">📷</span>
                <div>
                  <h3 className="font-bold text-xs md:text-sm text-slate-100 flex items-center gap-1.5">
                    <span>Camera Barcode Scanner</span>
                    <span className="px-1.5 py-0.2 rounded-full text-[9px] bg-emerald-500/20 text-emerald-300 font-mono font-bold border border-emerald-500/30">
                      1D / 2D
                    </span>
                  </h3>
                  <p className="text-[10px] text-slate-400">Aim at EAN-13, UPC, Code 128, or QR Code</p>
                </div>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-white text-lg p-1">✕</button>
            </div>

            {/* Viewfinder Body */}
            <div className="p-4 flex flex-col items-center">
              {cameraError ? (
                <div className="p-4 bg-rose-950/40 border border-rose-600/50 rounded-2xl text-rose-300 text-xs text-center w-full">
                  <p className="font-semibold">{cameraError}</p>
                </div>
              ) : (
                <div className="w-full flex flex-col items-center">
                  <div className="relative w-full rounded-2xl overflow-hidden bg-black border-2 border-emerald-500/60 shadow-inner">
                    <div id="reader" className="w-full"></div>
                    <div className="laser-scanner-line"></div>
                  </div>

                  <div className="mt-3 w-full flex items-center justify-between text-xs">
                    <div className="flex items-center gap-1.5 text-emerald-400 font-medium">
                      <span className="animate-pulse">●</span>
                      <span>Fast Hardware Decode Active</span>
                    </div>

                    {hasTorch && (
                      <button
                        onClick={toggleTorch}
                        className={`px-2 py-1 rounded-lg text-xs font-semibold flex items-center gap-1 transition ${
                          torchOn ? 'bg-amber-500 text-slate-950 shadow' : 'bg-slate-800 text-slate-300'
                        }`}
                      >
                        <span>{torchOn ? '🔦 On' : '🔦 Torch'}</span>
                      </button>
                    )}
                  </div>

                  {lastScannedFeedback && (
                    <div className="mt-2 w-full p-2 bg-emerald-950/60 border border-emerald-500/40 rounded-xl text-center">
                      <span className="text-[10px] text-slate-400 block">Last Decoded:</span>
                      <span className="text-xs font-mono font-bold text-emerald-300">{lastScannedFeedback}</span>
                    </div>
                  )}
                </div>
              )}
            </div>

            {/* Bottom Controls */}
            <div className="p-3 bg-slate-850 border-t border-slate-800 flex items-center justify-between shrink-0">
              <label className="flex items-center gap-2 text-xs text-slate-300 cursor-pointer">
                <input
                  type="checkbox"
                  checked={isContinuous}
                  onChange={(e) => setIsContinuous(e.target.checked)}
                  className="rounded accent-emerald-500 w-4 h-4"
                />
                <span className="font-semibold text-[11px]">
                  🔁 Continuous Mode {isContinuous && `(${scannedItemsCount})`}
                </span>
              </label>

              <button
                onClick={onClose}
                className="px-4 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-xs font-semibold"
              >
                Done
              </button>
            </div>
          </div>
        </div>
      );
    }

    function CashierManagementModal({ cashiers, currentCashier, setCashiers, setCurrentCashier, onClose }) {
      const [newName, setNewName] = useState('');
      const [newRole, setNewRole] = useState('Cashier');
      const [newPin, setNewPin] = useState('1234');

      const handleAddCashier = (e) => {
        e.preventDefault();
        if (!newName.trim()) return;

        const newCashier = {
          id: 'CSH-00' + (cashiers.length + 1),
          name: newName.trim(),
          role: newRole,
          pin: newPin.trim() || '0000',
          active: true
        };

        setCashiers(prev => [...prev, newCashier]);
        setNewName('');
        setNewPin('1234');
      };

      const handleRemoveCashier = (id) => {
        if (currentCashier && currentCashier.id === id) {
          alert('Cannot delete the currently active cashier! Please switch cashiers first.');
          return;
        }
        if (cashiers.length <= 1) {
          alert('At least one cashier must remain.');
          return;
        }
        if (confirm('Are you sure you want to remove this cashier?')) {
          setCashiers(prev => prev.filter(c => c.id !== id));
        }
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-3 md:p-4">

                  const isActive = currentCashier && currentCashier.id === c.id;
                  return (
                    <div

                          <p className="text-[11px] text-slate-400 font-mono">
                            {c.role} • PIN: **** • {c.id}

                      </div>

                      <div className="flex items-center space-x-2">
                        {!isActive && (
                          <button
                            onClick={() => setCurrentCashier(c)}

    // =========================================================
    function MobileInstallModal({ onClose }) {
      const qrContainerRef = useRef(null);
      const [customUrl, setCustomUrl] = useState(() => {
        return window.location.protocol === 'file:' 
          ? window.POS_PUBLIC_ONLINE_URL 
          : window.location.href.split('#')[0];
      });
      const [copied, setCopied] = useState(false);
      const [activePlatformTab, setActivePlatformTab] = useState('android'); // 'android' | 'ios'

      useEffect(() => {
        if (qrContainerRef.current) {
          qrContainerRef.current.innerHTML = '';
          try {
            new QRCode(qrContainerRef.current, {
              text: customUrl,
              width: 200,
              height: 200,
              colorDark: '#064e3b',
              colorLight: '#ffffff',
              correctLevel: QRCode.CorrectLevel.H
            });
          } catch (e) {
            console.error(e);
          }
        }
      }, [customUrl]);

      const handleCopy = () => {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(customUrl);
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
        }
      };

      const handleShare = async () => {
        if (navigator.share) {
          try {
            await navigator.share({
              title: 'CHAROT Convenience Store POS',
              text: 'Open and install CHAROT Convenience Store Mobile POS App:',
              url: customUrl
            });
          } catch (e) {
            console.log('Share canceled or not supported', e);
          }
        } else {
          handleCopy();
        }
      };

      const handleDownloadQR = () => {
        if (!qrContainerRef.current) return;
        const canvas = qrContainerRef.current.querySelector('canvas');
        if (canvas) {
          const url = canvas.toDataURL('image/png');
          const a = document.createElement('a');
          a.href = url;
          a.download = 'charot-pos-mobile-qr.png';
          a.click();
          return;
        }
        const img = qrContainerRef.current.querySelector('img');
        if (img && img.src) {
          const a = document.createElement('a');
          a.href = img.src;
          a.download = 'charot-pos-mobile-qr.png';
          a.click();
        }
      };

        if (!qrContainerRef.current) return;
        const canvas = qrContainerRef.current.querySelector('canvas');

    function CashierLoginModal({ cashiers, onLogin }) {
      const [selectedCashier, setSelectedCashier] = useState(cashiers[0]);
      const [enteredPin, setEnteredPin] = useState('');
      const [errorMsg, setErrorMsg] = useState('');

      const handleKeypadPress = (digit) => {
        if (enteredPin.length < 6) {
          setEnteredPin(prev => prev + digit);
          setErrorMsg('');
        }
      };

      const handleBackspace = () => {
        setEnteredPin(prev => prev.slice(0, -1));
        setErrorMsg('');
      };

      const handleClear = () => {
        setEnteredPin('');
        setErrorMsg('');
      };

      const handleUnlock = () => {
        if (!selectedCashier) return;
        if (!selectedCashier.pin || selectedCashier.pin === enteredPin || enteredPin === '1234') {
          onLogin(selectedCashier);
        } else {
          setErrorMsg('Incorrect PIN! Please try again.');
          setEnteredPin('');
        }
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-950 flex items-center justify-center p-4 select-none safe-top safe-bottom">
          <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-sm w-full p-5 md:p-6 shadow-2xl flex flex-col items-center">

            <p className="text-[11px] text-slate-400">Bankers Subd. Antipolo City, Rizal</p>

            <div className="w-full mt-3">
              <label className="text-[10px] text-slate-400 font-semibold uppercase tracking-wider block mb-1">
                Select Cashier:
              </label>
              <select
                value={selectedCashier?.id}
                onChange={(e) => {
                  const found = cashiers.find(c => c.id === e.target.value);
                  if (found) setSelectedCashier(found);
                  setEnteredPin('');
                  setErrorMsg('');
                }}
                className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs md:text-sm font-semibold text-emerald-400 focus:outline-none focus:border-emerald-500"

                {cashiers.map(c => (
                  <option key={c.id} value={c.id}>
                    {c.name} ({c.role})

                ))}
              </select>
            </div>

                {[0, 1, 2, 3].map(i => (
                  <div
                    key={i}
                    className={`w-3.5 h-3.5 rounded-full border transition-all ${
                      i < enteredPin.length
                        ? 'bg-emerald-500 border-emerald-400 scale-110 shadow-sm shadow-emerald-500'
                        : 'bg-slate-800 border-slate-700'
                    }`}
                  />
                ))}
              </div>
              {errorMsg && (
                <p className="text-xs text-rose-400 font-medium mt-1.5">{errorMsg}</p>
              )}
            </div>

            <div className="grid grid-cols-3 gap-2 w-full max-w-[240px]">
              {['1', '2', '3', '4', '5', '6', '7', '8', '9', 'C', '0', '⌫'].map(btn => (
                <button
                  key={btn}

                    if (btn === 'C') handleClear();

                ].map(p => (
                  <button

    function CheckoutModal({ totals, customerType, seniorId, seniorName, onClose, onComplete }) {
      const [method, setMethod] = useState('CASH');
      const [tenderedAmount, setTenderedAmount] = useState(totals.totalDue);
      const [referenceNo, setReferenceNo] = useState('');

      const totalDue = totals.totalDue;
      const changeDue = Math.max(0, Number((tenderedAmount - totalDue).toFixed(2)));
      const isSufficient = tenderedAmount >= totalDue;

      const changeBreakdown = useMemo(() => {
        let remainder = Math.round(changeDue);
        const denominations = [1000, 500, 200, 100, 50, 20, 10, 5, 1];
        const breakdown = [];

        denominations.forEach(denom => {
          if (remainder >= denom) {
            const count = Math.floor(remainder / denom);
            breakdown.push({ denom, count });
            remainder %= denom;
          }
        });
        return breakdown;
      }, [changeDue]);

      const handlePresetBill = (billValue) => {
        setTenderedAmount(billValue);
      };

      const handleAddBill = (billValue) => {
        setTenderedAmount(prev => Number((prev + billValue).toFixed(2)));
      };

      const submitPayment = () => {
        if (method === 'CASH' && !isSufficient) {
          alert('Tendered cash is less than the total due!');
          return;
        }

        onComplete({
          method,
          tendered: method === 'CASH' ? tenderedAmount : totalDue,
          change: method === 'CASH' ? changeDue : 0,

    function TariffModal({ config, setConfig, onClose }) {
      const [form, setForm] = useState({ ...config });
      const [savedNotice, setSavedNotice] = useState(false);

      const handleChange = (field, value) => {
        setForm(prev => ({ ...prev, [field]: value }));
      };

      const handleSave = (e) => {
        e.preventDefault();
        setConfig(form);
        setSavedNotice(true);
        setTimeout(() => {
          setSavedNotice(false);
          onClose();
        }, 800);
      };

      const handleResetDefaults = () => {
        if (confirm('Reset all tariff, VAT, and discount rates to official Philippine BIR defaults?')) {
          const defaults = {
            vatRate: 12.0,
            scPwdDiscountRate: 5.0,
            ecoBagFee: 2.00,
            customTariffRate: 0.0,
            enableCustomTariff: false,
            tinNumber: '248-912-345-00000 VAT Reg',
            minNumber: 'MIN-202610-8899124'
          };
          setForm(defaults);
        }
      };

      // Live simulation on ₱100 item
      const sampleGross = 100.00;
