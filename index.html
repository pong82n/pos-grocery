      { id: 'Meat & Seafood', label: '🥩 Karne & Isda', icon: '🥩' },
      { id: 'Canned & Instant', label: '🥫 De Lata & Noodles', icon: '🥫' },
      { id: 'Dairy & Eggs', label: '🥛 Gatas, Itlog & Tinapay', icon: '🥛' },
      { id: 'Condiments & Cooking', label: '🧂 Mantika & Rekado', icon: '🧂' },
      { id: 'Beverages', label: '🥤 Inumin', icon: '🥤' },
      { id: 'Snacks', label: '🍪 Chichirya & Biscuits', icon: '🍪' },
      { id: 'Household', label: '🧼 Sabon & Panglinis', icon: '🧼' }
    ];

    // Main App Component
    function App() {
      // Products & Inventory State
      const [products, setProducts] = useState(() => {
        const saved = localStorage.getItem('maharlika_pos_products');
        return saved ? JSON.parse(saved) : INITIAL_PRODUCTS;
      });

      // Active Cart State
      const [cart, setCart] = useState(() => {
        const saved = localStorage.getItem('maharlika_pos_cart');
        return saved ? JSON.parse(saved) : [];
      });

      // Parked (Held) Carts
      const [parkedOrders, setParkedOrders] = useState(() => {
        const saved = localStorage.getItem('maharlika_pos_parked');
        return saved ? JSON.parse(saved) : [];
      });

      // Completed Sales Orders History
      const [completedSales, setCompletedSales] = useState(() => {
        const saved = localStorage.getItem('maharlika_pos_sales');
        return saved ? JSON.parse(saved) : [];
      });

      // Search & Category Filters
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('ALL');

      // Cashier & Store Details
      const [cashierName, setCashierName] = useState('Cashier 01 - Maria');
      const [storeInfo, setStoreInfo] = useState({
        name: 'MAHARLIKA SUPERMARKET & GROCERY',
        branch: 'Branch 04 - Quezon City Metro Manila',
        tin: '248-912-345-00000 VAT Reg',
        min: 'MIN-202610-8899124',
        serial: 'SN-POS-PH-99421',
        tel: '(02) 8921-4455 / 0917-882-9090'
      });

      // Customer Type & RA 9994 / RA 10754 Senior Citizen & PWD Discount
      const [customerType, setCustomerType] = useState('REGULAR'); // 'REGULAR', 'SENIOR', 'PWD'
      const [seniorId, setSeniorId] = useState('');
      const [seniorName, setSeniorName] = useState('');
      const [includeEcoBag, setIncludeEcoBag] = useState(false); // ₱2.00 bag fee

      // Modals
      const [scaleModalItem, setScaleModalItem] = useState(null); // When weighing an item
      const [isCheckoutOpen, setIsCheckoutOpen] = useState(false);
      const [lastReceipt, setLastReceipt] = useState(null);
      const [isInventoryOpen, setIsInventoryOpen] = useState(false);
      const [isShiftModalOpen, setIsShiftModalOpen] = useState(false);
      const [isParkedModalOpen, setIsParkedModalOpen] = useState(false);

      // Barcode auto-focus ref
      const searchInputRef = useRef(null);

      // Save to LocalStorage
      useEffect(() => {
        localStorage.setItem('maharlika_pos_products', JSON.stringify(products));
      }, [products]);

      useEffect(() => {
        localStorage.setItem('maharlika_pos_cart', JSON.stringify(cart));
      }, [cart]);

      useEffect(() => {
        localStorage.setItem('maharlika_pos_parked', JSON.stringify(parkedOrders));
      }, [parkedOrders]);

      useEffect(() => {
        localStorage.setItem('maharlika_pos_sales', JSON.stringify(completedSales));
      }, [completedSales]);

      // Global Keyboard Shortcuts
      useEffect(() => {
        const handleKeyDown = (e) => {
          // If in modal, don't trigger hotkeys
          if (isCheckoutOpen || scaleModalItem || isInventoryOpen || isShiftModalOpen || isParkedModalOpen) {
            if (e.key === 'Escape') {
              setIsCheckoutOpen(false);
              setScaleModalItem(null);
              setIsInventoryOpen(false);
              setIsShiftModalOpen(false);
              setIsParkedModalOpen(false);
            }
            return;
          }

          if (e.key === 'F2') {
            e.preventDefault();
            searchInputRef.current?.focus();
          } else if (e.key === 'F4') {
            e.preventDefault();
            setIsParkedModalOpen(true);
          } else if (e.key === 'F8') {
            e.preventDefault();
            setIsInventoryOpen(true);
          } else if (e.key === 'F9') {
            e.preventDefault();
            setIsShiftModalOpen(true);
          } else if (e.key === 'F12' && cart.length > 0) {
            e.preventDefault();
            setIsCheckoutOpen(true);
          }
        };

        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [cart, isCheckoutOpen, scaleModalItem, isInventoryOpen, isShiftModalOpen, isParkedModalOpen]);

      // Filtered Catalog
      const filteredProducts = useMemo(() => {
        return products.filter(p => {
          const matchCat = selectedCategory === 'ALL' || p.category === selectedCategory;
          const query = searchQuery.trim().toLowerCase();
          const matchSearch = !query ||
            p.name.toLowerCase().includes(query) ||
            p.barcode.includes(query) ||
            (p.plu && p.plu.includes(query)) ||
            p.category.toLowerCase().includes(query);
          return matchCat && matchSearch;
        });
      }, [products, selectedCategory, searchQuery]);

      // Add to Cart
      const handleProductClick = (product) => {
        if (product.stock <= 0) {
          alert(`Ma'am/Sir, out of stock na po ang "${product.name}".`);
          return;
        }

        // If product is weighed (sold per kg), open the Weighing Scale Simulator
        if (product.isWeighed) {
          setScaleModalItem(product);
          return;
        }

        // Otherwise add 1 unit or increment existing
        setCart(prev => {
          const existing = prev.find(item => item.id === product.id);
          if (existing) {
            return prev.map(item =>
              item.id === product.id
                ? { ...item, qty: item.qty + 1, total: (item.qty + 1) * item.price }
                : item
            );
          }
          return [...prev, {
            ...product,
            qty: 1,
            total: product.price
          }];
        });
      };

      // Confirm Weighed item from Scale Modal
      const handleAddWeighedItem = (product, weightInKg) => {
        if (weightInKg <= 0) return;
        setCart(prev => {
          const existingIndex = prev.findIndex(item => item.id === product.id && item.unit === 'kg');
          if (existingIndex >= 0) {
            const updated = [...prev];
            const newQty = Number((updated[existingIndex].qty + weightInKg).toFixed(3));
            updated[existingIndex] = {
              ...updated[existingIndex],
              qty: newQty,
              total: Number((newQty * product.price).toFixed(2))
            };
            return updated;
          }
          return [...prev, {
            ...product,
            qty: Number(weightInKg.toFixed(3)),
            total: Number((weightInKg * product.price).toFixed(2))
          }];
        });
        setScaleModalItem(null);
      };

      // Modify Cart Quantity
      const updateCartQty = (id, newQty) => {
        if (newQty <= 0) {
          removeFromCart(id);
          return;
        }
        setCart(prev => prev.map(item => {
          if (item.id === id) {
            const roundedQty = item.isWeighed ? Number(newQty.toFixed(3)) : Math.round(newQty);
            return {
              ...item,
              qty: roundedQty,
              total: Number((roundedQty * item.price).toFixed(2))
            };
          }
          return item;
        }));
      };

      const removeFromCart = (id) => {
        setCart(prev => prev.filter(item => item.id !== id));
      };

      const clearCart = () => {
        if (cart.length === 0) return;
        if (confirm('Sigurado po ba kayong i-clear ang kasalukuyang cart?')) {
          setCart([]);
          setCustomerType('REGULAR');
          setSeniorId('');
          setSeniorName('');
          setIncludeEcoBag(false);
        }
      };

      // Park Cart (Hold Order)
      const parkCurrentCart = () => {
        if (cart.length === 0) return;
        const customerNote = prompt('Ilagay ang Pangalan o Deskripsyon ng Mamimili (e.g. Cart #3, Mama na naka-blue):', `Customer #${parkedOrders.length + 1}`);
        if (!customerNote) return;

        const newParked = {
          id: 'PARK-' + Date.now(),
          timestamp: new Date().toLocaleTimeString('en-PH'),
          note: customerNote,
          cart: [...cart],
          customerType,
          seniorId,
          seniorName,
          includeEcoBag
        };

        setParkedOrders(prev => [newParked, ...prev]);
        setCart([]);
        setCustomerType('REGULAR');
        setSeniorId('');
        setSeniorName('');
        setIncludeEcoBag(false);
      };

      // Recall Parked Cart
      const recallParkedOrder = (parked) => {
        if (cart.length > 0) {
          if (!confirm('May laman ang kasalukuyang cart. Nais mo bang i-park muna ito o palitan? Pindutin ang OK upang ipalit.')) {
            return;
          }
        }
        setCart(parked.cart);
        setCustomerType(parked.customerType);
        setSeniorId(parked.seniorId || '');
        setSeniorName(parked.seniorName || '');
        setIncludeEcoBag(parked.includeEcoBag || false);
        setParkedOrders(prev => prev.filter(p => p.id !== parked.id));
        setIsParkedModalOpen(false);
      };

      // Philippine BIR VAT & Totals Calculation
      const totals = useMemo(() => {
        let grossSubtotal = 0;
        let vatExemptGross = 0;
        let vatableGross = 0;

        cart.forEach(item => {
          grossSubtotal += item.total;
          if (item.isVatExempt) {
            vatExemptGross += item.total;
          } else {
            vatableGross += item.total;
          }
        });

        // Philippine Tax Code: VAT inclusive prices
        // VATable Net = Gross / 1.12
        // VAT Amount = Gross - VATable Net
        const vatableNet = Number((vatableGross / 1.12).toFixed(2));
        const vatAmount = Number((vatableGross - vatableNet).toFixed(2));

        // Senior Citizen / PWD 5% Basic Necessities and Prime Commodities Discount
        let scDiscount = 0;
        if (customerType === 'SENIOR' || customerType === 'PWD') {
          // RA 9994 / RA 10754 gives 5% discount on grocery basic necessities
          scDiscount = Number((grossSubtotal * 0.05).toFixed(2));
        }

        const bagFee = includeEcoBag ? 2.00 : 0.00;
        const totalDue = Number((grossSubtotal - scDiscount + bagFee).toFixed(2));

        return {
          grossSubtotal,
          vatExemptGross,
          vatableGross,
          vatableNet,
          vatAmount,
          scDiscount,
          bagFee,
          totalDue
        };
      }, [cart, customerType, includeEcoBag]);

      // Complete Checkout & Update Inventory
      const handleCompleteTransaction = (paymentData) => {
        const orderNumber = 'OR-' + Math.floor(100000 + Math.random() * 900000);
        const transactionRecord = {
          orderNumber,
          date: new Date().toLocaleDateString('en-PH'),
          time: new Date().toLocaleTimeString('en-PH'),
          cashier: cashierName,
          customerType,
          seniorId,
          seniorName,
          items: [...cart],
          totals: { ...totals },
          payment: paymentData,
          storeInfo: { ...storeInfo }
        };

        // Deduct inventory
        setProducts(prev => prev.map(p => {
          const bought = cart.find(c => c.id === p.id);
          if (bought) {
            return {
              ...p,
              stock: Number(Math.max(0, p.stock - bought.qty).toFixed(3))
            };
          }
          return p;
        }));

        // Add to completed sales
        setCompletedSales(prev => [transactionRecord, ...prev]);

        // Open Thermal Receipt modal
        setLastReceipt(transactionRecord);
        setIsCheckoutOpen(false);

        // Reset Cart
        setCart([]);
        setCustomerType('REGULAR');
        setSeniorId('');
        setSeniorName('');
        setIncludeEcoBag(false);
      };

      return (
        <div className="flex flex-col h-screen w-screen overflow-hidden bg-slate-950 text-slate-100 select-none">
          {/* Top POS Navigation Bar */}
          <header className="h-14 border-b border-slate-800 bg-slate-900 px-4 flex items-center justify-between z-20 shrink-0">
            <div className="flex items-center space-x-3">
              <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-emerald-600 to-teal-800 flex items-center justify-center shadow-lg shadow-emerald-950/40 border border-emerald-500/30">
                <span className="text-xl">🛒</span>
              </div>
              <div>
                <h1 className="font-bold text-sm tracking-wide text-emerald-400 flex items-center gap-2">
                  {storeInfo.name}
                  <span className="text-[10px] uppercase font-bold tracking-widest px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
                    PHP ₱
                  </span>
                </h1>
                <p className="text-[11px] text-slate-400 font-mono">
                  {storeInfo.branch} • <span className="text-emerald-400 font-medium">{cashierName}</span>
                </p>
              </div>
            </div>

            {/* Quick Action Navigation Buttons */}
            <div className="flex items-center space-x-2">
              <button
                onClick={() => setIsParkedModalOpen(true)}
                className={`relative px-3 py-1.5 rounded-lg border text-xs font-semibold flex items-center gap-1.5 transition ${
                  parkedOrders.length > 0
                    ? 'bg-amber-950/50 border-amber-600/60 text-amber-300 animate-pulse'
                    : 'bg-slate-800 border-slate-700 text-slate-300 hover:bg-slate-700'
                }`}
                title="Parked / Held Carts (F4)"
              >
                <span>⏸️</span>
                <span>Hold ({parkedOrders.length})</span>
                <kbd className="hidden md:inline-block px-1 bg-black/40 rounded text-[9px]">F4</kbd>
              </button>

              <button
                onClick={() => setIsInventoryOpen(true)}
                className="px-3 py-1.5 rounded-lg border border-slate-700 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold flex items-center gap-1.5 transition"
                title="Manage Products & Inventory (F8)"
              >
                <span>📦</span>
                <span>Inventory</span>
                <kbd className="hidden md:inline-block px-1 bg-black/40 rounded text-[9px]">F8</kbd>
              </button>

              <button
                onClick={() => setIsShiftModalOpen(true)}
                className="px-3 py-1.5 rounded-lg border border-slate-700 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold flex items-center gap-1.5 transition"
                title="Daily Shift Sales & Z-Report (F9)"
              >
                <span>📊</span>
                <span>Shift Report</span>
                <kbd className="hidden md:inline-block px-1 bg-black/40 rounded text-[9px]">F9</kbd>
              </button>

              {lastReceipt && (
                <button
                  onClick={() => window.print()}
                  className="px-3 py-1.5 rounded-lg border border-emerald-700/60 bg-emerald-950/60 hover:bg-emerald-900/80 text-emerald-300 text-xs font-semibold flex items-center gap-1.5 transition"
                  title="Reprint Last Receipt"
                >
                  <span>🖨️</span>
                  <span>Print Receipt</span>
                </button>
              )}
            </div>
          </header>

          {/* Main 2-Column POS Layout */}
          <div className="flex-1 flex overflow-hidden">
            
            {/* LEFT COLUMN: Product Catalog & Fast Lookup */}
            <div className="flex-1 flex flex-col border-r border-slate-800/80 bg-slate-950/90 overflow-hidden">
              
              {/* Search & Barcode Wedge Bar */}
              <div className="p-3 bg-slate-900/60 border-b border-slate-800/80 flex items-center gap-2">
                <div className="relative flex-1">
                  <span className="absolute left-3 top-2.5 text-slate-400 text-sm">🔍</span>
                  <input
                    ref={searchInputRef}
                    type="text"
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    onKeyDown={(e) => {
                      if (e.key === 'Enter') {
                        // If exact barcode matched or single product found, add immediately!
                        if (filteredProducts.length === 1) {
                          handleProductClick(filteredProducts[0]);
                          setSearchQuery('');
                        }
                      }
                    }}
                    placeholder="Scan Barcode (EAN-13) or type item name / PLU code (Press F2)..."
                    className="w-full bg-slate-900 border border-slate-700/80 rounded-xl pl-9 pr-16 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500"
                  />
                  {searchQuery && (
                    <button
                      onClick={() => setSearchQuery('')}
                      className="absolute right-3 top-2 text-xs text-slate-400 hover:text-slate-200 px-1.5 py-0.5 rounded bg-slate-800"
                    >
                      Clear
                    </button>
                  )}
                </div>

                <button
                  onClick={() => {
                    const pluInput = prompt('Ilagay ang Produce PLU Code (Halimbawa: 4011 para sa Saging, 2001 Sibuyas):');
                    if (pluInput) {
                      const found = products.find(p => p.plu === pluInput.trim());
                      if (found) {
                        handleProductClick(found);
                      } else {
                        alert(`Walang natagpuang produkto para sa PLU Code: ${pluInput}`);
                      }
                    }
                  }}
                  className="px-3 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl text-xs font-semibold text-emerald-400 flex items-center gap-1.5 shrink-0"
                >
                  <span>🔢</span>
                  <span>PLU Entry</span>
                </button>
              </div>

              {/* Department / Category Tabs */}
              <div className="flex overflow-x-auto gap-1.5 p-2 bg-slate-900/30 border-b border-slate-800/80 scrollbar-none shrink-0">
                {CATEGORIES.map(cat => (
                  <button
                    key={cat.id}
                    onClick={() => setSelectedCategory(cat.id)}
                    className={`px-3 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap transition flex items-center gap-1.5 ${
                      selectedCategory === cat.id
                        ? 'bg-emerald-600 text-white font-semibold shadow-md shadow-emerald-950'
                        : 'bg-slate-900/80 hover:bg-slate-800 text-slate-400 hover:text-slate-200 border border-slate-800'
                    }`}
                  >
                    <span>{cat.icon}</span>
                    <span>{cat.label}</span>
                  </button>
                ))}
              </div>

              {/* Products Grid */}
              <div className="flex-1 overflow-y-auto p-3">
                {filteredProducts.length === 0 ? (
                  <div className="h-full flex flex-col items-center justify-center text-slate-500 py-12">
                    <span className="text-4xl mb-2">🔍</span>
                    <p className="text-sm font-medium">Walang natagpuang produkto sa paghahanap.</p>
                    <p className="text-xs text-slate-600 mt-1">Subukan i-type ang barcode o pangalan.</p>
                  </div>
                ) : (
                  <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-2.5">
                    {filteredProducts.map(product => {
                      const isLowStock = product.stock <= 10;
                      const isOutOfStock = product.stock <= 0;

                      return (
                        <div
                          key={product.id}
                          onClick={() => handleProductClick(product)}
                          className={`relative group flex flex-col justify-between p-3 rounded-xl border text-left cursor-pointer transition-all duration-150 select-none ${
                            isOutOfStock
                              ? 'bg-slate-900/40 border-slate-800/50 opacity-50 cursor-not-allowed'
                              : 'bg-slate-900/90 border-slate-800 hover:border-emerald-500/70 hover:bg-slate-850 hover:shadow-lg hover:shadow-emerald-950/30 active:scale-[0.98]'
                          }`}
                        >
                          <div>
                            {/* Product Header / Badges */}
                            <div className="flex items-start justify-between gap-1 mb-2">
                              <span className="text-2xl filter drop-shadow">{product.image}</span>
                              <div className="flex flex-col items-end gap-1">
                                {product.isWeighed && (
                                  <span className="text-[10px] font-bold px-1.5 py-0.5 rounded bg-blue-500/20 text-blue-300 border border-blue-500/30 flex items-center gap-0.5">
                                    ⚖️ /kg
                                  </span>
                                )}
                                {product.isVatExempt && (
                                  <span className="text-[9px] font-bold px-1 rounded bg-teal-500/20 text-teal-300" title="VAT-Exempt Fresh Agricultural Produce">
                                    EXEMPT
                                  </span>
                                )}
                              </div>
                            </div>

                            {/* Product Name */}
                            <h3 className="font-semibold text-xs leading-snug line-clamp-2 text-slate-200 group-hover:text-emerald-300 transition">
                              {product.name}
                            </h3>

                            {/* PLU / Barcode tiny info */}
                            <p className="text-[10px] font-mono text-slate-500 mt-0.5">
                              {product.plu ? `PLU: ${product.plu}` : product.barcode.slice(-6)}
                            </p>
                          </div>

                          {/* Price & Stock Footer */}
                          <div className="mt-3 pt-2 border-t border-slate-800/80 flex items-baseline justify-between">
                            <div>
                              <span className="text-sm font-bold text-emerald-400">
                                {formatPHP(product.price)}
                              </span>
                              <span className="text-[10px] text-slate-400 font-medium ml-0.5">
                                /{product.unit}
                              </span>
                            </div>
                            <span className={`text-[10px] font-mono ${
                              isOutOfStock ? 'text-red-400 font-bold' : isLowStock ? 'text-amber-400' : 'text-slate-500'
                            }`}>
                              {isOutOfStock ? 'OUT' : `${product.stock} ${product.unit}`}
                            </span>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            </div>

            {/* RIGHT COLUMN: POS Register Cart & Checkout */}
            <div className="w-96 md:w-[420px] lg:w-[460px] flex flex-col bg-slate-900 border-l border-slate-800 shrink-0">
              
              {/* Register Header & Customer Type Selector */}
              <div className="p-3 bg-slate-900 border-b border-slate-800 space-y-2">
                <div className="flex items-center justify-between">
                  <div className="flex items-center space-x-2">
                    <span className="text-xs font-bold uppercase tracking-wider text-slate-400">Mamimili / Discount:</span>
                  </div>
                  <span className="text-xs font-mono text-emerald-400 font-semibold">
                    {cart.reduce((sum, item) => sum + (item.isWeighed ? 1 : item.qty), 0)} {cart.length === 1 ? 'item' : 'items'}
                  </span>
                </div>

                {/* Senior Citizen / PWD / Regular Selector */}
                <div className="grid grid-cols-3 gap-1.5 p-1 bg-slate-950 rounded-xl border border-slate-800">
                  <button
                    onClick={() => {
                      setCustomerType('REGULAR');
                      setSeniorId('');
                      setSeniorName('');
                    }}
                    className={`py-1.5 text-xs font-semibold rounded-lg transition ${
                      customerType === 'REGULAR'
                        ? 'bg-slate-800 text-white shadow-sm'
                        : 'text-slate-400 hover:text-slate-200'
                    }`}
                  >
                    Regular
                  </button>

                  <button
                    onClick={() => {
                      const id = prompt('Ilagay ang Senior Citizen OSCA ID No.:', seniorId);
                      if (id !== null) {
                        setCustomerType('SENIOR');
                        setSeniorId(id);
                        if (!seniorName) {
                          const name = prompt('Pangalan ng Senior Citizen:');
                          if (name) setSeniorName(name);
                        }
                      }
                    }}
                    className={`py-1.5 text-xs font-semibold rounded-lg transition flex items-center justify-center gap-1 ${
                      customerType === 'SENIOR'
                        ? 'bg-amber-600 text-white shadow-sm'
                        : 'text-amber-400 hover:bg-slate-900'
                    }`}
                  >
                    <span>🧓</span>
                    <span>Senior (5%)</span>
                  </button>

                  <button
                    onClick={() => {
                      const id = prompt('Ilagay ang PWD ID No.:', seniorId);
                      if (id !== null) {
                        setCustomerType('PWD');
                        setSeniorId(id);
                        if (!seniorName) {
                          const name = prompt('Pangalan ng PWD Customer:');

          {/* ========================================================= */}

    // =========================================================
    // ⚖️ DIGITAL WEIGHING SCALE COMPONENT
    // =========================================================
    function ScaleModal({ item, onClose, onConfirm }) {
      const [weight, setWeight] = useState(1.000);
      const [isStable, setIsStable] = useState(true);

      const addWeight = (delta) => {
        setIsStable(false);
        setWeight(prev => {
          const next = Math.max(0.05, Number((prev + delta).toFixed(3)));
          return next;
        });
        setTimeout(() => setIsStable(true), 200);
      };

      const lineTotal = Number((weight * item.price).toFixed(2));

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full overflow-hidden shadow-2xl">
            {/* Header */}
            <div className="p-4 bg-slate-850 border-b border-slate-800 flex items-center justify-between">
              <div className="flex items-center space-x-2">
                <span className="text-2xl">{item.image}</span>
                <div>
                  <h3 className="font-bold text-sm text-slate-100">{item.name}</h3>
                  <p className="text-xs text-emerald-400 font-mono">
                    {formatPHP(item.price)} / kg
                  </p>
                </div>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-white text-lg">✕</button>
            </div>

            {/* Realistic Digital Scale Display */}
            <div className="p-6 bg-slate-950 flex flex-col items-center">
              <div className="w-full bg-emerald-950/40 border-2 border-emerald-600/50 rounded-2xl p-5 text-center shadow-inner relative">
                <div className="flex justify-between items-center text-[10px] text-emerald-400 font-mono tracking-widest uppercase mb-1">
                  <span>SCALE SENSOR #01</span>
                  <span className={`px-2 py-0.5 rounded font-bold ${isStable ? 'bg-emerald-500/20 text-emerald-300' : 'bg-amber-500/20 text-amber-300 animate-pulse'}`}>
                    {isStable ? '● STABLE' : '○ WEIGHING...'}
                  </span>
                </div>
                
                {/* Weight Big Numbers */}
                <div className="font-mono text-5xl font-extrabold tracking-tight text-emerald-400 my-2">
                  {weight.toFixed(3)} <span className="text-2xl text-emerald-600 font-sans">kg</span>
                </div>

                <div className="flex justify-between items-center text-xs text-slate-400 font-mono border-t border-emerald-900/40 pt-2 mt-2">
                  <span>Presyo: {formatPHP(item.price)}/kg</span>
                  <span className="text-emerald-300 font-bold text-base">
                    Total: {formatPHP(lineTotal)}
                  </span>
                </div>
              </div>

              {/* Preset Weight Buttons */}
              <div className="grid grid-cols-4 gap-2 w-full mt-5">
                {[
                  { label: '+100g', delta: 0.100 },
                  { label: '+250g', delta: 0.250 },
                  { label: '+500g', delta: 0.500 },
                  { label: '+1.0kg', delta: 1.000 },
                ].map(p => (
                  <button
                    key={p.label}
                    onClick={() => addWeight(p.delta)}
                    className="py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-200 border border-slate-700 active:scale-95 transition"
                  >
                    {p.label}
                  </button>
                ))}
              </div>

              {/* Direct Manual Weight Input */}
              <div className="flex items-center gap-2 w-full mt-3">
                <button
                  onClick={() => setWeight(0.500)}
                  className="px-3 py-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs font-mono text-slate-300 border border-slate-700"
                >
                  Tare / 0.5kg
                </button>
                <input
                  type="number"
                  step="0.05"
                  min="0.01"
                  value={weight}
                  onChange={(e) => setWeight(Math.max(0.01, parseFloat(e.target.value) || 0))}
                  className="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-center font-mono text-slate-100 focus:outline-none focus:border-emerald-500"
                  placeholder="I-type ang timbang (kg)"
                />
                <button
                  onClick={() => setWeight(1.000)}
                  className="px-3 py-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs font-mono text-slate-300 border border-slate-700"
                >
                  Reset 1kg
                </button>
              </div>
            </div>

            {/* Footer Buttons */}
            <div className="p-4 bg-slate-850 border-t border-slate-800 flex justify-end gap-3">
              <button
                onClick={onClose}
                className="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs font-semibold text-slate-300"
              >
                Kanselahin
              </button>
              <button
                onClick={() => onConfirm(weight)}
                className="px-6 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold shadow-lg shadow-emerald-950 flex items-center gap-1.5"
              >
                <span>Ilagay sa Cart</span>
                <span>({formatPHP(lineTotal)})</span>
              </button>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================
    // 💵 CHECKOUT MODAL (Cash Tender & Change, GCash, Maya, Card)
    // =========================================================
    function CheckoutModal({ totals, customerType, seniorId, seniorName, onClose, onComplete }) {
      const [method, setMethod] = useState('CASH'); // 'CASH', 'GCASH', 'MAYA', 'CARD'
      const [tenderedAmount, setTenderedAmount] = useState(totals.totalDue);
      const [referenceNo, setReferenceNo] = useState('');

      const totalDue = totals.totalDue;
      const changeDue = Math.max(0, Number((tenderedAmount - totalDue).toFixed(2)));
      const isSufficient = tenderedAmount >= totalDue;

      // Philippine Cash Denomination Breakdown
      const changeBreakdown = useMemo(() => {
        let remainder = Math.round(changeDue);
        const denominations = [1000, 500, 200, 100, 50, 20, 10, 5, 1];
        const breakdown = [];

        denominations.forEach(denom => {
          if (remainder >= denom) {
            const count = Math.floor(remainder / denom);
            breakdown.push({ denom, count });
            remainder %= denom;
          }
        });
        return breakdown;
      }, [changeDue]);

      const handlePresetBill = (billValue) => {
        setTenderedAmount(billValue);
      };

      const handleAddBill = (billValue) => {
        setTenderedAmount(prev => Number((prev + billValue).toFixed(2)));
      };

      const submitPayment = () => {
        if (method === 'CASH' && !isSufficient) {
          alert('Kulang po ang ibinayad na cash!');
          return;
        }

        onComplete({
          method,
          tendered: method === 'CASH' ? tenderedAmount : totalDue,
          change: method === 'CASH' ? changeDue : 0,
          referenceNo: (method === 'GCASH' || method === 'MAYA' || method === 'CARD') ? (referenceNo || 'REF-' + Math.floor(10000000 + Math.random() * 90000000)) : null
        });
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-xl w-full overflow-hidden shadow-2xl flex flex-col">
            
            {/* Header */}
            <div className="p-4 bg-slate-850 border-b border-slate-800 flex items-center justify-between">
              <div>
                <h3 className="font-bold text-base text-slate-100">Bayad at Pag-checkout</h3>
                <p className="text-xs text-slate-400">
                  Kabuuang Babayaran: <span className="font-bold text-emerald-400 font-mono">{formatPHP(totalDue)}</span>
                </p>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-white text-lg">✕</button>
            </div>

            {/* Payment Method Selector Tabs */}
            <div className="p-4 bg-slate-950 border-b border-slate-800">
              <div className="grid grid-cols-4 gap-2">
                {[
                  { id: 'CASH', label: '💵 Cash', sub: 'Philippine Peso' },
                  { id: 'GCASH', label: '📱 GCash', sub: 'E-Wallet QR' },
                  { id: 'MAYA', label: '🟣 Maya', sub: 'E-Wallet / Card' },
                  { id: 'CARD', label: '💳 Debit / Card', sub: 'BDO / Maya Terminal' }
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setMethod(tab.id)}
                    className={`p-3 rounded-xl border text-left transition ${
                      method === tab.id
                        ? 'bg-emerald-950/60 border-emerald-500 text-emerald-300 shadow-md'
                        : 'bg-slate-900 border-slate-800 text-slate-400 hover:text-slate-200'
                    }`}
                  >
                    <div className="font-bold text-xs">{tab.label}</div>
                    <div className="text-[10px] text-slate-500 mt-0.5">{tab.sub}</div>
                  </button>
                ))}
              </div>
            </div>

            {/* Tab Body */}
            <div className="p-6 flex-1 overflow-y-auto space-y-4">
              
              {/* CASH PAYMENT MODE */}
              {method === 'CASH' && (
                <div className="space-y-4">
                  {/* Tendered Input & Change Box */}
                  <div className="grid grid-cols-2 gap-4">
                    <div className="p-4 bg-slate-950 border border-slate-800 rounded-xl">
                      <label className="text-xs text-slate-400 font-medium block mb-1">
                        Ibinayad na Cash (Tendered):
                      </label>
                      <div className="flex items-center">
                        <span className="text-emerald-400 text-xl font-bold font-mono mr-1">₱</span>
                        <input
                          type="number"
                          step="1"
                          value={tenderedAmount}
                          onChange={(e) => setTenderedAmount(parseFloat(e.target.value) || 0)}
                          className="w-full bg-transparent font-mono text-2xl font-bold text-slate-100 focus:outline-none"
                        />
                      </div>
                    </div>

                    <div className={`p-4 border rounded-xl flex flex-col justify-between ${
                      isSufficient ? 'bg-emerald-950/30 border-emerald-600/40' : 'bg-red-950/30 border-red-600/40'
                    }`}>
                      <span className="text-xs font-medium text-slate-400">Sukli (Change Due):</span>
                      <span className={`font-mono text-3xl font-extrabold ${isSufficient ? 'text-emerald-400' : 'text-red-400'}`}>
                        {formatPHP(changeDue)}
                      </span>
                    </div>
                  </div>

                  {/* Quick Philippine Peso Bill Buttons */}
                  <div>
                    <label className="text-xs text-slate-400 font-medium block mb-2">
                      Mabilisang Pindot ng Salaping Papel (Exact / Bills):
                    </label>
                    <div className="grid grid-cols-4 gap-2">
                      <button
                        onClick={() => handlePresetBill(totalDue)}
                        className="py-2.5 bg-slate-800 hover:bg-slate-700 text-xs font-bold text-emerald-400 rounded-xl border border-slate-700"
                      >
                        Exact Amount
                      </button>
                      <button
                        onClick={() => handlePresetBill(1000)}
                        className="py-2.5 bg-blue-950/60 hover:bg-blue-900 border border-blue-600/50 text-blue-300 text-xs font-bold rounded-xl"
                      >
                        ₱1,000 Bill
                      </button>
                      <button
                        onClick={() => handlePresetBill(500)}
                        className="py-2.5 bg-amber-950/60 hover:bg-amber-900 border border-amber-600/50 text-amber-300 text-xs font-bold rounded-xl"
                      >
                        ₱500 Bill
                      </button>
                      <button
                        onClick={() => handlePresetBill(200)}
                        className="py-2.5 bg-green-950/60 hover:bg-green-900 border border-green-600/50 text-green-300 text-xs font-bold rounded-xl"
                      >
                        ₱200 Bill
                      </button>
                    </div>

                    <div className="grid grid-cols-4 gap-2 mt-2">
                      <button
                        onClick={() => handlePresetBill(100)}
                        className="py-2 bg-purple-950/60 hover:bg-purple-900 border border-purple-600/50 text-purple-300 text-xs font-bold rounded-xl"
                      >
                        ₱100 Bill
                      </button>
                      <button
                        onClick={() => handlePresetBill(50)}
                        className="py-2 bg-rose-950/60 hover:bg-rose-900 border border-rose-600/50 text-rose-300 text-xs font-bold rounded-xl"
                      >
                        ₱50 Bill
                      </button>
                      <button
                        onClick={() => handlePresetBill(20)}
                        className="py-2 bg-orange-950/60 hover:bg-orange-900 border border-orange-600/50 text-orange-300 text-xs font-bold rounded-xl"
                      >
                        ₱20 Bill
                      </button>
                      <button
                        onClick={() => handleAddBill(100)}
                        className="py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 text-xs font-bold rounded-xl"
                      >
                        +₱100
                      </button>
                    </div>
                  </div>

                  {/* Sukli Breakdown Guide for Cashier */}
                  {changeDue > 0 && (
                    <div className="p-3 bg-slate-950 border border-slate-800 rounded-xl">
                      <span className="text-[11px] font-semibold text-slate-400 block mb-1.5 uppercase tracking-wider">

    // =========================================================
    // 📦 INVENTORY MANAGEMENT MODAL
    // =========================================================
    function InventoryModal({ products, setProducts, onClose }) {
      const [filter, setFilter] = useState('');
      const [editingId, setEditingId] = useState(null);
      const [editPrice, setEditPrice] = useState(0);
      const [editStock, setEditStock] = useState(0);

      const filtered = products.filter(p =>
        !filter ||
        p.name.toLowerCase().includes(filter.toLowerCase()) ||
        p.barcode.includes(filter) ||
        (p.plu && p.plu.includes(filter))
      );

      const startEdit = (p) => {
        setEditingId(p.id);
        setEditPrice(p.price);
        setEditStock(p.stock);
      };

      const saveEdit = (id) => {
        setProducts(prev => prev.map(p => {
          if (p.id === id) {
            return {
              ...p,
              price: parseFloat(editPrice) || p.price,
              stock: parseFloat(editStock) || p.stock
            };
          }
          return p;
        }));
        setEditingId(null);
      };

      const restockItem = (id, amount) => {
        setProducts(prev => prev.map(p => {
          if (p.id === id) {
            return { ...p, stock: Number((p.stock + amount).toFixed(3)) };
          }
          return p;
        }));
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-4xl w-full h-[85vh] overflow-hidden shadow-2xl flex flex-col">
            
            {/* Header */}
            <div className="p-4 bg-slate-850 border-b border-slate-800 flex items-center justify-between">
              <div className="flex items-center space-x-2">
                <span className="text-xl">📦</span>
                <h3 className="font-bold text-sm text-slate-100">Pamamahala ng Imbentaryo at Presyo (Inventory SRP)</h3>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-white text-lg">✕</button>
            </div>

            {/* Filter Search */}
            <div className="p-3 bg-slate-950 border-b border-slate-800 flex items-center gap-3">
              <input
                type="text"
                value={filter}
                onChange={(e) => setFilter(e.target.value)}
                placeholder="I-filter ayon sa pangalan, barcode, o PLU..."
                className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-emerald-500"
              />
              <span className="text-xs text-slate-400 font-mono shrink-0">
                {filtered.length} produkto
              </span>
            </div>

            {/* Table */}
            <div className="flex-1 overflow-y-auto">
              <table className="w-full text-left text-xs border-collapse">
                <thead className="bg-slate-950 text-slate-400 sticky top-0 border-b border-slate-800">
                  <tr>
                    <th className="p-3">Produkto</th>
                    <th className="p-3">Kategorya</th>
                    <th className="p-3 font-mono">Barcode / PLU</th>
                    <th className="p-3 text-right">Puhunan (Cost)</th>
                    <th className="p-3 text-right">Presyo (SRP)</th>
                    <th className="p-3 text-right">Stock</th>
                    <th className="p-3 text-center">Aksyon</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800/80">
                  {filtered.map(p => {
                    const isEditing = editingId === p.id;
                    const isLow = p.stock <= 10;
                    return (
                      <tr key={p.id} className="hover:bg-slate-850/50">
                        <td className="p-3 font-medium text-slate-200">
                          <span className="mr-2">{p.image}</span>
                          {p.name}
                        </td>
                        <td className="p-3 text-slate-400">{p.category}</td>
                        <td className="p-3 font-mono text-[11px] text-slate-400">
                          {p.plu ? `PLU: ${p.plu}` : p.barcode}
                        </td>
                        <td className="p-3 text-right font-mono text-slate-400">
                          {formatPHP(p.cost)}
                        </td>
                        <td className="p-3 text-right font-mono">
                          {isEditing ? (
                            <input
                              type="number"
                              step="0.5"
                              value={editPrice}
                              onChange={(e) => setEditPrice(e.target.value)}
                              className="w-20 bg-slate-950 border border-emerald-500 rounded px-1.5 py-0.5 text-right text-xs text-emerald-400 font-mono"
                            />
                          ) : (
                            <span className="font-bold text-emerald-400">{formatPHP(p.price)}</span>
                          )}
                        </td>
                        <td className="p-3 text-right font-mono">
                          {isEditing ? (
                            <input
                              type="number"
                              value={editStock}
                              onChange={(e) => setEditStock(e.target.value)}
                              className="w-16 bg-slate-950 border border-emerald-500 rounded px-1.5 py-0.5 text-right text-xs text-slate-200 font-mono"
                            />
                          ) : (
                            <span className={isLow ? 'text-amber-400 font-bold' : 'text-slate-300'}>
                              {p.stock} {p.unit}
                            </span>
                          )}
                        </td>
                        <td className="p-3 text-center space-x-1">
                          {isEditing ? (
                            <button
                              onClick={() => saveEdit(p.id)}
                              className="px-2 py-1 bg-emerald-600 hover:bg-emerald-500 rounded text-[11px] font-bold text-white"
                            >
                              Save
                            </button>
                          ) : (
                            <>
                              <button
                                onClick={() => startEdit(p)}
                                className="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-[11px]"
                              >
                                Edit
                              </button>
                              <button
                                onClick={() => restockItem(p.id, p.isWeighed ? 20 : 50)}
                                className="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-emerald-400 rounded text-[11px]"
                                title="Quick restock"
                              >
                                +Restock
                              </button>
                            </>
                          )}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>

            {/* Footer */}
            <div className="p-3 bg-slate-850 border-t border-slate-800 flex justify-between items-center">
              <span className="text-xs text-slate-400">
                💡 Ang mga bagong presyo at stock ay awtomatikong nai-save sa browser memory.
              </span>
              <button
                onClick={onClose}
                className="px-4 py-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs font-semibold text-slate-200"
              >
                Isara
              </button>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================
    // 📊 SHIFT SALES & BIR Z-REPORT MODAL
    // =========================================================
    function ShiftReportModal({ sales, cashierName, storeInfo, onClose }) {
      const shiftSummary = useMemo(() => {
        let totalRevenue = 0;
        let totalCash = 0;
        let totalGCash = 0;
        let totalMaya = 0;
        let totalCard = 0;
        let totalVat = 0;
        let totalVatExempt = 0;
        let totalDiscounts = 0;

        sales.forEach(sale => {
          totalRevenue += sale.totals.totalDue;
          totalVat += sale.totals.vatAmount;
          totalVatExempt += sale.totals.vatExemptGross;
          totalDiscounts += sale.totals.scDiscount;

          if (sale.payment.method === 'CASH') totalCash += sale.totals.totalDue;
          else if (sale.payment.method === 'GCASH') totalGCash += sale.totals.totalDue;
          else if (sale.payment.method === 'MAYA') totalMaya += sale.totals.totalDue;
          else if (sale.payment.method === 'CARD') totalCard += sale.totals.totalDue;
        });

        return {
          totalOrders: sales.length,
          totalRevenue,
          totalCash,
          totalGCash,
          totalMaya,
          totalCard,
          totalVat,
          totalVatExempt,
          totalDiscounts,
          avgTicket: sales.length ? (totalRevenue / sales.length) : 0
        };
      }, [sales]);

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-2xl w-full overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">

              <button onClick={onClose} className="text-slate-400 hover:text-white text-lg">✕</button>
            </div>

            {/* Metrics Grid */}
            <div className="p-5 overflow-y-auto space-y-4">
              <div className="grid grid-cols-3 gap-3">
                <div className="p-4 bg-slate-950 border border-slate-800 rounded-xl">
                  <span className="text-xs text-slate-400">Kabuuang Benta (Gross Sales):</span>
                  <div className="text-2xl font-bold font-mono text-emerald-400 mt-1">
                    {formatPHP(shiftSummary.totalRevenue)}
                  </div>
                </div>
                <div className="p-4 bg-slate-950 border border-slate-800 rounded-xl">
                  <span className="text-xs text-slate-400">Bilang ng Transaksyon:</span>
                  <div className="text-2xl font-bold font-mono text-slate-100 mt-1">
                    {shiftSummary.totalOrders}
                  </div>
                </div>
                <div className="p-4 bg-slate-950 border border-slate-800 rounded-xl">
                  <span className="text-xs text-slate-400">Average Basket:</span>
                  <div className="text-2xl font-bold font-mono text-slate-100 mt-1">
                    {formatPHP(shiftSummary.avgTicket)}
                  </div>
                </div>
              </div>

              {/* Payment Tender Breakdown */}
              <div className="p-4 bg-slate-950 border border-slate-800 rounded-xl space-y-2">
                <h4 className="font-bold text-xs text-slate-300 uppercase tracking-wider">
                  Koleksyon Ayon sa Paraan ng Pagbabayad:
                </h4>
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 pt-1 text-xs">
                  <div className="p-2.5 bg-slate-900 rounded-lg border border-slate-800">
                    <span className="text-slate-400 block">💵 Cash sa Drawer:</span>
                    <span className="font-bold font-mono text-emerald-400">{formatPHP(shiftSummary.totalCash)}</span>
                  </div>
                  <div className="p-2.5 bg-slate-900 rounded-lg border border-slate-800">
                    <span className="text-slate-400 block">📱 GCash E-Wallet:</span>
                    <span className="font-bold font-mono text-blue-400">{formatPHP(shiftSummary.totalGCash)}</span>
                  </div>
                  <div className="p-2.5 bg-slate-900 rounded-lg border border-slate-800">
                    <span className="text-slate-400 block">🟣 Maya E-Wallet:</span>
                    <span className="font-bold font-mono text-emerald-400">{formatPHP(shiftSummary.totalMaya)}</span>
                  </div>
                  <div className="p-2.5 bg-slate-900 rounded-lg border border-slate-800">
                    <span className="text-slate-400 block">💳 Debit / Credit:</span>
                    <span className="font-bold font-mono text-purple-400">{formatPHP(shiftSummary.totalCard)}</span>
                  </div>
                </div>
              </div>

              {/* BIR Tax Breakdown */}
              <div className="p-4 bg-slate-950 border border-slate-800 rounded-xl space-y-1.5 text-xs">
                <h4 className="font-bold text-xs text-slate-300 uppercase tracking-wider mb-2">
                  BIR Official Sales Reconciliation:
                </h4>
                <div className="flex justify-between text-slate-400">
                  <span>12% VAT Collected:</span>
                  <span className="font-mono text-slate-200">{formatPHP(shiftSummary.totalVat)}</span>
                </div>
                <div className="flex justify-between text-slate-400">
                  <span>VAT-Exempt Fresh Agricultural Sales:</span>
                  <span className="font-mono text-slate-200">{formatPHP(shiftSummary.totalVatExempt)}</span>
                </div>
                <div className="flex justify-between text-slate-400">
                  <span>Senior / PWD 5% Discounts Given:</span>
                  <span className="font-mono text-amber-400">-{formatPHP(shiftSummary.totalDiscounts)}</span>
                </div>
              </div>
            </div>

            {/* Footer */}
            <div className="p-4 bg-slate-850 border-t border-slate-800 flex justify-end">
              <button
                onClick={onClose}
                className="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs font-semibold text-slate-200"
              >
                Isara
              </button>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================
    // ⏸️ PARKED / HELD CARTS MODAL
    // =========================================================
    function ParkedOrdersModal({ orders, onRecall, onDelete, onClose }) {
      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full overflow-hidden shadow-2xl flex flex-col max-h-[85vh]">
            
            <div className="p-4 bg-slate-850 border-b border-slate-800 flex items-center justify-between">
              <div className="flex items-center space-x-2">
                <span className="text-xl">⏸️</span>
                <h3 className="font-bold text-sm text-slate-100">Mga Nakabinbing Cart (Held Orders)</h3>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-white text-lg">✕</button>
            </div>

            <div className="p-4 flex-1 overflow-y-auto space-y-3">
              {orders.length === 0 ? (
                <div className="text-center py-10 text-slate-500">
                  <span className="text-3xl">🧺</span>
                  <p className="text-xs mt-2">Walang nakabinbing order sa kasalukuyan.</p>
                </div>
              ) : (
                orders.map(order => {
                  const itemCount = order.cart.reduce((s, it) => s + (it.isWeighed ? 1 : it.qty), 0);
                  const orderTotal = order.cart.reduce((s, it) => s + it.total, 0);

                  return (
                    <div key={order.id} className="p-3 bg-slate-950 border border-slate-800 rounded-xl flex items-center justify-between">
                      <div>
                        <div className="flex items-center gap-2">
                          <span className="font-bold text-xs text-amber-300">{order.note}</span>
                          <span className="text-[10px] text-slate-500 font-mono">{order.timestamp}</span>
                        </div>
                        <p className="text-xs text-slate-400 mt-1">
                          {itemCount} mga aytem • <span className="font-mono text-emerald-400 font-bold">{formatPHP(orderTotal)}</span>
                        </p>
                      </div>

                      <div className="flex items-center space-x-2">
                        <button
                          onClick={() => onRecall(order)}
                          className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-bold shadow"
                        >
                          Ibalik (Recall)
                        </button>
                        <button
                          onClick={() => onDelete(order.id)}
                          className="text-slate-500 hover:text-red-400 text-sm p-1"
                          title="Tanggalin"
                        >
                          ✕
                        </button>
                      </div>
                    </div>
                  );
                })
              )}
            </div>

            <div className="p-3 bg-slate-850 border-t border-slate-800 flex justify-end">
              <button
                onClick={onClose}
                className="px-4 py-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs font-semibold text-slate-200"
              >
                Isara
              </button>
            </div>
          </div>
        </div>
      );
    }

    // Render React App
    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
