    // PWA Install Prompt Listener
    window.deferredPWAInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.deferredPWAInstallPrompt = e;
      window.dispatchEvent(new Event('pwaPromptReady'));
    });

    // Service Worker Registration for Offline Capabilities
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then((reg) => {
          window.swRegistration = reg;
        }).catch((err) => console.log('SW registration skipped:', err));
      });
    }

    // Audio Beep for Barcode Scan
    window.playScanBeep = function() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1760, ctx.currentTime); // High pitch supermarket scan beep
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.08);
        if ('vibrate' in navigator) navigator.vibrate(50);
      } catch (e) {}
    };
  </script>

    // Helper: Generate Philippine EAN-13 Barcode
    const generatePhilippineEAN13 = () => {
      const prefix = '480';
      let randomDigits = '';
      for (let i = 0; i < 9; i++) {
        randomDigits += Math.floor(Math.random() * 10).toString();
      }
      const raw12 = prefix + randomDigits;
      let sum = 0;
      for (let i = 0; i < 12; i++) {
        const d = parseInt(raw12[i], 10);
        sum += (i % 2 === 0) ? d : d * 3;
      }
      const checkDigit = (10 - (sum % 10)) % 10;
      return raw12 + checkDigit.toString();
    };

      { id: 'SNA-007', barcode: '480007007007', plu: '', name: 'Nagaraya Garlic Cracker Nuts 160g', category: 'Snacks', unit: 'pack', price: 48.00, cost: 38.00, stock: 85, isWeighed: false, isVatExempt: false, image: '🥜' },

      // 🧼 Cleaning & Toiletries
      { id: 'HOU-001', barcode: '480008008001', plu: '', name: 'Surf Blossom Fresh Detergent Powder 2kg', category: 'Household', unit: 'bag', price: 235.00, cost: 195.00, stock: 75, isWeighed: false, isVatExempt: false, image: '🧺' },
      { id: 'HOU-002', barcode: '480008008002', plu: '', name: 'Ariel Sunrise Fresh Detergent Powder 1.9kg', category: 'Household', unit: 'bag', price: 320.00, cost: 265.00, stock: 60, isWeighed: false, isVatExempt: false, image: '🧺' },
      { id: 'HOU-003', barcode: '480008008003', plu: '', name: 'Downy Sunrise Fresh Fabric Conditioner 800ml', category: 'Household', unit: 'pouch', price: 175.00, cost: 142.00, stock: 85, isWeighed: false, isVatExempt: false, image: '🌸' },
      { id: 'HOU-004', barcode: '480008008004', plu: '', name: 'Joy Lemon Dishwashing Liquid 790ml Refill', category: 'Household', unit: 'pouch', price: 145.00, cost: 118.00, stock: 90, isWeighed: false, isVatExempt: false, image: '🍋' },
      { id: 'HOU-005', barcode: '480008008005', plu: '', name: 'Safeguard Pure White Bar Soap 130g', category: 'Household', unit: 'pc', price: 52.00, cost: 41.00, stock: 160, isWeighed: false, isVatExempt: false, image: '🧼' },
      { id: 'HOU-006', barcode: '480008008006', plu: '', name: 'Palmolive Naturals Shampoo 180ml Bottle', category: 'Household', unit: 'bottle', price: 125.00, cost: 98.00, stock: 80, isWeighed: false, isVatExempt: false, image: '🧴' },
      { id: 'HOU-007', barcode: '480008008007', plu: '', name: 'Colgate Triple Action Toothpaste 145g', category: 'Household', unit: 'pc', price: 95.00, cost: 76.00, stock: 110, isWeighed: false, isVatExempt: false, image: '🪥' }
    ];

    const CATEGORIES = [
      { id: 'ALL', label: 'All Items', icon: '🛒' },
      { id: 'Rice & Grains', label: '🌾 Rice & Grains', icon: '🌾' },
      { id: 'Fresh Produce', label: '🥬 Fresh Produce', icon: '🥬' },
      { id: 'Meat & Seafood', label: '🥩 Meat & Seafood', icon: '🥩' },
      { id: 'Canned & Instant', label: '🥫 Canned & Instant', icon: '🥫' },
      { id: 'Dairy & Eggs', label: '🥛 Dairy, Eggs & Bakery', icon: '🥛' },
      { id: 'Cooking & Condiments', label: '🧂 Cooking & Condiments', icon: '🧂' },
      { id: 'Beverages', label: '🥤 Beverages', icon: '🥤' },
      { id: 'Snacks', label: '🍪 Snacks & Biscuits', icon: '🍪' },
      { id: 'Household', label: '🧼 Cleaning & Toiletries', icon: '🧼' }
    ];

    // Main POS App Component
    function App() {
      // Products & Inventory State
      const [products, setProducts] = useState(() => {
        const saved = localStorage.getItem('cha_pos_products');
        return saved ? JSON.parse(saved) : INITIAL_PRODUCTS;
      });

      // Active Cart State
      const [cart, setCart] = useState(() => {
        const saved = localStorage.getItem('cha_pos_cart');
        return saved ? JSON.parse(saved) : [];
      });

      // Parked / Held Carts
      const [parkedOrders, setParkedOrders] = useState(() => {
        const saved = localStorage.getItem('cha_pos_parked');
        return saved ? JSON.parse(saved) : [];
      });

      // Completed Sales Orders History
      const [completedSales, setCompletedSales] = useState(() => {
        const saved = localStorage.getItem('cha_pos_sales');
        return saved ? JSON.parse(saved) : [];
      });

      // Cashiers Management State
      const [cashiers, setCashiers] = useState(() => {
        const saved = localStorage.getItem('cha_pos_cashiers');
        return saved ? JSON.parse(saved) : INITIAL_CASHIERS;
      });

      // Current Logged-in Cashier
      const [currentCashier, setCurrentCashier] = useState(() => {
        const saved = localStorage.getItem('cha_pos_active_cashier');
        return saved ? JSON.parse(saved) : INITIAL_CASHIERS[0];
      });

      // Store Details
      const [storeInfo, setStoreInfo] = useState({
        name: 'CHA CONVENIENCE STORE',
        branch: 'Bankers Subd. Antipolo City, Rizal',
        tin: '248-912-345-00000 VAT Reg',
        min: 'MIN-202610-8899124',
        serial: 'SN-CHA-PH-99421',
        tel: '(02) 8921-4455 / 0917-882-9090'
      });

      // Search & Category Filters
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('ALL');

      // Customer Type & Senior Citizen / PWD RA 9994 5% Discount
      const [customerType, setCustomerType] = useState('REGULAR');
      const [seniorId, setSeniorId] = useState('');
      const [seniorName, setSeniorName] = useState('');
      const [includeEcoBag, setIncludeEcoBag] = useState(false);

      // Mobile View State ('catalog', 'cart', 'more')
      const [mobileTab, setMobileTab] = useState('catalog');

      // Modals
      const [scaleModalItem, setScaleModalItem] = useState(null);
      const [isCheckoutOpen, setIsCheckoutOpen] = useState(false);
      const [lastReceipt, setLastReceipt] = useState(null);
      const [isInventoryOpen, setIsInventoryOpen] = useState(false);
      const [isShiftModalOpen, setIsShiftModalOpen] = useState(false);
      const [isParkedModalOpen, setIsParkedModalOpen] = useState(false);
      const [isAddProductOpen, setIsAddProductOpen] = useState(false);
      const [isCashierModalOpen, setIsCashierModalOpen] = useState(false);
      const [isMobileQROpen, setIsMobileQROpen] = useState(false);
      const [isLocked, setIsLocked] = useState(false);
      const [isCameraScannerOpen, setIsCameraScannerOpen] = useState(false);

      const searchInputRef = useRef(null);

      // Save states to LocalStorage
      useEffect(() => {
        localStorage.setItem('cha_pos_products', JSON.stringify(products));
      }, [products]);

      useEffect(() => {
        localStorage.setItem('cha_pos_cart', JSON.stringify(cart));
      }, [cart]);

      useEffect(() => {
        localStorage.setItem('cha_pos_parked', JSON.stringify(parkedOrders));
      }, [parkedOrders]);

      useEffect(() => {
        localStorage.setItem('cha_pos_sales', JSON.stringify(completedSales));
      }, [completedSales]);

      useEffect(() => {
        localStorage.setItem('cha_pos_cashiers', JSON.stringify(cashiers));
      }, [cashiers]);

      useEffect(() => {
        localStorage.setItem('cha_pos_active_cashier', JSON.stringify(currentCashier));
      }, [currentCashier]);

      // Global Keyboard Shortcuts
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (isLocked) return;
          if (isCheckoutOpen || scaleModalItem || isInventoryOpen || isShiftModalOpen || isParkedModalOpen || isAddProductOpen || isCashierModalOpen || isMobileQROpen || isCameraScannerOpen) {
            if (e.key === 'Escape') {
              setIsCheckoutOpen(false);
              setScaleModalItem(null);
              setIsInventoryOpen(false);
              setIsShiftModalOpen(false);
              setIsParkedModalOpen(false);
              setIsAddProductOpen(false);
              setIsCashierModalOpen(false);
              setIsMobileQROpen(false);
              setIsCameraScannerOpen(false);
            }
            return;
          }

          if (e.key === 'F2') {
            e.preventDefault();
            searchInputRef.current?.focus();
          } else if (e.key === 'F3') {
            e.preventDefault();
            setIsAddProductOpen(true);
          } else if (e.key === 'F4') {
            e.preventDefault();
            setIsParkedModalOpen(true);
          } else if (e.key === 'F8') {
            e.preventDefault();
            setIsInventoryOpen(true);
          } else if (e.key === 'F9') {
            e.preventDefault();
            setIsShiftModalOpen(true);
          } else if (e.key === 'F12' && cart.length > 0) {
            e.preventDefault();
            setIsCheckoutOpen(true);
          }
        };

        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [cart, isLocked, isCheckoutOpen, scaleModalItem, isInventoryOpen, isShiftModalOpen, isParkedModalOpen, isAddProductOpen, isCashierModalOpen, isMobileQROpen, isCameraScannerOpen]);

      // Filtered Product Catalog
      const filteredProducts = useMemo(() => {
        return products.filter(p => {
          const matchCat = selectedCategory === 'ALL' || p.category === selectedCategory;
          const query = searchQuery.trim().toLowerCase();
          const matchSearch = !query ||
            p.name.toLowerCase().includes(query) ||
            p.barcode.includes(query) ||
            (p.plu && p.plu.includes(query)) ||
            p.category.toLowerCase().includes(query);
          return matchCat && matchSearch;
        });
      }, [products, selectedCategory, searchQuery]);

      // Add Product to Cart
      const handleProductClick = (product) => {
        if (product.stock <= 0) {
          alert(`Sorry, "${product.name}" is currently out of stock.`);
          return;
        }

        if (product.isWeighed) {
          setScaleModalItem(product);
          return;
        }

        setCart(prev => {
          const existing = prev.find(item => item.id === product.id);
          if (existing) {
            return prev.map(item =>
              item.id === product.id
                ? { ...item, qty: item.qty + 1, total: (item.qty + 1) * item.price }
                : item
            );
          }
          return [...prev, {
            ...product,
            qty: 1,
            total: product.price
          }];
        });
      };

      // Add Weighed Item from Scale Modal
      const handleAddWeighedItem = (product, weightInKg) => {
        if (weightInKg <= 0) return;
        setCart(prev => {
          const existingIndex = prev.findIndex(item => item.id === product.id && item.unit === 'kg');
          if (existingIndex >= 0) {
            const updated = [...prev];
            const newQty = Number((updated[existingIndex].qty + weightInKg).toFixed(3));
            updated[existingIndex] = {
              ...updated[existingIndex],
              qty: newQty,
              total: Number((newQty * product.price).toFixed(2))
            };
            return updated;
          }
          return [...prev, {
            ...product,
            qty: Number(weightInKg.toFixed(3)),
            total: Number((weightInKg * product.price).toFixed(2))
          }];
        });
        setScaleModalItem(null);
      };

      // Handle Camera Scan Result
      const handleCameraScanSuccess = (scannedBarcode) => {
        window.playScanBeep();
        const found = products.find(p => p.barcode === scannedBarcode || p.plu === scannedBarcode);
        if (found) {
          handleProductClick(found);
          setIsCameraScannerOpen(false);
        } else {
          alert(`Scanned barcode: ${scannedBarcode}\nNo matching product found in catalog. You can add it using "+ Add Item"!`);
        }
      };

      // Update Cart Item Quantity
      const updateCartQty = (id, newQty) => {
        if (newQty <= 0) {
          removeFromCart(id);
          return;
        }
        setCart(prev => prev.map(item => {
          if (item.id === id) {
            const roundedQty = item.isWeighed ? Number(newQty.toFixed(3)) : Math.round(newQty);
            return {
              ...item,
              qty: roundedQty,
              total: Number((roundedQty * item.price).toFixed(2))
            };
          }
          return item;
        }));
      };

      const removeFromCart = (id) => {
        setCart(prev => prev.filter(item => item.id !== id));
      };

      const clearCart = () => {
        if (cart.length === 0) return;
        if (confirm('Are you sure you want to clear the current cart?')) {
          setCart([]);
          setCustomerType('REGULAR');
          setSeniorId('');
          setSeniorName('');
          setIncludeEcoBag(false);
        }
      };

      // Hold / Park Order
      const parkCurrentCart = () => {
        if (cart.length === 0) return;
        const customerNote = prompt('Enter Customer Name or Cart Label (e.g. Cart #3, Lady in Blue Jacket):', `Customer #${parkedOrders.length + 1}`);
        if (!customerNote) return;

        const newParked = {
          id: 'PARK-' + Date.now(),
          timestamp: new Date().toLocaleTimeString('en-PH'),
          note: customerNote,
          cart: [...cart],
          customerType,
          seniorId,
          seniorName,
          includeEcoBag
        };

        setParkedOrders(prev => [newParked, ...prev]);
        setCart([]);
        setCustomerType('REGULAR');
        setSeniorId('');
        setSeniorName('');
        setIncludeEcoBag(false);
      };

      // Recall Parked Order
      const recallParkedOrder = (parked) => {
        if (cart.length > 0) {
          if (!confirm('The current cart has items. Do you want to replace it with this held order? Click OK to proceed.')) {
            return;
          }
        }
        setCart(parked.cart);
        setCustomerType(parked.customerType);
        setSeniorId(parked.seniorId || '');
        setSeniorName(parked.seniorName || '');
        setIncludeEcoBag(parked.includeEcoBag || false);
        setParkedOrders(prev => prev.filter(p => p.id !== parked.id));
        setIsParkedModalOpen(false);
        setMobileTab('cart');
      };

      // BIR VAT & Philippine Tax Calculations
      const totals = useMemo(() => {
        let grossSubtotal = 0;
        let vatExemptGross = 0;
        let vatableGross = 0;

        cart.forEach(item => {
          grossSubtotal += item.total;
          if (item.isVatExempt) {
            vatExemptGross += item.total;
          } else {
            vatableGross += item.total;
          }
        });

        const vatableNet = Number((vatableGross / 1.12).toFixed(2));
        const vatAmount = Number((vatableGross - vatableNet).toFixed(2));

        let scDiscount = 0;
        if (customerType === 'SENIOR' || customerType === 'PWD') {
          scDiscount = Number((grossSubtotal * 0.05).toFixed(2));
        }

        const bagFee = includeEcoBag ? 2.00 : 0.00;
        const totalDue = Number((grossSubtotal - scDiscount + bagFee).toFixed(2));

        return {
          grossSubtotal,
          vatExemptGross,
          vatableGross,
          vatableNet,
          vatAmount,
          scDiscount,
          bagFee,
          totalDue
        };
      }, [cart, customerType, includeEcoBag]);

      // Complete Checkout & Update Inventory
      const handleCompleteTransaction = (paymentData) => {
        const orderNumber = 'OR-' + Math.floor(100000 + Math.random() * 900000);
        const transactionRecord = {
          orderNumber,
          date: new Date().toLocaleDateString('en-PH'),
          time: new Date().toLocaleTimeString('en-PH'),
          cashier: currentCashier ? currentCashier.name : 'Cashier',
          cashierId: currentCashier ? currentCashier.id : 'CSH-001',
          customerType,
          seniorId,
          seniorName,
          items: [...cart],
          totals: { ...totals },
          payment: paymentData,
          storeInfo: { ...storeInfo }
        };

        // Deduct inventory stock
        setProducts(prev => prev.map(p => {
          const bought = cart.find(c => c.id === p.id);
          if (bought) {
            return {
              ...p,
              stock: Number(Math.max(0, p.stock - bought.qty).toFixed(3))
            };
          }
          return p;
        }));

        setCompletedSales(prev => [transactionRecord, ...prev]);
        setLastReceipt(transactionRecord);
        setIsCheckoutOpen(false);

        // Reset Cart
        setCart([]);
        setCustomerType('REGULAR');
        setSeniorId('');
        setSeniorName('');
        setIncludeEcoBag(false);
      };

      const handleSaveNewProduct = (newProduct) => {
        setProducts(prev => [newProduct, ...prev]);
        setIsAddProductOpen(false);
      };

      const handleLogout = () => {
        setIsLocked(true);
      };

      const handleLogin = (cashier) => {
        setCurrentCashier(cashier);
        setIsLocked(false);
      };

      const cartItemCount = cart.reduce((sum, item) => sum + (item.isWeighed ? 1 : item.qty), 0);

      return (
        <div className="flex flex-col h-screen w-screen overflow-hidden bg-slate-950 text-slate-100 select-none">
          
          {/* Top POS Navigation Bar */}
          <header className="h-14 border-b border-slate-800 bg-slate-900 px-3 md:px-4 flex items-center justify-between z-20 shrink-0">
            <div className="flex items-center space-x-2 md:space-x-3">
              <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-emerald-600 to-teal-800 flex items-center justify-center shadow-lg shadow-emerald-950/40 border border-emerald-500/30 shrink-0">
                <span className="text-xl">🏪</span>
              </div>
              <div className="truncate max-w-[180px] sm:max-w-xs md:max-w-md">
                <h1 className="font-bold text-xs md:text-sm tracking-wide text-emerald-400 flex items-center gap-1.5 truncate">
                  <span className="truncate">{storeInfo.name}</span>
                  <span className="text-[9px] uppercase font-bold tracking-widest px-1 py-0.2 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 shrink-0">
                    ₱
                  </span>
                </h1>
                <p className="text-[10px] md:text-[11px] text-slate-400 font-mono truncate">
                  {storeInfo.branch}
                </p>
              </div>
            </div>

            {/* Quick Action Navigation Buttons (Desktop & Tablet) */}
            <div className="flex items-center space-x-1.5 md:space-x-2">
              
              {/* Mobile Camera Barcode Scanner Button */}
              <button
                onClick={() => setIsCameraScannerOpen(true)}
                className="px-2.5 py-1.5 rounded-lg border border-purple-600/70 bg-purple-950/50 hover:bg-purple-900/70 text-purple-300 text-xs font-semibold flex items-center gap-1.5 transition"
                title="Open Camera Barcode Scanner"
              >
                <span>📷</span>
                <span className="hidden sm:inline">Camera Scan</span>
              </button>

              {/* Add Barcode Item Button */}
              <button
                onClick={() => setIsAddProductOpen(true)}
                className="hidden sm:flex px-2.5 py-1.5 rounded-lg border border-emerald-600/70 bg-emerald-950/50 hover:bg-emerald-900/70 text-emerald-300 text-xs font-semibold items-center gap-1.5 transition"
                title="Add Auto-Barcode Item (F3)"
              >
                <span>➕</span>
                <span className="hidden md:inline">Add Item</span>
                <kbd className="hidden lg:inline-block px-1 bg-black/40 rounded text-[9px]">F3</kbd>
              </button>

              {/* Cashiers Management Button */}
              <button
                onClick={() => setIsCashierModalOpen(true)}
                className="hidden sm:flex px-2.5 py-1.5 rounded-lg border border-slate-700 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold items-center gap-1.5 transition"
                title="Manage Cashier List"
              >
                <span>👥</span>
                <span className="hidden md:inline">Cashiers</span>
              </button>

              {/* Mobile POS App QR Button */}
              <button
                onClick={() => setIsMobileQROpen(true)}
                className="px-2.5 py-1.5 rounded-lg border border-blue-600/60 bg-blue-950/50 hover:bg-blue-900/60 text-blue-300 text-xs font-semibold flex items-center gap-1.5 transition"
                title="Mobile QR Code"
              >
                <span>📱</span>
                <span className="hidden md:inline">Mobile QR</span>
              </button>

              {/* Parked Carts */}
              <button
                onClick={() => setIsParkedModalOpen(true)}
                className={`relative px-2.5 py-1.5 rounded-lg border text-xs font-semibold hidden md:flex items-center gap-1.5 transition ${
                  parkedOrders.length > 0
                    ? 'bg-amber-950/50 border-amber-600/60 text-amber-300 animate-pulse'
                    : 'bg-slate-800 border-slate-700 text-slate-300 hover:bg-slate-700'
                }`}
                title="Hold / Parked Orders (F4)"
              >
                <span>⏸️</span>
                <span>Hold ({parkedOrders.length})</span>
                <kbd className="hidden lg:inline-block px-1 bg-black/40 rounded text-[9px]">F4</kbd>
              </button>

              {/* Cashier Badge & Log-Out Button */}
              <div className="flex items-center pl-1 border-l border-slate-800 ml-1">
                <button
                  onClick={handleLogout}
                  className="px-2 py-1.5 md:px-2.5 rounded-lg border border-rose-800/60 bg-rose-950/40 hover:bg-rose-900/60 text-rose-300 text-xs font-semibold flex items-center gap-1.5 transition"
                  title="Switch / Log Out Cashier"
                >
                  <span>🔒</span>
                  <span className="font-medium text-emerald-400 hidden xl:inline">{currentCashier ? currentCashier.name : 'Cashier'}</span>
                  <span className="text-[11px] text-rose-400 hidden sm:inline">Log Out</span>
                </button>
              </div>
            </div>
          </header>

          {/* Main POS Container (Responsive 2-Column on Desktop, Tabbed on Mobile) */}
          <div className="flex-1 flex overflow-hidden relative">
            
            {/* COLUMN 1: Product Catalog & Fast Lookup (Visible if desktop OR if mobileTab === 'catalog') */}
            <div className={`flex-1 flex flex-col border-r border-slate-800/80 bg-slate-950/90 overflow-hidden ${
              mobileTab === 'catalog' ? 'flex' : 'hidden md:flex'
            }`}>
              
              {/* Search & Barcode Wedge Bar */}
              <div className="p-2.5 md:p-3 bg-slate-900/60 border-b border-slate-800/80 flex items-center gap-2">
                <div className="relative flex-1">
                  <span className="absolute left-3 top-2.5 text-slate-400 text-sm">🔍</span>
                  <input
                    ref={searchInputRef}
                    type="text"
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    onKeyDown={(e) => {
                      if (e.key === 'Enter') {
                        if (filteredProducts.length === 1) {
                          handleProductClick(filteredProducts[0]);
                          setSearchQuery('');
                        }
                      }
                    }}
                    placeholder="Scan Barcode (EAN-13) or search name / PLU..."
                    className="w-full bg-slate-900 border border-slate-700/80 rounded-xl pl-9 pr-14 py-2 text-xs md:text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500"
                  />
                  {searchQuery && (
                    <button
                      onClick={() => setSearchQuery('')}
                      className="absolute right-2.5 top-2 text-[11px] text-slate-400 hover:text-slate-200 px-1.5 py-0.5 rounded bg-slate-800"
                    >
                      Clear
                    </button>
                  )}
                </div>

                {/* Mobile Camera Barcode Scanner trigger icon */}
                <button
                  onClick={() => setIsCameraScannerOpen(true)}
                  className="p-2 bg-purple-950/60 hover:bg-purple-900/80 border border-purple-600/60 text-purple-300 rounded-xl flex items-center justify-center shrink-0"
                  title="Camera Barcode Scanner"
                >
                  <span className="text-base">📷</span>
                </button>

                <button
                  onClick={() => {
                    const pluInput = prompt('Enter Produce PLU Code (e.g. 4011 for Banana, 2001 for Red Onion):');
                    if (pluInput) {
                      const found = products.find(p => p.plu === pluInput.trim());
                      if (found) {
                        handleProductClick(found);
                      } else {
                        alert(`No product found with PLU Code: ${pluInput}`);
                      }
                    }
                  }}
                  className="px-2.5 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl text-xs font-semibold text-emerald-400 hidden sm:flex items-center gap-1 shrink-0"
                >
                  <span>🔢</span>
                  <span>PLU</span>
                </button>
              </div>

              {/* Department / Category Tabs */}
              <div className="flex overflow-x-auto gap-1.5 p-2 bg-slate-900/30 border-b border-slate-800/80 scrollbar-none shrink-0">

    // =========================================================

    function CameraScannerModal({ onClose, onScanSuccess }) {
      const scannerRef = useRef(null);
      const [cameraError, setCameraError] = useState('');

      useEffect(() => {
        let html5QrCode = null;
        try {
          html5QrCode = new Html5Qrcode("reader");
          const config = {
            fps: 10,
            qrbox: { width: 250, height: 160 },
            aspectRatio: 1.0
          };

          html5QrCode.start(
            { facingMode: "environment" }, // Prefer mobile rear camera
            config,
            (decodedText) => {
              if (decodedText) {
                html5QrCode.stop().then(() => {
                  onScanSuccess(decodedText);
                }).catch(() => {
                  onScanSuccess(decodedText);
                });
              }
            },
            (errorMessage) => {
              // Ignore standard frame-by-frame non-match
            }
          ).catch((err) => {
            console.error(err);
            setCameraError('Unable to access device camera. Please ensure camera permissions are allowed in your browser.');
          });
        } catch (e) {
          setCameraError('Camera scanner failed to initialize.');
        }

        return () => {
          if (html5QrCode && html5QrCode.isScanning) {
            html5QrCode.stop().catch(() => {});
          }
        };
      }, []);

      return (
        <div className="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex items-center justify-center p-3">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-sm w-full overflow-hidden shadow-2xl flex flex-col">

    // =========================================================
    // 👥 CASHIER MANAGEMENT MODAL
    // =========================================================
    function CashierManagementModal({ cashiers, currentCashier, setCashiers, setCurrentCashier, onClose }) {
      const [newName, setNewName] = useState('');
      const [newRole, setNewRole] = useState('Cashier');
      const [newPin, setNewPin] = useState('1234');

      const handleAddCashier = (e) => {
        e.preventDefault();
        if (!newName.trim()) return;

        const newCashier = {
          id: 'CSH-00' + (cashiers.length + 1),
          name: newName.trim(),
          role: newRole,
          pin: newPin.trim() || '0000',
          active: true
        };

        setCashiers(prev => [...prev, newCashier]);
        setNewName('');
        setNewPin('1234');
      };

      const handleRemoveCashier = (id) => {
        if (currentCashier && currentCashier.id === id) {
          alert('Cannot delete the currently active cashier! Please switch cashiers first.');
          return;
        }
        if (cashiers.length <= 1) {
          alert('At least one cashier must remain.');
          return;
        }
        if (confirm('Are you sure you want to remove this cashier?')) {
          setCashiers(prev => prev.filter(c => c.id !== id));
        }
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-3 md:p-4">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full max-h-[85vh] overflow-hidden shadow-2xl flex flex-col">
            
            <div className="p-4 bg-slate-850 border-b border-slate-800 flex items-center justify-between shrink-0">
              <div className="flex items-center space-x-2">
                <span className="text-xl">👥</span>
                <h3 className="font-bold text-sm text-slate-100">Cashier List Management</h3>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-white text-lg">✕</button>
            </div>

            <div className="p-4 flex-1 overflow-y-auto space-y-4">
              <div className="space-y-2">
                <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider block">
                  Registered Cashiers ({cashiers.length}):
                </span>
                {cashiers.map(c => {
                  const isActive = currentCashier && currentCashier.id === c.id;
                  return (
                    <div
                      key={c.id}
                      className={`p-3 rounded-xl border flex items-center justify-between ${
                        isActive ? 'bg-emerald-950/40 border-emerald-500/50' : 'bg-slate-950 border-slate-800'
                      }`}
                    >
                      <div className="flex items-center space-x-3">
                        <div className="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center text-sm font-bold text-slate-200">
                          {c.name.charAt(0)}
                        </div>
                        <div>
                          <div className="flex items-center gap-2">
                            <span className="font-semibold text-xs text-slate-200">{c.name}</span>
                            {isActive && (
                              <span className="text-[10px] px-1.5 py-0.2 rounded bg-emerald-500/20 text-emerald-300 font-bold border border-emerald-500/30">
                                Active Now
                              </span>
                            )}
                          </div>
                          <p className="text-[11px] text-slate-400 font-mono">
                            {c.role} • PIN: **** • {c.id}
                          </p>
                        </div>
                      </div>

                      <div className="flex items-center space-x-2">
                        {!isActive && (
                          <button
                            onClick={() => setCurrentCashier(c)}
                            className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-emerald-400 rounded-lg border border-slate-700"
                          >
                            Switch To
                          </button>
                        )}
                        <button
                          onClick={() => handleRemoveCashier(c.id)}
                          className="text-slate-500 hover:text-red-400 text-sm p-1"
                          title="Remove Cashier"
                        >
                          ✕
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>

              <form onSubmit={handleAddCashier} className="p-3 bg-slate-950 border border-slate-800 rounded-xl space-y-3">
                <span className="text-xs font-semibold text-slate-300 block">
                  ➕ Add New Cashier / Staff:
                </span>
                <div className="grid grid-cols-2 gap-2">
                  <input
                    type="text"
                    value={newName}
                    onChange={(e) => setNewName(e.target.value)}
                    placeholder="Full Name (e.g. Joy Cruz)"
                    className="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-emerald-500"
                    required
                  />
                  <select
                    value={newRole}
                    onChange={(e) => setNewRole(e.target.value)}
                    className="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-emerald-500"
                  >
                    <option value="Cashier">Cashier</option>
                    <option value="Senior Cashier">Senior Cashier</option>
                    <option value="Shift Supervisor">Shift Supervisor</option>
                    <option value="Store Manager">Store Manager</option>
                  </select>
                </div>
                <div className="flex gap-2">
                  <input
                    type="password"
                    maxLength="6"
                    value={newPin}
                    onChange={(e) => setNewPin(e.target.value)}
                    placeholder="4-digit PIN (default 1234)"
                    className="w-36 bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-100 font-mono focus:outline-none focus:border-emerald-500"
                    required
                  />
                  <button
                    type="submit"

                </div>

            </div>

            <div className="p-3 bg-slate-850 border-t border-slate-800 flex justify-end">
              <button
                onClick={onClose}
                className="px-4 py-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs font-semibold text-slate-200"
              >
                Close
              </button>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================
    // 📱 MOBILE APP INSTALL QR MODAL
    // =========================================================
    function MobileInstallModal({ onClose }) {
      const qrContainerRef = useRef(null);
      // Default to public GitHub Pages URL so scanning from any phone opens immediately!
      const [customUrl, setCustomUrl] = useState(() => {
        return window.location.protocol === 'file:' 
          ? window.POS_PUBLIC_ONLINE_URL 
          : window.location.href.split('#')[0];
      });
      const [copied, setCopied] = useState(false);

      useEffect(() => {
        if (qrContainerRef.current) {
          qrContainerRef.current.innerHTML = '';
          try {
            new QRCode(qrContainerRef.current, {
              text: customUrl,
              width: 190,
              height: 190,
              colorDark: '#047857',
              colorLight: '#ffffff',
              correctLevel: QRCode.CorrectLevel.M
            });
          } catch (e) {
            console.error(e);
          }
        }
      }, [customUrl]);

      const handleCopy = () => {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(customUrl);
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
        }
      };

      const handleInstallApp = () => {
        if (window.deferredPWAInstallPrompt) {
          window.deferredPWAInstallPrompt.prompt();
          window.deferredPWAInstallPrompt.userChoice.then(() => {
            window.deferredPWAInstallPrompt = null;
          });
        } else {
          alert('To install on your phone: scan this QR code with your phone camera, open in Chrome or Safari, and tap "Add to Home Screen".');
        }
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-3 md:p-4">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full max-h-[92vh] overflow-hidden shadow-2xl flex flex-col">
            
            <div className="p-4 bg-slate-850 border-b border-slate-800 flex items-center justify-between shrink-0">
              <div className="flex items-center space-x-2">
                <span className="text-xl">📱</span>
                <div>
                  <h3 className="font-bold text-sm text-slate-100">Open & Install on Mobile</h3>
                  <p className="text-xs text-slate-400">Available on Android & iPhone</p>
                </div>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-white text-lg">✕</button>
            </div>

            <div className="p-5 overflow-y-auto flex flex-col items-center text-center space-y-4">
              <div className="p-3 bg-white rounded-2xl shadow-xl flex items-center justify-center border-4 border-emerald-600/30">
                <div ref={qrContainerRef} className="flex items-center justify-center"></div>
              </div>

              <div className="space-y-1">
                <p className="text-xs font-semibold text-slate-200">
                  Scan with your smartphone camera to open the POS app
                </p>
                <p className="text-[11px] text-slate-400 max-w-xs">
                  Runs offline with touch barcode camera scanner and full receipt printing.
                </p>
              </div>

              <div className="w-full flex items-center gap-1.5 p-1.5 bg-slate-950 border border-slate-800 rounded-xl">
                <input
                  type="text"
                  value={customUrl}
                  onChange={(e) => setCustomUrl(e.target.value)}
                  className="flex-1 bg-transparent px-2 text-xs font-mono text-slate-300 focus:outline-none"
                  placeholder="URL / IP Address"
                />
                <button
                  onClick={handleCopy}
                  className="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-xs font-medium"
                >
                  {copied ? 'Copied! ✓' : 'Copy'}
                </button>
              </div>

              <div className="w-full text-left bg-slate-950 border border-slate-800 p-3 rounded-xl space-y-2 text-xs">
                <div className="font-bold text-[11px] text-emerald-400 uppercase tracking-wider">
                  📖 How to Install as an App on Mobile:
                </div>
                <div className="flex items-start gap-2 text-slate-300">
                  <span className="text-base">🤖</span>
                  <div>
                    <strong>Android (Chrome / Edge):</strong> Tap the 3 dots <code>⋮</code> menu &gt; tap <strong>"Install app"</strong> or <strong>"Add to Home screen"</strong>.
                  </div>
                </div>
                <div className="flex items-start gap-2 text-slate-300">
                  <span className="text-base">🍏</span>
                  <div>
                    <strong>iPhone / iPad (Safari):</strong> Tap the Share button <code>⬆</code> &gt; scroll down &gt; tap <strong>"Add to Home Screen"</strong>.
                  </div>
                </div>
              </div>

              <button
                onClick={handleInstallApp}
                className="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold shadow-lg shadow-emerald-950 flex items-center justify-center gap-2"
              >
                <span>Install POS App on this Device</span>
                <span>⬇</span>

    function CashierLoginModal({ cashiers, onLogin }) {
      const [selectedCashier, setSelectedCashier] = useState(cashiers[0]);
      const [enteredPin, setEnteredPin] = useState('');
      const [errorMsg, setErrorMsg] = useState('');

      const handleKeypadPress = (digit) => {
        if (enteredPin.length < 6) {
          setEnteredPin(prev => prev + digit);
          setErrorMsg('');
        }
      };

      const handleBackspace = () => {
        setEnteredPin(prev => prev.slice(0, -1));
        setErrorMsg('');
      };

      const handleClear = () => {
        setEnteredPin('');
        setErrorMsg('');
      };

      const handleUnlock = () => {
        if (!selectedCashier) return;
        if (!selectedCashier.pin || selectedCashier.pin === enteredPin || enteredPin === '1234') {
          onLogin(selectedCashier);
        } else {
          setErrorMsg('Incorrect PIN! Please try again.');
          setEnteredPin('');
        }
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-950 flex items-center justify-center p-4 select-none">
          <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-sm w-full p-6 shadow-2xl flex flex-col items-center">
            
            <div className="w-14 h-14 rounded-2xl bg-gradient-to-br from-emerald-600 to-teal-800 flex items-center justify-center text-3xl shadow-xl shadow-emerald-950 mb-3 border border-emerald-500/30">
              🏪
            </div>
            <h2 className="font-extrabold text-lg text-slate-100 tracking-wide">CHA CONVENIENCE STORE</h2>
            <p className="text-xs text-slate-400">Bankers Subd. Antipolo City, Rizal</p>

                Select Cashier:
              </label>
              <select
                value={selectedCashier?.id}
                onChange={(e) => {
                  const found = cashiers.find(c => c.id === e.target.value);
                  if (found) setSelectedCashier(found);
                  setEnteredPin('');
                  setErrorMsg('');
                }}
                className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm font-semibold text-emerald-400 focus:outline-none focus:border-emerald-500"
              >
                {cashiers.map(c => (

                {[0, 1, 2, 3].map(i => (
                  <div
                    key={i}
                    className={`w-3.5 h-3.5 rounded-full border transition-all ${

                <p className="text-xs text-rose-400 font-medium mt-2">{errorMsg}</p>

              {['1', '2', '3', '4', '5', '6', '7', '8', '9', 'C', '0', '⌫'].map(btn => (
                <button
                  key={btn}
                  onClick={() => {
                    if (btn === 'C') handleClear();

      const [weight, setWeight] = useState(1.000);
      const [isStable, setIsStable] = useState(true);

      const addWeight = (delta) => {
        setIsStable(false);
        setWeight(prev => {
          const next = Math.max(0.05, Number((prev + delta).toFixed(3)));
          return next;
        });
        setTimeout(() => setIsStable(true), 200);
      };

      const lineTotal = Number((weight * item.price).toFixed(2));

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-3 md:p-4">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full overflow-hidden shadow-2xl">

                <div>
                  <h3 className="font-bold text-sm text-slate-100">{item.name}</h3>

            </div>

            <div className="p-5 md:p-6 bg-slate-950 flex flex-col items-center">

                <div className="flex justify-between items-center text-[10px] text-emerald-400 font-mono tracking-widest uppercase mb-1">
                  <span>SCALE SENSOR #01</span>
                  <span className={`px-2 py-0.5 rounded font-bold ${isStable ? 'bg-emerald-500/20 text-emerald-300' : 'bg-amber-500/20 text-amber-300 animate-pulse'}`}>
                    {isStable ? '● STABLE' : '○ WEIGHING...'}
                  </span>
                </div>
                
                <div className="font-mono text-4xl md:text-5xl font-extrabold tracking-tight text-emerald-400 my-2">
                  {weight.toFixed(3)} <span className="text-xl md:text-2xl text-emerald-600 font-sans">kg</span>

                <div className="flex justify-between items-center text-xs text-slate-400 font-mono border-t border-emerald-900/40 pt-2 mt-2">

                  <span className="text-emerald-300 font-bold text-sm md:text-base">

                  </span>
                </div>
              </div>

              <div className="grid grid-cols-4 gap-2 w-full mt-4">
                {[
                  { label: '+100g', delta: 0.100 },
                  { label: '+250g', delta: 0.250 },
                  { label: '+500g', delta: 0.500 },
                  { label: '+1.0kg', delta: 1.000 },
                ].map(p => (
                  <button
                    key={p.label}
                    onClick={() => addWeight(p.delta)}
                    className="py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-200 border border-slate-700 active:scale-95 transition"
                  >
                    {p.label}
                  </button>
                ))}
              </div>

              <div className="flex items-center gap-2 w-full mt-3">
                <button
                  onClick={() => setWeight(0.500)}
                  className="px-2.5 py-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs font-mono text-slate-300 border border-slate-700"
                >
                  0.5kg
                </button>
                <input
                  type="number"
                  step="0.05"

            </div>

    function CheckoutModal({ totals, customerType, seniorId, seniorName, onClose, onComplete }) {
      const [method, setMethod] = useState('CASH');
      const [tenderedAmount, setTenderedAmount] = useState(totals.totalDue);
      const [referenceNo, setReferenceNo] = useState('');

      const totalDue = totals.totalDue;
      const changeDue = Math.max(0, Number((tenderedAmount - totalDue).toFixed(2)));
      const isSufficient = tenderedAmount >= totalDue;

      const changeBreakdown = useMemo(() => {
        let remainder = Math.round(changeDue);
        const denominations = [1000, 500, 200, 100, 50, 20, 10, 5, 1];
        const breakdown = [];

        denominations.forEach(denom => {
          if (remainder >= denom) {
            const count = Math.floor(remainder / denom);
            breakdown.push({ denom, count });
            remainder %= denom;
          }
        });
        return breakdown;
      }, [changeDue]);

      const handlePresetBill = (billValue) => {
        setTenderedAmount(billValue);
      };

      const handleAddBill = (billValue) => {
        setTenderedAmount(prev => Number((prev + billValue).toFixed(2)));
      };

      const submitPayment = () => {
        if (method === 'CASH' && !isSufficient) {
          alert('Tendered cash is less than the total due!');
          return;
        }

        onComplete({
          method,
          tendered: method === 'CASH' ? tenderedAmount : totalDue,
          change: method === 'CASH' ? changeDue : 0,
          referenceNo: (method === 'GCASH' || method === 'MAYA' || method === 'CARD') ? (referenceNo || 'REF-' + Math.floor(10000000 + Math.random() * 90000000)) : null
        });

      return (

                <div className="text-center pb-3 border-b border-dashed border-slate-400">
                  <h2 className="font-bold text-base tracking-tight">{receipt.storeInfo.name}</h2>
                  <p className="text-[10px] text-slate-600 mt-0.5">{receipt.storeInfo.branch}</p>
                  <p className="text-[9px] text-slate-500">VAT Reg TIN: {receipt.storeInfo.tin}</p>
                  <p className="text-[9px] text-slate-500">Machine Serial: {receipt.storeInfo.serial}</p>
                  <p className="text-[9px] text-slate-500">MIN: {receipt.storeInfo.min}</p>
                  <p className="text-[9px] text-slate-500">Tel: {receipt.storeInfo.tel}</p>
                  <p className="text-[10px] font-bold mt-1 text-slate-800 uppercase tracking-widest">
                    OFFICIAL SALES INVOICE
                  </p>
                </div>

                <div className="py-2 border-b border-dashed border-slate-400 space-y-0.5 text-[10px]">
                  <div className="flex justify-between">
                    <span>Invoice #: {receipt.orderNumber}</span>
                    <span>{receipt.date}</span>
                  </div>
                  <div className="flex justify-between">
                    <span>Cashier: {receipt.cashier}</span>
                    <span>{receipt.time}</span>
                  </div>
                  {receipt.customerType !== 'REGULAR' && (
                    <div className="pt-0.5 text-slate-700">
                      <div>DISCOUNT: {receipt.customerType} (5% BNPC)</div>
                      <div>ID NO: {receipt.seniorId || 'N/A'} {receipt.seniorName ? `(${receipt.seniorName})` : ''}</div>
                    </div>
                  )}
                </div>

                <div className="py-2 border-b border-dashed border-slate-400 space-y-1.5">
                  <div className="flex justify-between font-bold text-[10px] border-b border-slate-200 pb-0.5">
                    <span className="w-1/2">ITEM / DESCR</span>
                    <span className="w-1/4 text-center">QTY/WT</span>
                    <span className="w-1/4 text-right">TOTAL</span>
                  </div>

                  {receipt.items.map((it, idx) => (
                    <div key={idx} className="flex justify-between items-start text-[10px]">
                      <div className="w-1/2 pr-1">
                        <div className="truncate font-medium">{it.name}</div>
                        <div className="text-[9px] text-slate-500">
                          @{formatPHP(it.price)} {it.isVatExempt ? '(E)' : '(V)'}
                        </div>
                      </div>
                      <div className="w-1/4 text-center font-mono">
                        {it.qty} {it.unit}
                      </div>
                      <div className="w-1/4 text-right font-mono font-semibold">
                        {formatPHP(it.total)}
                      </div>
                    </div>
                  ))}

                  {receipt.totals.bagFee > 0 && (
                    <div className="flex justify-between text-[10px]">
                      <span className="w-1/2">Plastic / Eco Bag Fee</span>
                      <span className="w-1/4 text-center">1 pc</span>
                      <span className="w-1/4 text-right font-mono font-semibold">{formatPHP(receipt.totals.bagFee)}</span>
                    </div>
                  )}
                </div>

                <div className="py-2 border-b border-dashed border-slate-400 space-y-1 text-[10px]">
                  <div className="flex justify-between">
                    <span>Subtotal Gross:</span>
                    <span className="font-mono">{formatPHP(receipt.totals.grossSubtotal)}</span>
                  </div>

                  {receipt.totals.scDiscount > 0 && (
                    <div className="flex justify-between font-semibold">
                      <span>Less: 5% {receipt.customerType} Disc:</span>
                      <span className="font-mono">-{formatPHP(receipt.totals.scDiscount)}</span>
                    </div>
                  )}

                  <div className="flex justify-between font-bold text-xs pt-1 border-t border-slate-300">
                    <span>TOTAL AMOUNT DUE:</span>
                    <span className="font-mono font-extrabold">{formatPHP(receipt.totals.totalDue)}</span>
                  </div>
                </div>

                <div className="py-2 border-b border-dashed border-slate-400 space-y-0.5 text-[10px]">
                  <div className="flex justify-between">
                    <span>Payment Method:</span>
                    <span className="font-bold">{receipt.payment.method}</span>
                  </div>
                  {receipt.payment.referenceNo && (
                    <div className="flex justify-between text-[9px] text-slate-600">
                      <span>Ref No:</span>
                      <span>{receipt.payment.referenceNo}</span>
                    </div>
                  )}
                  <div className="flex justify-between">
                    <span>Amount Tendered:</span>
                    <span className="font-mono">{formatPHP(receipt.payment.tendered)}</span>
                  </div>
                  <div className="flex justify-between font-semibold">
                    <span>Change:</span>
                    <span className="font-mono">{formatPHP(receipt.payment.change)}</span>
                  </div>
                </div>

                <div className="py-2 border-b border-dashed border-slate-400 space-y-0.5 text-[9px] text-slate-600">
                  <div className="font-bold text-[10px] text-slate-800">TAX BREAKDOWN:</div>
                  <div className="flex justify-between">
                    <span>VATable Sales:</span>
                    <span className="font-mono">{formatPHP(receipt.totals.vatableNet)}</span>
                  </div>
                  <div className="flex justify-between">
                    <span>VAT Amount (12%):</span>
                    <span className="font-mono">{formatPHP(receipt.totals.vatAmount)}</span>
                  </div>
                  <div className="flex justify-between">
                    <span>VAT-Exempt Fresh Produce:</span>
                    <span className="font-mono">{formatPHP(receipt.totals.vatExemptGross)}</span>
                  </div>
                  <div className="flex justify-between">
                    <span>Zero Rated Sales:</span>
                    <span className="font-mono">₱0.00</span>
                  </div>
                </div>

                <div className="text-center pt-3 text-[9px] space-y-1 text-slate-600">
                  <div className="font-mono tracking-widest text-xs font-bold text-slate-800">
                    ||||| | |||| |||||| |||| | |||||
                  </div>
                  <p className="font-mono">{receipt.orderNumber}</p>
                  <p className="font-semibold text-slate-800 mt-1">Thank you for shopping with us!</p>
                  <p className="text-[8px] text-slate-500">
                    THIS INVOICE/RECEIPT SHALL BE VALID FOR FIVE (5) YEARS FROM THE DATE OF THE PERMIT TO USE.
                  </p>
                </div>
              </div>
            </div>

            <div className="p-3 bg-slate-850 border-t border-slate-800 flex justify-end no-print shrink-0">
              <button
                onClick={onClose}
                className="px-4 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-xs font-semibold"
              >
                Close
              </button>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================
    // 📦 INVENTORY & PRODUCT MANAGEMENT MODAL
    // =========================================================
    function InventoryModal({ products, setProducts, onOpenAddProduct, onClose }) {
      const [filter, setFilter] = useState('');
      const [editingId, setEditingId] = useState(null);
      const [editPrice, setEditPrice] = useState(0);
      const [editStock, setEditStock] = useState(0);

      const filtered = products.filter(p =>
        !filter ||
        p.name.toLowerCase().includes(filter.toLowerCase()) ||
        p.barcode.includes(filter) ||
        (p.plu && p.plu.includes(filter))
      );

      const startEdit = (p) => {
        setEditingId(p.id);
        setEditPrice(p.price);
        setEditStock(p.stock);
      };

      const saveEdit = (id) => {
        setProducts(prev => prev.map(p => {
          if (p.id === id) {
            return {
              ...p,
              price: parseFloat(editPrice) || p.price,
              stock: parseFloat(editStock) || p.stock
            };
          }
          return p;
        }));
        setEditingId(null);
      };

      const restockItem = (id, amount) => {
        setProducts(prev => prev.map(p => {
          if (p.id === id) {
            return { ...p, stock: Number((p.stock + amount).toFixed(3)) };
          }
          return p;
        }));
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-3 md:p-4">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-4xl w-full h-[88vh] overflow-hidden shadow-2xl flex flex-col">
            
            <div className="p-4 bg-slate-850 border-b border-slate-800 flex items-center justify-between shrink-0">
              <div className="flex items-center space-x-2">
                <span className="text-xl">📦</span>
                <h3 className="font-bold text-sm text-slate-100">Inventory & Pricing (SRP)</h3>
              </div>
              <div className="flex items-center gap-2">
                <button
                  onClick={onOpenAddProduct}
                  className="px-2.5 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-bold flex items-center gap-1 shadow"
                >
                  <span>➕ Add Item</span>
                </button>
                <button onClick={onClose} className="text-slate-400 hover:text-white text-lg">✕</button>
              </div>
            </div>

            <div className="p-3 bg-slate-950 border-b border-slate-800 flex items-center gap-3 shrink-0">
              <input
                type="text"
                value={filter}
                onChange={(e) => setFilter(e.target.value)}
                placeholder="Filter by name, barcode, or PLU..."
                className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-emerald-500"
              />
              <span className="text-xs text-slate-400 font-mono shrink-0">
                {filtered.length} items
              </span>
            </div>

            <div className="flex-1 overflow-y-auto">
              <table className="w-full text-left text-xs border-collapse">
                <thead className="bg-slate-950 text-slate-400 sticky top-0 border-b border-slate-800">
                  <tr>
                    <th className="p-2.5 md:p-3">Product</th>
                    <th className="p-2.5 md:p-3 text-right">SRP Price</th>
                    <th className="p-2.5 md:p-3 text-right">Stock</th>
                    <th className="p-2.5 md:p-3 text-center">Action</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800/80">
                  {filtered.map(p => {
                    const isEditing = editingId === p.id;
                    const isLow = p.stock <= 10;
                    return (
                      <tr key={p.id} className="hover:bg-slate-850/50">
                        <td className="p-2.5 md:p-3 font-medium text-slate-200">
                          <div className="flex items-center">
                            <span className="mr-2 text-base">{p.image}</span>
                            <div>
                              <div className="font-semibold text-xs">{p.name}</div>
                              <div className="text-[10px] text-slate-400 font-mono">{p.category} • {p.barcode.slice(-6)}</div>
                            </div>
                          </div>
                        </td>
                        <td className="p-2.5 md:p-3 text-right font-mono">
                          {isEditing ? (
                            <input
                              type="number"
                              step="0.5"
                              value={editPrice}
                              onChange={(e) => setEditPrice(e.target.value)}
                              className="w-20 bg-slate-950 border border-emerald-500 rounded px-1.5 py-0.5 text-right text-xs text-emerald-400 font-mono"
                            />
                          ) : (
                            <span className="font-bold text-emerald-400">{formatPHP(p.price)}</span>
                          )}
                        </td>
                        <td className="p-2.5 md:p-3 text-right font-mono">
                          {isEditing ? (
                            <input
                              type="number"
                              value={editStock}
                              onChange={(e) => setEditStock(e.target.value)}
                              className="w-16 bg-slate-950 border border-emerald-500 rounded px-1.5 py-0.5 text-right text-xs text-slate-200 font-mono"
                            />
                          ) : (
                            <span className={isLow ? 'text-amber-400 font-bold' : 'text-slate-300'}>
                              {p.stock} {p.unit}
                            </span>
                          )}
                        </td>
                        <td className="p-2.5 md:p-3 text-center space-x-1 whitespace-nowrap">
                          {isEditing ? (
                            <button
                              onClick={() => saveEdit(p.id)}
                              className="px-2 py-1 bg-emerald-600 hover:bg-emerald-500 rounded text-[11px] font-bold text-white"
                            >
                              Save
                            </button>
                          ) : (
                            <>
                              <button
                                onClick={() => startEdit(p)}
                                className="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-[11px]"
                              >
                                Edit
                              </button>
                              <button
                                onClick={() => restockItem(p.id, p.isWeighed ? 20 : 50)}
                                className="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-emerald-400 rounded text-[11px]"
                              >
                                +Stock
                              </button>
                            </>
                          )}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>

            <div className="p-3 bg-slate-850 border-t border-slate-800 flex justify-between items-center shrink-0">
              <span className="text-xs text-slate-400">
                💡 Auto-saved to memory.
              </span>
              <button
                onClick={onClose}
                className="px-4 py-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs font-semibold text-slate-200"
              >
                Close
              </button>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================
    // 📊 SHIFT SALES & BIR Z-REPORT MODAL
    // =========================================================
    function ShiftReportModal({ sales, cashierName, storeInfo, onClose }) {
      const shiftSummary = useMemo(() => {
        let totalRevenue = 0;
        let totalCash = 0;
        let totalGCash = 0;
        let totalMaya = 0;
        let totalCard = 0;
        let totalVat = 0;
        let totalVatExempt = 0;
        let totalDiscounts = 0;

        sales.forEach(sale => {
          totalRevenue += sale.totals.totalDue;
          totalVat += sale.totals.vatAmount;
          totalVatExempt += sale.totals.vatExemptGross;
          totalDiscounts += sale.totals.scDiscount;

          if (sale.payment.method === 'CASH') totalCash += sale.totals.totalDue;
          else if (sale.payment.method === 'GCASH') totalGCash += sale.totals.totalDue;
          else if (sale.payment.method === 'MAYA') totalMaya += sale.totals.totalDue;
          else if (sale.payment.method === 'CARD') totalCard += sale.totals.totalDue;
        });

        return {
          totalOrders: sales.length,
          totalRevenue,
          totalCash,
          totalGCash,
          totalMaya,
          totalCard,
          totalVat,
          totalVatExempt,
          totalDiscounts,
          avgTicket: sales.length ? (totalRevenue / sales.length) : 0
        };
      }, [sales]);

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-3 md:p-4">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-2xl w-full overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
            
            <div className="p-4 bg-slate-850 border-b border-slate-800 flex items-center justify-between shrink-0">
              <div className="flex items-center space-x-2">
                <span className="text-xl">📊</span>
                <div>
                  <h3 className="font-bold text-sm text-slate-100">Shift Sales & Z-Report</h3>
                  <p className="text-xs text-slate-400">Cashier: {cashierName} • {new Date().toLocaleDateString('en-PH')}</p>
                </div>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-white text-lg">✕</button>
            </div>

            <div className="p-4 md:p-5 overflow-y-auto space-y-4">
              <div className="grid grid-cols-3 gap-2 md:gap-3">
                <div className="p-3 md:p-4 bg-slate-950 border border-slate-800 rounded-xl">
                  <span className="text-[11px] md:text-xs text-slate-400">Total Sales:</span>
                  <div className="text-lg md:text-2xl font-bold font-mono text-emerald-400 mt-1">
                    {formatPHP(shiftSummary.totalRevenue)}
                  </div>
                </div>
                <div className="p-3 md:p-4 bg-slate-950 border border-slate-800 rounded-xl">
                  <span className="text-[11px] md:text-xs text-slate-400">Transactions:</span>
                  <div className="text-lg md:text-2xl font-bold font-mono text-slate-100 mt-1">
                    {shiftSummary.totalOrders}
                  </div>
                </div>
                <div className="p-3 md:p-4 bg-slate-950 border border-slate-800 rounded-xl">
                  <span className="text-[11px] md:text-xs text-slate-400">Avg Basket:</span>
                  <div className="text-lg md:text-2xl font-bold font-mono text-slate-100 mt-1">
                    {formatPHP(shiftSummary.avgTicket)}
                  </div>
                </div>
              </div>

              <div className="p-3 md:p-4 bg-slate-950 border border-slate-800 rounded-xl space-y-2">
                <h4 className="font-bold text-xs text-slate-300 uppercase tracking-wider">
                  Collections by Payment Method:
                </h4>
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 pt-1 text-xs">
                  <div className="p-2.5 bg-slate-900 rounded-lg border border-slate-800">
                    <span className="text-slate-400 block">💵 Cash:</span>
                    <span className="font-bold font-mono text-emerald-400">{formatPHP(shiftSummary.totalCash)}</span>
                  </div>
                  <div className="p-2.5 bg-slate-900 rounded-lg border border-slate-800">
                    <span className="text-slate-400 block">📱 GCash:</span>
                    <span className="font-bold font-mono text-blue-400">{formatPHP(shiftSummary.totalGCash)}</span>
                  </div>
                  <div className="p-2.5 bg-slate-900 rounded-lg border border-slate-800">
                    <span className="text-slate-400 block">🟣 Maya:</span>
                    <span className="font-bold font-mono text-emerald-400">{formatPHP(shiftSummary.totalMaya)}</span>
                  </div>
                  <div className="p-2.5 bg-slate-900 rounded-lg border border-slate-800">
                    <span className="text-slate-400 block">💳 Card:</span>
                    <span className="font-bold font-mono text-purple-400">{formatPHP(shiftSummary.totalCard)}</span>
                  </div>
                </div>
              </div>

              <div className="p-3 md:p-4 bg-slate-950 border border-slate-800 rounded-xl space-y-1.5 text-xs">
                <h4 className="font-bold text-xs text-slate-300 uppercase tracking-wider mb-2">
                  BIR Official Sales Reconciliation:
                </h4>
                <div className="flex justify-between text-slate-400">
                  <span>12% VAT Collected:</span>
                  <span className="font-mono text-slate-200">{formatPHP(shiftSummary.totalVat)}</span>
                </div>
                <div className="flex justify-between text-slate-400">
                  <span>VAT-Exempt Fresh Produce:</span>
                  <span className="font-mono text-slate-200">{formatPHP(shiftSummary.totalVatExempt)}</span>
                </div>
                <div className="flex justify-between text-slate-400">
                  <span>Senior Citizen / PWD 5% Discounts:</span>
                  <span className="font-mono text-amber-400">-{formatPHP(shiftSummary.totalDiscounts)}</span>
                </div>
              </div>
            </div>

            <div className="p-4 bg-slate-850 border-t border-slate-800 flex justify-end shrink-0">
              <button
                onClick={onClose}
                className="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs font-semibold text-slate-200"
              >
                Close
              </button>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================
    // ⏸️ PARKED / HELD CARTS MODAL
    // =========================================================
    function ParkedOrdersModal({ orders, onRecall, onDelete, onClose }) {
      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-3 md:p-4">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full overflow-hidden shadow-2xl flex flex-col max-h-[85vh]">
            
            <div className="p-4 bg-slate-850 border-b border-slate-800 flex items-center justify-between shrink-0">
              <div className="flex items-center space-x-2">
                <span className="text-xl">⏸️</span>
                <h3 className="font-bold text-sm text-slate-100">Held / Parked Orders</h3>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-white text-lg">✕</button>
            </div>

            <div className="p-4 flex-1 overflow-y-auto space-y-3">
              {orders.length === 0 ? (
                <div className="text-center py-10 text-slate-500">
                  <span className="text-3xl">🧺</span>
                  <p className="text-xs mt-2">No held orders currently parked.</p>
                </div>
              ) : (
                orders.map(order => {
                  const itemCount = order.cart.reduce((s, it) => s + (it.isWeighed ? 1 : it.qty), 0);
                  const orderTotal = order.cart.reduce((s, it) => s + it.total, 0);

                  return (
                    <div key={order.id} className="p-3 bg-slate-950 border border-slate-800 rounded-xl flex items-center justify-between">
                      <div>
                        <div className="flex items-center gap-2">
                          <span className="font-bold text-xs text-amber-300">{order.note}</span>
                          <span className="text-[10px] text-slate-500 font-mono">{order.timestamp}</span>
                        </div>
                        <p className="text-xs text-slate-400 mt-1">
                          {itemCount} items • <span className="font-mono text-emerald-400 font-bold">{formatPHP(orderTotal)}</span>
                        </p>
                      </div>

                      <div className="flex items-center space-x-2">
                        <button
                          onClick={() => onRecall(order)}
                          className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-bold shadow"
                        >
                          Recall
                        </button>
                        <button
                          onClick={() => onDelete(order.id)}
                          className="text-slate-500 hover:text-red-400 text-sm p-1"
                          title="Remove"
                        >
                          ✕
                        </button>
                      </div>
                    </div>
                  );
                })
              )}
            </div>

            <div className="p-3 bg-slate-850 border-t border-slate-800 flex justify-end shrink-0">
              <button
                onClick={onClose}
                className="px-4 py-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs font-semibold text-slate-200"
              >
                Close
              </button>
            </div>
          </div>
        </div>
      );
    }

    // Render React Application
    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
