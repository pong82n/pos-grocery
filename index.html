    // PWA Install Prompt Listener
    window.deferredPWAInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.deferredPWAInstallPrompt = e;
      window.dispatchEvent(new Event('pwaPromptReady'));
    });

    // Service Worker Registration for Offline Capabilities
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then((reg) => {
          window.swRegistration = reg;
        }).catch((err) => console.log('SW registration skipped:', err));
      });
    }

    // Audio Beep for Barcode Scan
    window.playScanBeep = function() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1760, ctx.currentTime);
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.08);
        if ('vibrate' in navigator) navigator.vibrate(50);
      } catch (e) {}
    };
  </script>

    // Helper: Generate Philippine EAN-13 Barcode
    const generatePhilippineEAN13 = () => {
      const prefix = '480';
      let randomDigits = '';
      for (let i = 0; i < 9; i++) {
        randomDigits += Math.floor(Math.random() * 10).toString();
      }
      const raw12 = prefix + randomDigits;
      let sum = 0;
      for (let i = 0; i < 12; i++) {
        const d = parseInt(raw12[i], 10);
        sum += (i % 2 === 0) ? d : d * 3;
      }
      const checkDigit = (10 - (sum % 10)) % 10;
      return raw12 + checkDigit.toString();
    };

      { id: 'SNA-004', barcode: '480007007004', plu: '', name: 'Nova Country Cheddar Multigrain 78g', category: 'Snacks', unit: 'pc', price: 42.00, cost: 33.50, stock: 115, isWeighed: false, isVatExempt: false, image: '🌽' },
      { id: 'SNA-005', barcode: '480007007005', plu: '', name: 'Chippy Barbecue Flavor 110g', category: 'Snacks', unit: 'pc', price: 38.00, cost: 30.00, stock: 125, isWeighed: false, isVatExempt: false, image: '🌽' },
      { id: 'SNA-006', barcode: '480007007006', plu: '', name: 'Oishi Prawn Crackers Spicy 60g', category: 'Snacks', unit: 'pc', price: 28.00, cost: 22.00, stock: 140, isWeighed: false, isVatExempt: false, image: '🦐' },
      { id: 'SNA-007', barcode: '480007007007', plu: '', name: 'Nagaraya Garlic Cracker Nuts 160g', category: 'Snacks', unit: 'pack', price: 48.00, cost: 38.00, stock: 85, isWeighed: false, isVatExempt: false, image: '🥜' },

      // 🧼 Cleaning & Toiletries
      { id: 'HOU-001', barcode: '480008008001', plu: '', name: 'Surf Blossom Fresh Detergent Powder 2kg', category: 'Household', unit: 'bag', price: 235.00, cost: 195.00, stock: 75, isWeighed: false, isVatExempt: false, image: '🧺' },
      { id: 'HOU-002', barcode: '480008008002', plu: '', name: 'Ariel Sunrise Fresh Detergent Powder 1.9kg', category: 'Household', unit: 'bag', price: 320.00, cost: 265.00, stock: 60, isWeighed: false, isVatExempt: false, image: '🧺' },
      { id: 'HOU-003', barcode: '480008008003', plu: '', name: 'Downy Sunrise Fresh Fabric Conditioner 800ml', category: 'Household', unit: 'pouch', price: 175.00, cost: 142.00, stock: 85, isWeighed: false, isVatExempt: false, image: '🌸' },
      { id: 'HOU-004', barcode: '480008008004', plu: '', name: 'Joy Lemon Dishwashing Liquid 790ml Refill', category: 'Household', unit: 'pouch', price: 145.00, cost: 118.00, stock: 90, isWeighed: false, isVatExempt: false, image: '🍋' },
      { id: 'HOU-005', barcode: '480008008005', plu: '', name: 'Safeguard Pure White Bar Soap 130g', category: 'Household', unit: 'pc', price: 52.00, cost: 41.00, stock: 160, isWeighed: false, isVatExempt: false, image: '🧼' },
      { id: 'HOU-006', barcode: '480008008006', plu: '', name: 'Palmolive Naturals Shampoo 180ml Bottle', category: 'Household', unit: 'bottle', price: 125.00, cost: 98.00, stock: 80, isWeighed: false, isVatExempt: false, image: '🧴' },
      { id: 'HOU-007', barcode: '480008008007', plu: '', name: 'Colgate Triple Action Toothpaste 145g', category: 'Household', unit: 'pc', price: 95.00, cost: 76.00, stock: 110, isWeighed: false, isVatExempt: false, image: '🪥' }
    ];

    const CATEGORIES = [
      { id: 'ALL', label: 'All Items', icon: '🛒' },
      { id: 'Rice & Grains', label: '🌾 Rice', icon: '🌾' },
      { id: 'Fresh Produce', label: '🥬 Produce', icon: '🥬' },
      { id: 'Meat & Seafood', label: '🥩 Meat & Fish', icon: '🥩' },
      { id: 'Canned & Instant', label: '🥫 Canned', icon: '🥫' },
      { id: 'Dairy & Eggs', label: '🥛 Dairy & Eggs', icon: '🥛' },
      { id: 'Cooking & Condiments', label: '🧂 Cooking', icon: '🧂' },
      { id: 'Beverages', label: '🥤 Drinks', icon: '🥤' },
      { id: 'Snacks', label: '🍪 Snacks', icon: '🍪' },
      { id: 'Household', label: '🧼 Cleaning', icon: '🧼' }
    ];

    // Main POS App Component
    function App() {
      // Products & Inventory State
      const [products, setProducts] = useState(() => {
        const saved = localStorage.getItem('cha_pos_products');
        return saved ? JSON.parse(saved) : INITIAL_PRODUCTS;
      });

      // Active Cart State
      const [cart, setCart] = useState(() => {
        const saved = localStorage.getItem('cha_pos_cart');
        return saved ? JSON.parse(saved) : [];
      });

      // Parked / Held Carts
      const [parkedOrders, setParkedOrders] = useState(() => {
        const saved = localStorage.getItem('cha_pos_parked');
        return saved ? JSON.parse(saved) : [];
      });

      // Completed Sales Orders History
      const [completedSales, setCompletedSales] = useState(() => {
        const saved = localStorage.getItem('cha_pos_sales');
        return saved ? JSON.parse(saved) : [];
      });

      // Cashiers Management State
      const [cashiers, setCashiers] = useState(() => {
        const saved = localStorage.getItem('cha_pos_cashiers');
        return saved ? JSON.parse(saved) : INITIAL_CASHIERS;
      });

      // Current Logged-in Cashier
      const [currentCashier, setCurrentCashier] = useState(() => {
        const saved = localStorage.getItem('cha_pos_active_cashier');
        return saved ? JSON.parse(saved) : INITIAL_CASHIERS[0];
      });

      // Printer Settings State
      const [printerSettings, setPrinterSettings] = useState(() => {
        const saved = localStorage.getItem('cha_pos_printer_config');
        return saved ? JSON.parse(saved) : INITIAL_PRINTER_CONFIG;
      });

      // 🏛️ Tariff & BIR Tax Settings State
      const [tariffSettings, setTariffSettings] = useState(() => {
        const saved = localStorage.getItem('cha_pos_tariff_settings');
        return saved ? JSON.parse(saved) : {
          vatRate: 12.0, // Standard Philippine BIR VAT %
          scPwdDiscountRate: 5.0, // RA 9994 5% BNPC Discount
          ecoBagFee: 2.00, // City ordinance plastic bag fee
          customTariffRate: 0.0, // Custom duty / excise surcharge %
          enableCustomTariff: false,
          tinNumber: '248-912-345-00000 VAT Reg',
          minNumber: 'MIN-202610-8899124'
        };
      });

      // Store Details
      const [storeInfo, setStoreInfo] = useState({
        name: 'CHA CONVENIENCE STORE',
        branch: 'Bankers Subd. Antipolo City, Rizal',
        tin: '248-912-345-00000 VAT Reg',
        min: 'MIN-202610-8899124',
        serial: 'SN-CHA-PH-99421',
        tel: '(02) 8921-4455 / 0917-882-9090'
      });

      // Search & Category Filters
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('ALL');

      // Customer Type & Senior Citizen / PWD RA 9994 5% Discount
      const [customerType, setCustomerType] = useState('REGULAR');
      const [seniorId, setSeniorId] = useState('');
      const [seniorName, setSeniorName] = useState('');
      const [includeEcoBag, setIncludeEcoBag] = useState(false);

      // Mobile View State ('catalog', 'cart', 'more')
      const [mobileTab, setMobileTab] = useState('catalog');

      // Modals
      const [scaleModalItem, setScaleModalItem] = useState(null);
      const [isCheckoutOpen, setIsCheckoutOpen] = useState(false);
      const [lastReceipt, setLastReceipt] = useState(null);
      const [isInventoryOpen, setIsInventoryOpen] = useState(false);
      const [isShiftModalOpen, setIsShiftModalOpen] = useState(false);
      const [isParkedModalOpen, setIsParkedModalOpen] = useState(false);
      const [isAddProductOpen, setIsAddProductOpen] = useState(false);
      const [isCashierModalOpen, setIsCashierModalOpen] = useState(false);
      const [isMobileQROpen, setIsMobileQROpen] = useState(false);
      const [isPrinterListOpen, setIsPrinterListOpen] = useState(false); // 🖨️ Printer list modal
      const [isTariffModalOpen, setIsTariffModalOpen] = useState(false); // 🏛️ Tariff & BIR Tax rates modal
      const [editingCartItem, setEditingCartItem] = useState(null); // 🏷️ Price & Tariff editor in active cart
      const [isMobileMoreOpen, setIsMobileMoreOpen] = useState(false); // ⚙️ Mobile quick menu
      const [isLocked, setIsLocked] = useState(false);
      const [isCameraScannerOpen, setIsCameraScannerOpen] = useState(false);

      const searchInputRef = useRef(null);

      // Save states to LocalStorage
      useEffect(() => {
        localStorage.setItem('cha_pos_products', JSON.stringify(products));
      }, [products]);

      useEffect(() => {
        localStorage.setItem('cha_pos_cart', JSON.stringify(cart));
      }, [cart]);

      useEffect(() => {
        localStorage.setItem('cha_pos_parked', JSON.stringify(parkedOrders));
      }, [parkedOrders]);

      useEffect(() => {
        localStorage.setItem('cha_pos_sales', JSON.stringify(completedSales));
      }, [completedSales]);

      useEffect(() => {
        localStorage.setItem('cha_pos_cashiers', JSON.stringify(cashiers));
      }, [cashiers]);

      useEffect(() => {
        localStorage.setItem('cha_pos_active_cashier', JSON.stringify(currentCashier));
      }, [currentCashier]);

      useEffect(() => {
        localStorage.setItem('cha_pos_printer_config', JSON.stringify(printerSettings));
      }, [printerSettings]);

      useEffect(() => {
        localStorage.setItem('cha_pos_tariff_settings', JSON.stringify(tariffSettings));
      }, [tariffSettings]);

      // Global Keyboard Shortcuts
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (isLocked) return;
          if (isCheckoutOpen || scaleModalItem || isInventoryOpen || isShiftModalOpen || isParkedModalOpen || isAddProductOpen || isCashierModalOpen || isMobileQROpen || isCameraScannerOpen || isPrinterListOpen || isMobileMoreOpen || isTariffModalOpen || editingCartItem) {
            if (e.key === 'Escape') {
              setIsCheckoutOpen(false);
              setScaleModalItem(null);
              setIsInventoryOpen(false);
              setIsShiftModalOpen(false);
              setIsParkedModalOpen(false);
              setIsAddProductOpen(false);
              setIsCashierModalOpen(false);
              setIsMobileQROpen(false);
              setIsCameraScannerOpen(false);
              setIsPrinterListOpen(false);
              setIsMobileMoreOpen(false);
              setIsTariffModalOpen(false);
              setEditingCartItem(null);
            }
            return;
          }

          if (e.key === 'F2') {
            e.preventDefault();
            searchInputRef.current?.focus();
          } else if (e.key === 'F3') {
            e.preventDefault();
            setIsAddProductOpen(true);
          } else if (e.key === 'F4') {
            e.preventDefault();
            setIsParkedModalOpen(true);
          } else if (e.key === 'F7') {
            e.preventDefault();
            setIsPrinterListOpen(true);
          } else if (e.key === 'F8') {
            e.preventDefault();
            setIsInventoryOpen(true);
          } else if (e.key === 'F9') {
            e.preventDefault();
            setIsShiftModalOpen(true);
          } else if (e.key === 'F12' && cart.length > 0) {
            e.preventDefault();
            setIsCheckoutOpen(true);
          }
        };

        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [cart, isLocked, isCheckoutOpen, scaleModalItem, isInventoryOpen, isShiftModalOpen, isParkedModalOpen, isAddProductOpen, isCashierModalOpen, isMobileQROpen, isCameraScannerOpen, isPrinterListOpen, isMobileMoreOpen]);

      // Filtered Product Catalog
      const filteredProducts = useMemo(() => {
        return products.filter(p => {
          const matchCat = selectedCategory === 'ALL' || p.category === selectedCategory;
          const query = searchQuery.trim().toLowerCase();
          const matchSearch = !query ||
            p.name.toLowerCase().includes(query) ||
            p.barcode.includes(query) ||
            (p.plu && p.plu.includes(query)) ||
            p.category.toLowerCase().includes(query);
          return matchCat && matchSearch;
        });
      }, [products, selectedCategory, searchQuery]);

      // Add Product to Cart
      const handleProductClick = (product) => {
        if (product.stock <= 0) {
          alert(`Sorry, "${product.name}" is currently out of stock.`);
          return;
        }

        if (product.isWeighed) {
          setScaleModalItem(product);
          return;
        }

        setCart(prev => {
          const existing = prev.find(item => item.id === product.id);
          if (existing) {
            return prev.map(item =>
              item.id === product.id
                ? { ...item, qty: item.qty + 1, total: (item.qty + 1) * item.price }
                : item
            );
          }
          return [...prev, {
            ...product,
            qty: 1,
            total: product.price
          }];
        });
      };

      // Add Weighed Item from Scale Modal
      const handleAddWeighedItem = (product, weightInKg) => {
        if (weightInKg <= 0) return;
        setCart(prev => {
          const existingIndex = prev.findIndex(item => item.id === product.id && item.unit === 'kg');
          if (existingIndex >= 0) {
            const updated = [...prev];
            const newQty = Number((updated[existingIndex].qty + weightInKg).toFixed(3));
            updated[existingIndex] = {
              ...updated[existingIndex],
              qty: newQty,
              total: Number((newQty * product.price).toFixed(2))
            };
            return updated;
          }
          return [...prev, {
            ...product,
            qty: Number(weightInKg.toFixed(3)),
            total: Number((weightInKg * product.price).toFixed(2))
          }];
        });
        setScaleModalItem(null);
      };

      // Handle Camera Scan Result
      const handleCameraScanSuccess = (scannedBarcode) => {
        window.playScanBeep();
        const found = products.find(p => p.barcode === scannedBarcode || p.plu === scannedBarcode);
        if (found) {
          handleProductClick(found);
          setIsCameraScannerOpen(false);
        } else {
          alert(`Scanned barcode: ${scannedBarcode}\nNo matching product found in catalog. You can add it using "+ Add Item"!`);
        }
      };

      // Update Cart Item Quantity
      const updateCartQty = (id, newQty) => {
        if (newQty <= 0) {
          removeFromCart(id);
          return;
        }
        setCart(prev => prev.map(item => {
          if (item.id === id) {
            const roundedQty = item.isWeighed ? Number(newQty.toFixed(3)) : Math.round(newQty);
            return {
              ...item,
              qty: roundedQty,
              total: Number((roundedQty * item.price).toFixed(2))
            };
          }
          return item;
        }));
      };

      const removeFromCart = (id) => {
        setCart(prev => prev.filter(item => item.id !== id));
      };

      const clearCart = () => {
        if (cart.length === 0) return;
        if (confirm('Are you sure you want to clear the current cart?')) {
          setCart([]);
          setCustomerType('REGULAR');
          setSeniorId('');
          setSeniorName('');
          setIncludeEcoBag(false);
        }
      };

      // 🏷️ Save Cart Item Price & Tariff Adjustments
      const handleSaveCartItemEdit = ({ itemId, newPrice, newQty, tariffCategory, tariffRate, updateCatalog }) => {
        setCart(prev => prev.map(item => {
          if (item.id === itemId) {
            const updatedPrice = parseFloat(newPrice) || item.price;
            const updatedQty = parseFloat(newQty) || item.qty;
            const isExempt = tariffCategory === 'EXEMPT';
            return {
              ...item,
              price: updatedPrice,
              qty: updatedQty,
              total: Number((updatedPrice * updatedQty).toFixed(2)),
              tariffCategory,
              tariffRate: tariffRate !== undefined ? parseFloat(tariffRate) : item.tariffRate,
              isVatExempt: isExempt
            };
          }
          return item;
        }));

        if (updateCatalog) {
          setProducts(prev => prev.map(p => {
            if (p.id === itemId) {
              const isExempt = tariffCategory === 'EXEMPT';
              return {
                ...p,
                price: parseFloat(newPrice) || p.price,
                tariffCategory,
                tariffRate: tariffRate !== undefined ? parseFloat(tariffRate) : p.tariffRate,
                isVatExempt: isExempt
              };
            }
            return p;
          }));
        }

        setEditingCartItem(null);
      };

      // Hold / Park Order
      const parkCurrentCart = () => {
        if (cart.length === 0) return;
        const customerNote = prompt('Enter Customer Name or Cart Label (e.g. Cart #3, Lady in Blue Jacket):', `Customer #${parkedOrders.length + 1}`);
        if (!customerNote) return;

        const newParked = {
          id: 'PARK-' + Date.now(),
          timestamp: new Date().toLocaleTimeString('en-PH'),
          note: customerNote,
          cart: [...cart],
          customerType,
          seniorId,
          seniorName,
          includeEcoBag
        };

        setParkedOrders(prev => [newParked, ...prev]);
        setCart([]);
        setCustomerType('REGULAR');
        setSeniorId('');
        setSeniorName('');
        setIncludeEcoBag(false);
      };

      // Recall Parked Order
      const recallParkedOrder = (parked) => {
        if (cart.length > 0) {
          if (!confirm('The current cart has items. Do you want to replace it with this held order? Click OK to proceed.')) {
            return;
          }
        }
        setCart(parked.cart);
        setCustomerType(parked.customerType);
        setSeniorId(parked.seniorId || '');
        setSeniorName(parked.seniorName || '');
        setIncludeEcoBag(parked.includeEcoBag || false);
        setParkedOrders(prev => prev.filter(p => p.id !== parked.id));
        setIsParkedModalOpen(false);
        setMobileTab('cart');
      };

      // BIR VAT & Philippine Tax / Tariff Calculations
      const totals = useMemo(() => {
        let grossSubtotal = 0;
        let vatExemptGross = 0;
        let vatableGross = 0;
        let customTariffGross = 0;
        let customTariffAmount = 0;

        const effectiveVatRate = (tariffSettings.vatRate !== undefined ? tariffSettings.vatRate : 12.0) / 100;
        const vatMultiplier = 1 + effectiveVatRate;

        cart.forEach(item => {
          grossSubtotal += item.total;
          const isExempt = item.isVatExempt || item.tariffCategory === 'EXEMPT' || item.tariffRate === 0;
          const isCustom = item.tariffCategory === 'CUSTOM';

          if (isExempt) {
            vatExemptGross += item.total;
          } else if (isCustom) {
            customTariffGross += item.total;
            const rate = ((item.tariffRate !== undefined ? item.tariffRate : tariffSettings.customTariffRate) || 0) / 100;
            const net = rate > 0 ? item.total / (1 + rate) : item.total;
            customTariffAmount += (item.total - net);
          } else {
            vatableGross += item.total;
          }
        });

        const vatableNet = effectiveVatRate > 0 ? Number((vatableGross / vatMultiplier).toFixed(2)) : vatableGross;
        const vatAmount = Number((vatableGross - vatableNet).toFixed(2));

        let scDiscount = 0;
        const scRate = (tariffSettings.scPwdDiscountRate !== undefined ? tariffSettings.scPwdDiscountRate : 5.0) / 100;
        if (customerType === 'SENIOR' || customerType === 'PWD') {
          scDiscount = Number((grossSubtotal * scRate).toFixed(2));
        }

        const bagFee = includeEcoBag ? (tariffSettings.ecoBagFee !== undefined ? tariffSettings.ecoBagFee : 2.00) : 0.00;
        const totalDue = Number((grossSubtotal - scDiscount + bagFee).toFixed(2));

        return {
          grossSubtotal,
          vatExemptGross,
          vatableGross,
          vatableNet,
          vatAmount,
          customTariffGross,
          customTariffAmount: Number(customTariffAmount.toFixed(2)),
          effectiveVatRate: tariffSettings.vatRate !== undefined ? tariffSettings.vatRate : 12.0,
          scDiscount,
          bagFee,
          totalDue
        };
      }, [cart, customerType, includeEcoBag, tariffSettings]);

      // Complete Checkout & Update Inventory
      const handleCompleteTransaction = (paymentData) => {
        const orderNumber = 'OR-' + Math.floor(100000 + Math.random() * 900000);
        const transactionRecord = {
          orderNumber,
          date: new Date().toLocaleDateString('en-PH'),
          time: new Date().toLocaleTimeString('en-PH'),
          cashier: currentCashier ? currentCashier.name : 'Cashier',
          cashierId: currentCashier ? currentCashier.id : 'CSH-001',
          customerType,
          seniorId,
          seniorName,
          items: [...cart],
          totals: { ...totals },
          payment: paymentData,
          storeInfo: { ...storeInfo }
        };

        // Deduct inventory stock
        setProducts(prev => prev.map(p => {
          const bought = cart.find(c => c.id === p.id);
          if (bought) {
            return {
              ...p,
              stock: Number(Math.max(0, p.stock - bought.qty).toFixed(3))
            };
          }
          return p;
        }));

        setCompletedSales(prev => [transactionRecord, ...prev]);
        setLastReceipt(transactionRecord);
        setIsCheckoutOpen(false);

        // Reset Cart
        setCart([]);
        setCustomerType('REGULAR');
        setSeniorId('');
        setSeniorName('');
        setIncludeEcoBag(false);

        // Auto print if enabled
        if (printerSettings.autoPrintOnCheckout) {
          setTimeout(() => {
            window.print();
          }, 400);
        }
      };

      const handleSaveNewProduct = (newProduct) => {
        setProducts(prev => [newProduct, ...prev]);
        setIsAddProductOpen(false);
      };

      const handleLogout = () => {
        setIsLocked(true);
      };

      const handleLogin = (cashier) => {
        setCurrentCashier(cashier);
        setIsLocked(false);
      };

      const cartItemCount = cart.reduce((sum, item) => sum + (item.isWeighed ? 1 : item.qty), 0);

      const activePrinter = useMemo(() => {
        return printerSettings.savedPrinters.find(p => p.id === printerSettings.activePrinterId) || printerSettings.savedPrinters[0];
      }, [printerSettings]);

      return (
        <div className="flex flex-col h-[100dvh] w-screen max-w-full overflow-hidden bg-slate-950 text-slate-100 select-none">
          
          {/* Top POS Navigation Bar (Compact & Fitted for Mobile) */}
          <header className="h-13 md:h-14 border-b border-slate-800 bg-slate-900 px-2.5 md:px-4 flex items-center justify-between z-20 shrink-0">
            <div className="flex items-center space-x-2">
              <div className="w-8 h-8 md:w-9 md:h-9 rounded-xl bg-gradient-to-br from-emerald-600 to-teal-800 flex items-center justify-center shadow-lg shadow-emerald-950/40 border border-emerald-500/30 shrink-0">
                <span className="text-lg md:text-xl">🏪</span>
              </div>
              <div className="truncate max-w-[130px] sm:max-w-xs md:max-w-md">
                <h1 className="font-bold text-xs md:text-sm tracking-wide text-emerald-400 flex items-center gap-1 truncate">
                  <span className="truncate">CHA STORE</span>
                  <span className="text-[9px] uppercase font-bold tracking-widest px-1 py-0.2 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 shrink-0">
                    ₱
                  </span>
                </h1>
                <p className="text-[9px] md:text-[11px] text-slate-400 font-mono truncate">
                  Bankers Subd. Antipolo
                </p>
              </div>
            </div>

            {/* Quick Action Navigation Buttons */}
            <div className="flex items-center space-x-1 sm:space-x-1.5 md:space-x-2">
              
              {/* 🖨️ AVAILABLE PRINTERS LIST BUTTON */}
              <button
                onClick={() => setIsPrinterListOpen(true)}
                className="px-2 py-1.5 md:px-2.5 rounded-lg border border-teal-600/70 bg-teal-950/50 hover:bg-teal-900/70 text-teal-300 text-xs font-semibold flex items-center gap-1 transition shrink-0"
                title="Available Printers List & Settings"
              >
                <span>🖨️</span>
                <span className="hidden sm:inline">Printers</span>
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse ml-0.5"></span>
              </button>

              {/* 📷 Camera Scanner Button */}
              <button
                onClick={() => setIsCameraScannerOpen(true)}
                className="px-2 py-1.5 md:px-2.5 rounded-lg border border-purple-600/70 bg-purple-950/50 hover:bg-purple-900/70 text-purple-300 text-xs font-semibold flex items-center gap-1 transition shrink-0"
                title="Camera Barcode Scanner"
              >
                <span>📷</span>
                <span className="hidden md:inline">Scan</span>

    // =========================================================
    // 🖨️ PRINTER LIST & THERMAL HARDWARE SETTINGS MODAL
    // =========================================================
    function PrinterListModal({ config, setConfig, onClose }) {
      const [isScanningBt, setIsScanningBt] = useState(false);
      const [statusNotice, setStatusNotice] = useState('');

      // Scan for nearby Bluetooth ESC/POS Thermal Printers
      const handleScanBluetoothPrinters = async () => {
        if (!navigator.bluetooth) {
          alert('Web Bluetooth is supported on Google Chrome (Android & PC/Mac) and WebBLE browsers on iOS. Please ensure Bluetooth is enabled.');
          return;
        }

        setIsScanningBt(true);
        setStatusNotice('Scanning for Bluetooth ESC/POS printers...');
        try {
          const device = await navigator.bluetooth.requestDevice({
            acceptAllDevices: true,
            optionalServices: [
              '000018f0-0000-1000-8000-00805f9b34fb',
              'e7810a71-73ae-499d-8c15-faa9aef0c3f2',
              '49535343-fe7d-4ae5-8fa9-9fafd205e455'
            ]
          });

          if (device) {
            const newPrinter = {
              id: 'bt-' + Date.now(),
              name: device.name || 'Bluetooth Thermal POS',
              type: 'bluetooth',
              status: 'ready',
              paper: config.paperSize
            };

            setConfig(prev => ({
              ...prev,
              activePrinterId: newPrinter.id,
              savedPrinters: [newPrinter, ...prev.savedPrinters]
            }));

            setStatusNotice(`Successfully paired with: ${newPrinter.name}`);
          }
        } catch (err) {
          console.log('Bluetooth scan cancelled or error:', err);
          setStatusNotice('Bluetooth pairing cancelled or unavailable.');
        } finally {
          setIsScanningBt(false);
        }
      };

      // Detect USB Thermal POS Printer
      const handleDetectUSBPrinters = async () => {
        if (!navigator.usb) {
          alert('WebUSB is supported in Chromium-based browsers (Chrome, Edge). Plug your USB thermal printer and grant permission.');
          return;
        }

        try {
          const device = await navigator.usb.requestDevice({ filters: [] });
          if (device) {
            const newPrinter = {
              id: 'usb-' + Date.now(),
              name: device.productName || 'USB Thermal POS Printer',
              type: 'usb',
              status: 'ready',
              paper: config.paperSize
            };

            setConfig(prev => ({
              ...prev,
              activePrinterId: newPrinter.id,
              savedPrinters: [newPrinter, ...prev.savedPrinters]
            }));

            setStatusNotice(`Connected to USB Printer: ${newPrinter.name}`);
          }
        } catch (err) {
          console.log(err);
        }
      };

      // Test Print
      const handleTestPrint = () => {
        window.print();
      };

      const setPaper = (size) => {
        setConfig(prev => ({ ...prev, paperSize: size }));
      };

      const selectPrinter = (id) => {
        setConfig(prev => ({ ...prev, activePrinterId: id }));
      };

      const removePrinter = (id) => {
        if (id === 'system-default') return;
        setConfig(prev => ({
          ...prev,
          activePrinterId: prev.activePrinterId === id ? 'system-default' : prev.activePrinterId,
          savedPrinters: prev.savedPrinters.filter(p => p.id !== id)
        }));
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-3 md:p-4">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full max-h-[92dvh] overflow-hidden shadow-2xl flex flex-col">
            
            {/* Header */}
            <div className="p-4 bg-slate-850 border-b border-slate-800 flex items-center justify-between shrink-0">
              <div className="flex items-center space-x-2">
                <span className="text-xl">🖨️</span>
                <div>
                  <h3 className="font-bold text-sm text-slate-100">Available Printers & Setup</h3>
                  <p className="text-[11px] text-slate-400">Bluetooth, USB & System Receipt Printers</p>
                </div>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-white text-lg">✕</button>
            </div>

            <div className="p-4 md:p-5 flex-1 overflow-y-auto space-y-4">
              
              {/* Paper Roll Width Setting */}
              <div className="p-3 bg-slate-950 border border-slate-800 rounded-xl space-y-2">
                <div className="flex justify-between items-center">
                  <span className="text-xs font-semibold text-slate-300 uppercase tracking-wider">
                    Thermal Paper Roll Width:
                  </span>
                  <span className="text-xs font-mono font-bold text-emerald-400">
                    {config.paperSize}
                  </span>
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <button
                    onClick={() => setPaper('80mm')}
                    className={`py-2 px-3 rounded-lg border text-xs font-semibold flex items-center justify-center gap-1.5 transition ${
                      config.paperSize === '80mm'
                        ? 'bg-emerald-950/60 border-emerald-500 text-emerald-300 shadow'
                        : 'bg-slate-900 border-slate-800 text-slate-400 hover:text-slate-200'
                    }`}
                  >
                    <span>📜 80mm Standard Roll</span>
                  </button>
                  <button
                    onClick={() => setPaper('58mm')}
                    className={`py-2 px-3 rounded-lg border text-xs font-semibold flex items-center justify-center gap-1.5 transition ${
                      config.paperSize === '58mm'
                        ? 'bg-emerald-950/60 border-emerald-500 text-emerald-300 shadow'
                        : 'bg-slate-900 border-slate-800 text-slate-400 hover:text-slate-200'
                    }`}
                  >
                    <span>🧾 58mm Mini Mobile</span>
                  </button>
                </div>
              </div>

              {/* Discovery Action Buttons */}
              <div className="grid grid-cols-2 gap-2">
                <button
                  onClick={handleScanBluetoothPrinters}
                  disabled={isScanningBt}
                  className="py-2.5 px-3 bg-blue-950/60 hover:bg-blue-900/70 border border-blue-600/60 text-blue-300 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 transition active:scale-95"
                >
                  <span>📶</span>
                  <span>{isScanningBt ? 'Scanning...' : 'Pair Bluetooth Printer'}</span>
                </button>

                <button
                  onClick={handleDetectUSBPrinters}
                  className="py-2.5 px-3 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 transition active:scale-95"
                >
                  <span>🔌</span>
                  <span>Connect USB Printer</span>
                </button>
              </div>

              {statusNotice && (
                <div className="p-2.5 bg-emerald-950/40 border border-emerald-600/40 rounded-lg text-emerald-300 text-xs text-center font-mono">
                  {statusNotice}
                </div>
              )}

              {/* Available Printers List */}
              <div className="space-y-2">
                <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider block">
                  Available Printers List ({config.savedPrinters.length}):
                </span>

                <div className="space-y-2">
                  {config.savedPrinters.map(printer => {
                    const isActive = config.activePrinterId === printer.id;
                    return (
                      <div
                        key={printer.id}
                        onClick={() => selectPrinter(printer.id)}
                        className={`p-3 rounded-xl border flex items-center justify-between cursor-pointer transition ${
                          isActive
                            ? 'bg-emerald-950/40 border-emerald-500/70 shadow-md ring-1 ring-emerald-500/50'
                            : 'bg-slate-950 border-slate-800 hover:border-slate-700'
                        }`}
                      >
                        <div className="flex items-center space-x-3">
                          <div className={`w-9 h-9 rounded-xl flex items-center justify-center text-lg ${
                            isActive ? 'bg-emerald-600/30 text-emerald-400' : 'bg-slate-800 text-slate-400'
                          }`}>
                            {printer.type === 'bluetooth' ? '📶' : printer.type === 'usb' ? '🔌' : '🖨️'}
                          </div>
                          <div>
                            <div className="flex items-center gap-2">
                              <span className="font-bold text-xs text-slate-100">{printer.name}</span>
                              {isActive && (
                                <span className="text-[9px] px-1.5 py-0.2 rounded bg-emerald-500/20 text-emerald-300 font-bold border border-emerald-500/30">
                                  Default
                                </span>
                              )}
                            </div>
                            <p className="text-[10px] text-slate-400 font-mono">
                              Type: {printer.type.toUpperCase()} • Width: {config.paperSize} • Status: {printer.status}
                            </p>
                          </div>
                        </div>

                        <div className="flex items-center space-x-2">
                          <div className={`w-3 h-3 rounded-full border-2 ${
                            isActive ? 'bg-emerald-400 border-emerald-300' : 'bg-transparent border-slate-600'
                          }`} />
                          {printer.id !== 'system-default' && (
                            <button
                              onClick={(e) => { e.stopPropagation(); removePrinter(printer.id); }}
                              className="text-slate-500 hover:text-red-400 text-xs p-1"
                              title="Remove printer"
                            >
                              ✕
                            </button>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* Auto Print Toggle & Test Print */}
              <div className="p-3 bg-slate-950 border border-slate-800 rounded-xl space-y-3">
                <label className="flex items-center justify-between cursor-pointer">
                  <div>
                    <span className="text-xs font-semibold text-slate-200 block">Auto-Print on Checkout</span>
                    <span className="text-[10px] text-slate-400">Opens thermal print prompt immediately upon payment</span>
                  </div>
                  <input
                    type="checkbox"
                    checked={config.autoPrintOnCheckout}
                    onChange={(e) => setConfig(prev => ({ ...prev, autoPrintOnCheckout: e.target.checked }))}
                    className="w-4 h-4 rounded text-emerald-600 focus:ring-emerald-500 bg-slate-800 border-slate-700"
                  />
                </label>

                <div className="pt-2 border-t border-slate-800/80 flex items-center justify-between">
                  <span className="text-xs text-slate-400">Verify thermal alignment:</span>
                  <button
                    onClick={handleTestPrint}
                    className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-emerald-400 rounded-lg text-xs font-bold flex items-center gap-1 shadow"
                  >
                    <span>🖨️</span>
                    <span>Test Print Receipt</span>
                  </button>
                </div>
              </div>
            </div>

            {/* Footer */}
            <div className="p-3 bg-slate-850 border-t border-slate-800 flex justify-end shrink-0">
              <button
                onClick={onClose}
                className="px-5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold shadow"

          </div>
        </div>
      );

    // =========================================================
    // 📷 LIVE MOBILE CAMERA BARCODE SCANNER COMPONENT
    // =========================================================
    function CameraScannerModal({ onClose, onScanSuccess }) {
      const [cameraError, setCameraError] = useState('');

      useEffect(() => {
        let html5QrCode = null;
        try {
          html5QrCode = new Html5Qrcode("reader");
          const config = {
            fps: 10,
            qrbox: { width: 250, height: 160 },
            aspectRatio: 1.0
          };

          html5QrCode.start(
            { facingMode: "environment" },
            config,
            (decodedText) => {
              if (decodedText) {
                html5QrCode.stop().then(() => {
                  onScanSuccess(decodedText);
                }).catch(() => {
                  onScanSuccess(decodedText);
                });
              }
            },
            (errorMessage) => {}
          ).catch((err) => {
            console.error(err);
            setCameraError('Unable to access device camera. Please ensure camera permissions are allowed in your browser.');
          });
        } catch (e) {
          setCameraError('Camera scanner failed to initialize.');
        }

        return () => {
          if (html5QrCode && html5QrCode.isScanning) {
            html5QrCode.stop().catch(() => {});
          }
        };
      }, []);

      return (
        <div className="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex items-center justify-center p-3">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-sm w-full overflow-hidden shadow-2xl flex flex-col">
            <div className="p-4 bg-slate-850 border-b border-slate-800 flex items-center justify-between shrink-0">
              <div className="flex items-center space-x-2">
                <span className="text-xl">📷</span>
                <div>
                  <h3 className="font-bold text-sm text-slate-100">Camera Barcode Scanner</h3>
                  <p className="text-[11px] text-slate-400">Aim camera at grocery barcode</p>
                </div>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-white text-lg">✕</button>
            </div>

            <div className="p-4 flex flex-col items-center">
              {cameraError ? (
                <div className="p-4 bg-rose-950/40 border border-rose-600/50 rounded-xl text-rose-300 text-xs text-center">
                  <p className="font-semibold">{cameraError}</p>
                </div>
              ) : (
                <div className="w-full flex flex-col items-center">

    function CashierManagementModal({ cashiers, currentCashier, setCashiers, setCurrentCashier, onClose }) {
      const [newName, setNewName] = useState('');
      const [newRole, setNewRole] = useState('Cashier');
      const [newPin, setNewPin] = useState('1234');

      const handleAddCashier = (e) => {
        e.preventDefault();
        if (!newName.trim()) return;

        const newCashier = {
          id: 'CSH-00' + (cashiers.length + 1),
          name: newName.trim(),
          role: newRole,
          pin: newPin.trim() || '0000',
          active: true
        };

        setCashiers(prev => [...prev, newCashier]);
        setNewName('');
        setNewPin('1234');
      };

      const handleRemoveCashier = (id) => {
        if (currentCashier && currentCashier.id === id) {
          alert('Cannot delete the currently active cashier! Please switch cashiers first.');
          return;
        }
        if (cashiers.length <= 1) {
          alert('At least one cashier must remain.');
          return;
        }
        if (confirm('Are you sure you want to remove this cashier?')) {
          setCashiers(prev => prev.filter(c => c.id !== id));
        }
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-3 md:p-4">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full max-h-[88dvh] overflow-hidden shadow-2xl flex flex-col">
            
            <div className="p-4 bg-slate-850 border-b border-slate-800 flex items-center justify-between shrink-0">
              <div className="flex items-center space-x-2">
                <span className="text-xl">👥</span>
                <h3 className="font-bold text-sm text-slate-100">Cashier List Management</h3>
              </div>

            </div>

            <div className="p-4 flex-1 overflow-y-auto space-y-4">
              <div className="space-y-2">
                <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider block">
                  Registered Cashiers ({cashiers.length}):
                </span>
                {cashiers.map(c => {
                  const isActive = currentCashier && currentCashier.id === c.id;
                  return (
                    <div
                      key={c.id}
                      className={`p-3 rounded-xl border flex items-center justify-between ${
                        isActive ? 'bg-emerald-950/40 border-emerald-500/50' : 'bg-slate-950 border-slate-800'
                      }`}
                    >
                      <div className="flex items-center space-x-3">
                        <div className="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center text-sm font-bold text-slate-200">
                          {c.name.charAt(0)}
                        </div>
                        <div>
                          <div className="flex items-center gap-2">
                            <span className="font-semibold text-xs text-slate-200">{c.name}</span>
                            {isActive && (
                              <span className="text-[9px] px-1.5 py-0.2 rounded bg-emerald-500/20 text-emerald-300 font-bold border border-emerald-500/30">
                                Active Now
                              </span>
                            )}
                          </div>
                          <p className="text-[11px] text-slate-400 font-mono">
                            {c.role} • PIN: **** • {c.id}
                          </p>
                        </div>
                      </div>

                      <div className="flex items-center space-x-2">
                        {!isActive && (
                          <button
                            onClick={() => setCurrentCashier(c)}
                            className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-emerald-400 rounded-lg border border-slate-700"
                          >
                            Switch
                          </button>
                        )}
                        <button
                          onClick={() => handleRemoveCashier(c.id)}

                          ✕
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>

              <form onSubmit={handleAddCashier} className="p-3 bg-slate-950 border border-slate-800 rounded-xl space-y-3">

                <div className="grid grid-cols-2 gap-2">
                  <input
                    type="text"
                    value={newName}
                    onChange={(e) => setNewName(e.target.value)}

                    className="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-emerald-500"
                    required

                    value={newRole}
                    onChange={(e) => setNewRole(e.target.value)}

                <div className="flex gap-2">
                  <input
                    type="password"

    // =========================================================
    // 📱 MOBILE APP POS INSTALL THROUGH QR CODE MODAL
    // =========================================================
    function MobileInstallModal({ onClose }) {
      const qrContainerRef = useRef(null);
      const [customUrl, setCustomUrl] = useState(() => {
        return window.location.protocol === 'file:' 
          ? window.POS_PUBLIC_ONLINE_URL 
          : window.location.href.split('#')[0];
      });
      const [copied, setCopied] = useState(false);
      const [activePlatformTab, setActivePlatformTab] = useState('android'); // 'android' | 'ios'

      useEffect(() => {
        if (qrContainerRef.current) {
          qrContainerRef.current.innerHTML = '';
          try {
            new QRCode(qrContainerRef.current, {
              text: customUrl,
              width: 200,
              height: 200,
              colorDark: '#064e3b',
              colorLight: '#ffffff',
              correctLevel: QRCode.CorrectLevel.H
            });
          } catch (e) {
            console.error(e);
          }
        }
      }, [customUrl]);

      const handleCopy = () => {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(customUrl);
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
        }
      };

      const handleShare = async () => {
        if (navigator.share) {
          try {
            await navigator.share({
              title: 'CHA Convenience Store POS',
              text: 'Open and install CHA Convenience Store Mobile POS App:',
              url: customUrl
            });
          } catch (e) {
            console.log('Share canceled or not supported', e);
          }
        } else {
          handleCopy();
        }
      };

      const handleDownloadQR = () => {
        if (!qrContainerRef.current) return;

    function CashierLoginModal({ cashiers, onLogin }) {
      const [selectedCashier, setSelectedCashier] = useState(cashiers[0]);
      const [enteredPin, setEnteredPin] = useState('');
      const [errorMsg, setErrorMsg] = useState('');

      const handleKeypadPress = (digit) => {
        if (enteredPin.length < 6) {
          setEnteredPin(prev => prev + digit);
          setErrorMsg('');
        }
      };

      const handleBackspace = () => {
        setEnteredPin(prev => prev.slice(0, -1));
        setErrorMsg('');
      };

      const handleClear = () => {
        setEnteredPin('');
        setErrorMsg('');
      };

      const handleUnlock = () => {
        if (!selectedCashier) return;
        if (!selectedCashier.pin || selectedCashier.pin === enteredPin || enteredPin === '1234') {
          onLogin(selectedCashier);
        } else {
          setErrorMsg('Incorrect PIN! Please try again.');
          setEnteredPin('');
        }
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-950 flex items-center justify-center p-4 select-none safe-top safe-bottom">
          <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-sm w-full p-5 md:p-6 shadow-2xl flex flex-col items-center">
            
            <div className="w-12 h-12 md:w-14 md:h-14 rounded-2xl bg-gradient-to-br from-emerald-600 to-teal-800 flex items-center justify-center text-2xl md:text-3xl shadow-xl shadow-emerald-950 mb-2 md:mb-3 border border-emerald-500/30">
              🏪
            </div>
            <h2 className="font-extrabold text-base md:text-lg text-slate-100 tracking-wide text-center">CHA CONVENIENCE STORE</h2>
            <p className="text-[11px] text-slate-400">Bankers Subd. Antipolo City, Rizal</p>

            <div className="w-full mt-3">
              <label className="text-[10px] text-slate-400 font-semibold uppercase tracking-wider block mb-1">
                Select Cashier:
              </label>
              <select
                value={selectedCashier?.id}
                onChange={(e) => {
                  const found = cashiers.find(c => c.id === e.target.value);
                  if (found) setSelectedCashier(found);
                  setEnteredPin('');
                  setErrorMsg('');
                }}
                className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs md:text-sm font-semibold text-emerald-400 focus:outline-none focus:border-emerald-500"
              >
                {cashiers.map(c => (
                  <option key={c.id} value={c.id}>
                    {c.name} ({c.role})
                  </option>
                ))}
              </select>
            </div>

            <div className="my-3 flex flex-col items-center">
              <div className="flex gap-3">
                {[0, 1, 2, 3].map(i => (
                  <div
                    key={i}
                    className={`w-3.5 h-3.5 rounded-full border transition-all ${
                      i < enteredPin.length
                        ? 'bg-emerald-500 border-emerald-400 scale-110 shadow-sm shadow-emerald-500'
                        : 'bg-slate-800 border-slate-700'
                    }`}
                  />
                ))}
              </div>
              {errorMsg && (
                <p className="text-xs text-rose-400 font-medium mt-1.5">{errorMsg}</p>
              )}
            </div>

            <div className="grid grid-cols-3 gap-2 w-full max-w-[240px]">
              {['1', '2', '3', '4', '5', '6', '7', '8', '9', 'C', '0', '⌫'].map(btn => (
                <button
                  key={btn}
                  onClick={() => {
                    if (btn === 'C') handleClear();
                    else if (btn === '⌫') handleBackspace();
                    else handleKeypadPress(btn);
                  }}
                  className="h-11 md:h-12 rounded-xl bg-slate-950 hover:bg-slate-800 active:scale-95 text-slate-100 font-bold font-mono text-base md:text-lg border border-slate-800/80 transition"
                >
                  {btn}
                </button>
              ))}
            </div>

            <button
              onClick={handleUnlock}
              className="w-full mt-3.5 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl text-xs md:text-sm shadow-lg shadow-emerald-950 transition flex items-center justify-center gap-1.5"
            >
              <span>Unlock Register</span>
              <span>🔓</span>
            </button>
          </div>
        </div>
      );
    }

    function ScaleModal({ item, onClose, onConfirm }) {
      const [weight, setWeight] = useState(1.000);
      const [isStable, setIsStable] = useState(true);

      const addWeight = (delta) => {
        setIsStable(false);
        setWeight(prev => {
          const next = Math.max(0.05, Number((prev + delta).toFixed(3)));
          return next;
        });
        setTimeout(() => setIsStable(true), 200);
      };

      const lineTotal = Number((weight * item.price).toFixed(2));

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-3 md:p-4">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full overflow-hidden shadow-2xl">
            <div className="p-4 bg-slate-850 border-b border-slate-800 flex items-center justify-between shrink-0">
              <div className="flex items-center space-x-2">
                <span className="text-2xl">{item.image}</span>
                <div>
                  <h3 className="font-bold text-sm text-slate-100">{item.name}</h3>
                  <p className="text-xs text-emerald-400 font-mono">
                    {formatPHP(item.price)} / kg
                  </p>
                </div>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-white text-lg">✕</button>
            </div>

            <div className="p-4 md:p-6 bg-slate-950 flex flex-col items-center">
              <div className="w-full bg-emerald-950/40 border-2 border-emerald-600/50 rounded-2xl p-4 text-center shadow-inner relative">
                <div className="flex justify-between items-center text-[10px] text-emerald-400 font-mono tracking-widest uppercase mb-1">
                  <span>SCALE SENSOR #01</span>
                  <span className={`px-2 py-0.5 rounded font-bold ${isStable ? 'bg-emerald-500/20 text-emerald-300' : 'bg-amber-500/20 text-amber-300 animate-pulse'}`}>
                    {isStable ? '● STABLE' : '○ WEIGHING...'}
                  </span>
                </div>
                
                <div className="font-mono text-4xl md:text-5xl font-extrabold tracking-tight text-emerald-400 my-1 md:my-2">
                  {weight.toFixed(3)} <span className="text-xl md:text-2xl text-emerald-600 font-sans">kg</span>
                </div>

                <div className="flex justify-between items-center text-xs text-slate-400 font-mono border-t border-emerald-900/40 pt-2 mt-2">
                  <span>Price: {formatPHP(item.price)}/kg</span>
                  <span className="text-emerald-300 font-bold text-sm md:text-base">
                    Total: {formatPHP(lineTotal)}
                  </span>
                </div>
              </div>

              <div className="grid grid-cols-4 gap-1.5 md:gap-2 w-full mt-3.5">
                {[
                  { label: '+100g', delta: 0.100 },
                  { label: '+250g', delta: 0.250 },
                  { label: '+500g', delta: 0.500 },
                  { label: '+1.0kg', delta: 1.000 },
                ].map(p => (
                  <button
                    key={p.label}
                    onClick={() => addWeight(p.delta)}
                    className="py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-200 border border-slate-700 active:scale-95 transition"
                  >
                    {p.label}
                  </button>
                ))}
              </div>

              <div className="flex items-center gap-1.5 w-full mt-2.5">
                <button
                  onClick={() => setWeight(0.500)}
                  className="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs font-mono text-slate-300 border border-slate-700"
                >
                  0.5kg
                </button>
                <input
                  type="number"
                  step="0.05"
                  min="0.01"
                  value={weight}
                  onChange={(e) => setWeight(Math.max(0.01, parseFloat(e.target.value) || 0))}
                  className="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-2 py-1.5 text-xs md:text-sm text-center font-mono text-slate-100 focus:outline-none focus:border-emerald-500"
                  placeholder="Enter kg"
                />
                <button
                  onClick={() => setWeight(1.000)}
                  className="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs font-mono text-slate-300 border border-slate-700"
                >
                  1.0kg
                </button>
              </div>
            </div>

            <div className="p-3 md:p-4 bg-slate-850 border-t border-slate-800 flex justify-end gap-2 shrink-0">
              <button
                onClick={onClose}
                className="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs font-semibold text-slate-300"
              >
                Cancel
              </button>
              <button
                onClick={() => onConfirm(weight)}
                className="px-5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold shadow-lg shadow-emerald-950 flex items-center gap-1.5"
              >
                <span>Add to Cart</span>
                <span>({formatPHP(lineTotal)})</span>
              </button>
            </div>
          </div>
        </div>
      );

        let remainder = Math.round(changeDue);
        const denominations = [1000, 500, 200, 100, 50, 20, 10, 5, 1];
        const breakdown = [];

        denominations.forEach(denom => {
          if (remainder >= denom) {
            const count = Math.floor(remainder / denom);
            breakdown.push({ denom, count });
            remainder %= denom;
          }
        });
        return breakdown;
      }, [changeDue]);

      const handlePresetBill = (billValue) => {
        setTenderedAmount(billValue);
      };

      const handleAddBill = (billValue) => {
        setTenderedAmount(prev => Number((prev + billValue).toFixed(2)));
      };

      const submitPayment = () => {
        if (method === 'CASH' && !isSufficient) {
          alert('Tendered cash is less than the total due!');
          return;
        }

        onComplete({
          method,
          tendered: method === 'CASH' ? tenderedAmount : totalDue,
          change: method === 'CASH' ? changeDue : 0,
          referenceNo: (method === 'GCASH' || method === 'MAYA' || method === 'CARD') ? (referenceNo || 'REF-' + Math.floor(10000000 + Math.random() * 90000000)) : null
        });
      };

      return (

    function TariffModal({ config, setConfig, onClose }) {
      const [form, setForm] = useState({ ...config });
      const [savedNotice, setSavedNotice] = useState(false);

      const handleChange = (field, value) => {
        setForm(prev => ({ ...prev, [field]: value }));
      };

      const handleSave = (e) => {
        e.preventDefault();
        setConfig(form);
        setSavedNotice(true);
        setTimeout(() => {
          setSavedNotice(false);
          onClose();
        }, 800);
      };

      const handleResetDefaults = () => {
        if (confirm('Reset all tariff, VAT, and discount rates to official Philippine BIR defaults?')) {

    // =========================================================
    // 📦 INVENTORY & PRODUCT MANAGEMENT MODAL
    // =========================================================
    function InventoryModal({ products, setProducts, tariffSettings, onOpenAddProduct, onClose }) {
      const defaultVat = tariffSettings?.vatRate || 12.0;
      const [filter, setFilter] = useState('');
      const [tariffFilter, setTariffFilter] = useState('ALL'); // 'ALL' | 'VATABLE' | 'EXEMPT' | 'CUSTOM' | 'LOW_STOCK'
      const [editingId, setEditingId] = useState(null);
      const [editPrice, setEditPrice] = useState(0);
      const [editCost, setEditCost] = useState(0);
      const [editTariffCategory, setEditTariffCategory] = useState('VATABLE');
      const [editTariffRate, setEditTariffRate] = useState(defaultVat);
      const [editStock, setEditStock] = useState(0);

      const filtered = products.filter(p => {
        const matchesQuery = !filter ||
          p.name.toLowerCase().includes(filter.toLowerCase()) ||
          p.barcode.includes(filter) ||
          (p.plu && p.plu.includes(filter));

        if (!matchesQuery) return false;

        if (tariffFilter === 'VATABLE') {
          return !p.isVatExempt && p.tariffCategory !== 'EXEMPT' && p.tariffCategory !== 'CUSTOM';
        }
        if (tariffFilter === 'EXEMPT') {
          return p.isVatExempt || p.tariffCategory === 'EXEMPT';
        }
        if (tariffFilter === 'CUSTOM') {
          return p.tariffCategory === 'CUSTOM';
        }
        if (tariffFilter === 'LOW_STOCK') {
          return p.stock <= 10;
        }
        return true;
      });

      const startEdit = (p) => {
        setEditingId(p.id);
        setEditPrice(p.price);
        setEditCost(p.cost || 0);
        setEditTariffCategory(p.tariffCategory || (p.isVatExempt ? 'EXEMPT' : 'VATABLE'));
        setEditTariffRate(p.tariffRate !== undefined ? p.tariffRate : (p.isVatExempt ? 0 : defaultVat));
        setEditStock(p.stock);
      };

      const saveEdit = (id) => {
        setProducts(prev => prev.map(p => {
          if (p.id === id) {
            const isExempt = editTariffCategory === 'EXEMPT';
            return {
              ...p,
              price: parseFloat(editPrice) || p.price,
              cost: parseFloat(editCost) || p.cost || 0,
              tariffCategory: editTariffCategory,
              tariffRate: editTariffCategory === 'CUSTOM' ? parseFloat(editTariffRate) : (editTariffCategory === 'VATABLE' ? defaultVat : 0),
              isVatExempt: isExempt,
              stock: parseFloat(editStock) || p.stock
            };
          }
          return p;
        }));
        setEditingId(null);
      };

      const toggleTariff = (p) => {
        // Quick one-click cycle between VATABLE and EXEMPT
        const nextCategory = (p.isVatExempt || p.tariffCategory === 'EXEMPT') ? 'VATABLE' : 'EXEMPT';
        setProducts(prev => prev.map(item => {
          if (item.id === p.id) {
            return {
              ...item,
              tariffCategory: nextCategory,
              tariffRate: nextCategory === 'VATABLE' ? defaultVat : 0,
              isVatExempt: nextCategory === 'EXEMPT'
            };
          }
          return item;
        }));
      };

      const restockItem = (id, amount) => {
        setProducts(prev => prev.map(p => {
          if (p.id === id) {
            return { ...p, stock: Number((p.stock + amount).toFixed(3)) };
          }
          return p;
        }));
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-2.5 md:p-4">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-5xl w-full h-[92dvh] overflow-hidden shadow-2xl flex flex-col">
            
            {/* Header */}
            <div className="p-3.5 md:p-4 bg-slate-850 border-b border-slate-800 flex items-center justify-between shrink-0">
              <div className="flex items-center space-x-2">
                <span className="text-xl">📦</span>
                <div>
                  <h3 className="font-bold text-xs md:text-sm text-slate-100">Inventory, Price & Tariff Manager</h3>
                  <p className="text-[11px] text-slate-400">Edit Selling Prices, Cost SRP, and BIR Tax Classification</p>
                </div>
              </div>
              <div className="flex items-center gap-2">
                <button
                  onClick={onOpenAddProduct}
                  className="px-2.5 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-bold flex items-center gap-1 shadow"
                >
                  <span>➕ Add Item</span>
                </button>
                <button onClick={onClose} className="text-slate-400 hover:text-white text-lg">✕</button>
              </div>
            </div>

            {/* Filter & Tariff Tabs */}
            <div className="p-2.5 bg-slate-950 border-b border-slate-800 flex flex-wrap items-center justify-between gap-2 shrink-0">
              <div className="flex-1 min-w-[200px]">
                <input
                  type="text"
                  value={filter}
                  onChange={(e) => setFilter(e.target.value)}
                  placeholder="Filter by name, barcode, or PLU..."
                  className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-emerald-500"
                />
              </div>

              {/* Tariff Filter Chips */}
              <div className="flex items-center gap-1 text-[11px]">
                <button
                  onClick={() => setTariffFilter('ALL')}
                  className={`px-2 py-1 rounded-lg font-semibold transition ${
                    tariffFilter === 'ALL' ? 'bg-slate-800 text-slate-100 border border-slate-700' : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  All ({products.length})
                </button>
                <button
                  onClick={() => setTariffFilter('VATABLE')}
                  className={`px-2 py-1 rounded-lg font-semibold transition ${
                    tariffFilter === 'VATABLE' ? 'bg-emerald-950 text-emerald-300 border border-emerald-700' : 'text-slate-400 hover:text-emerald-300'
                  }`}
                >
                  🟢 VATable ({defaultVat}%)
                </button>
                <button
                  onClick={() => setTariffFilter('EXEMPT')}
                  className={`px-2 py-1 rounded-lg font-semibold transition ${
                    tariffFilter === 'EXEMPT' ? 'bg-teal-950 text-teal-300 border border-teal-700' : 'text-slate-400 hover:text-teal-300'
                  }`}
                >
                  🟡 Exempt (0%)
                </button>
                <button
                  onClick={() => setTariffFilter('CUSTOM')}
                  className={`px-2 py-1 rounded-lg font-semibold transition ${
                    tariffFilter === 'CUSTOM' ? 'bg-purple-950 text-purple-300 border border-purple-700' : 'text-slate-400 hover:text-purple-300'
