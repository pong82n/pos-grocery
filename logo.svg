<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Shield Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="45%" stop-color="#047857"/>
      <stop offset="80%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </radialGradient>

    <!-- Golden Highlights -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Fresh Apple Red -->
    <linearGradient id="appleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <!-- Carrot Orange -->
    <linearGradient id="carrotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Leaf Green -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Cart Basket Metal / Teal Gradient -->
    <linearGradient id="basketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadowMain" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glowGold" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#fbbf24" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Rounded Badge / App Icon -->
  <rect width="512" height="512" rx="124" fill="url(#bgGrad)"/>
  <rect x="18" y="18" width="476" height="476" rx="106" fill="none" stroke="#34d399" stroke-width="3.5" stroke-opacity="0.35"/>
  <rect x="26" y="26" width="460" height="460" rx="98" fill="none" stroke="#fde047" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- Grocery Elements & Cart Group -->
  <g filter="url(#shadowMain)">
    <!-- Store Awning / Canopy Roof -->
    <path d="M120 156 L392 156 L376 198 L136 198 Z" fill="#ffffff" opacity="0.95"/>
    <!-- Canopy Stripes (Emerald & Gold) -->
    <path d="M152 156 L168 156 L160 198 L144 198 Z" fill="#059669"/>
    <path d="M192 156 L208 156 L200 198 L184 198 Z" fill="#d97706"/>
    <path d="M232 156 L248 156 L240 198 L224 198 Z" fill="#059669"/>
    <path d="M272 156 L288 156 L280 198 L264 198 Z" fill="#d97706"/>
    <path d="M312 156 L328 156 L320 198 L304 198 Z" fill="#059669"/>
    <path d="M352 156 L368 156 L360 198 L344 198 Z" fill="#d97706"/>

    <!-- Fresh Produce Overflowing Behind Banner -->
    <!-- Leafy Greens Left -->
    <path d="M182 144 C168 116 194 92 216 112 C238 92 258 118 244 144 Z" fill="url(#leafGrad)"/>
    <path d="M208 126 C214 100 236 82 254 102 C266 84 286 106 274 132 Z" fill="url(#leafGrad)" opacity="0.9"/>
    
    <!-- Fresh Red Apple with Stem & Leaf -->
    <circle cx="218" cy="148" r="28" fill="url(#appleGrad)"/>
    <path d="M218 120 C222 108 228 104 232 102" stroke="#78350f" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M232 106 C242 102 248 108 244 118 C236 118 232 112 232 106 Z" fill="#22c55e"/>

    <!-- Fresh Orange / Citrus Right -->
    <circle cx="294" cy="146" r="26" fill="url(#goldGrad)"/>
    <circle cx="294" cy="126" r="3" fill="#15803d"/>

    <!-- Crisp Carrot -->
    <path d="M268 110 L256 160 L248 158 L254 108 Z" fill="url(#carrotGrad)"/>
    <path d="M260 108 C262 96 256 88 250 82" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M263 107 C270 98 274 94 276 86" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Golden Wheat / Grains Framing Left & Right -->
    <g opacity="0.85">
      <!-- Left Wheat -->
      <ellipse cx="140" cy="130" rx="6" ry="12" transform="rotate(-30 140 130)" fill="url(#goldGrad)"/>
      <ellipse cx="132" cy="116" rx="6" ry="12" transform="rotate(-20 132 116)" fill="url(#goldGrad)"/>
      <ellipse cx="128" cy="100" rx="5" ry="10" transform="rotate(-10 128 100)" fill="url(#goldGrad)"/>
      <!-- Right Wheat -->
      <ellipse cx="372" cy="130" rx="6" ry="12" transform="rotate(30 372 130)" fill="url(#goldGrad)"/>
      <ellipse cx="380" cy="116" rx="6" ry="12" transform="rotate(20 380 116)" fill="url(#goldGrad)"/>
      <ellipse cx="384" cy="100" rx="5" ry="10" transform="rotate(10 384 100)" fill="url(#goldGrad)"/>
    </g>

    <!-- Main Signboard Container (Crisp White Card) -->
    <rect x="96" y="196" width="320" height="196" rx="28" fill="url(#basketGrad)"/>
    <rect x="100" y="200" width="312" height="188" rx="24" fill="none" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Small Top Ribbon: "FRESH & CONVENIENT" -->
    <rect x="176" y="210" width="160" height="22" rx="11" fill="#047857"/>
    <text x="256" y="225" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="800" fill="#fde047" text-anchor="middle" letter-spacing="2.5">★ FRESH &amp; QUALITY ★</text>

    <!-- Primary Brand Wordmark: "CHA" -->
    <!-- Subtle drop shadow layer for text -->
    <text x="256" y="306" font-family="'Arial Black', -apple-system, Impact, sans-serif" font-size="88" font-weight="900" fill="#064e3b" text-anchor="middle" letter-spacing="4" opacity="0.3">CHA</text>
    <!-- Foreground CHA with Emerald Color -->
    <text x="256" y="302" font-family="'Arial Black', -apple-system, Impact, sans-serif" font-size="88" font-weight="900" fill="#047857" text-anchor="middle" letter-spacing="4">CHA</text>

    <!-- Subtitle: "GROCERY STORE" -->
    <text x="256" y="342" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#b45309" text-anchor="middle" letter-spacing="6">GROCERY</text>
    <text x="256" y="362" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#64748b" text-anchor="middle" letter-spacing="8">SUPERMARKET</text>

    <!-- Bottom Shopping Cart Bar Accent with Wheels -->
    <g transform="translate(0, 8)">
      <!-- Cart Base Wire -->
      <path d="M152 396 L360 396" stroke="#047857" stroke-width="6" stroke-linecap="round"/>
      <path d="M168 396 L180 422 L332 422 L344 396" stroke="#059669" stroke-width="4" stroke-linejoin="round" fill="#ecfdf5"/>
      <circle cx="196" cy="432" r="10" fill="#0f172a" stroke="#f59e0b" stroke-width="3"/>
      <circle cx="316" cy="432" r="10" fill="#0f172a" stroke="#f59e0b" stroke-width="3"/>
      <circle cx="196" cy="432" r="3" fill="#ffffff"/>
      <circle cx="316" cy="432" r="3" fill="#ffffff"/>
    </g>

    <!-- Floating Top Peso / Freshness Seal Badge -->
    <g filter="url(#glowGold)">
      <circle cx="256" cy="94" r="34" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="4"/>
      <!-- Inner Ring -->
      <circle cx="256" cy="94" r="28" fill="none" stroke="#78350f" stroke-width="1.5" stroke-dasharray="3 3"/>
      <!-- Philippine Peso Symbol -->
      <text x="256" y="106" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="900" fill="#78350f" text-anchor="middle">₱</text>
    </g>
  </g>
</svg>