<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="chaBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="chaAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="chaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#047857" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Rounded Shield -->
  <rect width="512" height="512" rx="120" fill="url(#chaBgGrad)"/>
  <rect x="20" y="20" width="472" height="472" rx="100" fill="none" stroke="#34d399" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Store Roof Awning / Canopy -->
  <g filter="url(#chaGlow)">
    <path d="M96 170 L416 170 L396 215 L116 215 Z" fill="#fbbf24"/>
    <!-- Canopy Stripes -->
    <path d="M136 170 L156 215 L196 215 L176 170 Z" fill="#b45309"/>
    <path d="M236 170 L256 215 L296 215 L276 170 Z" fill="#b45309"/>
    <path d="M336 170 L356 215 L396 215 L376 170 Z" fill="#b45309"/>

    <!-- Main Storefront White Arch Container -->
    <rect x="116" y="215" width="280" height="185" rx="20" fill="#ffffff"/>
    
    <!-- Bold 'CHA' Branding Letters -->
    <text x="256" y="295" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="900" fill="#047857" text-anchor="middle" letter-spacing="2">CHA</text>
    <text x="256" y="335" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#d97706" text-anchor="middle" letter-spacing="4">CONVENIENCE STORE</text>

    <!-- Shopping Basket Icon & Peso Badge -->
    <path d="M190 355 L322 355 L310 385 C308 390 300 393 294 393 L218 393 C212 393 204 390 202 385 Z" fill="url(#chaAccentGrad)"/>
    
    <!-- 24/7 / Fresh Badge -->
    <circle cx="256" cy="140" r="42" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="5"/>
    <text x="256" y="155" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="900" fill="#78350f" text-anchor="middle">₱</text>
  </g>
</svg>
